<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>广东新能源导航</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; background: #fff; height: 100vh; touch-action: manipulation; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .search-container { position: absolute; top: 0; left: 0; right: 0; z-index: 200; padding: 12px; background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 100%); }
        
        .search-bar { background: #fff; border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); display: flex; align-items: center; padding: 0 16px; height: 52px; }
        .search-icon { font-size: 20px; color: #1677ff; }
        .search-bar input { flex: 1; border: none; outline: none; font-size: 16px; color: #333; background: transparent; padding: 0 12px; }
        .search-btn { background: #1677ff; color: white; padding: 8px 16px; border-radius: 20px; border: none; cursor: pointer; font-size: 14px; }

        .suggestions { position: absolute; top: 72px; left: 12px; right: 12px; background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); max-height: 50vh; overflow-y: auto; z-index: 201; display: none; }
        .suggestion-item { padding: 14px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item .name { font-size: 15px; color: #333; font-weight: 500; }
        .suggestion-item .addr { font-size: 12px; color: #999; margin-top: 4px; }

        .locate-btn { position: absolute; right: 12px; bottom: 140px; width: 48px; height: 48px; background: #fff; border-radius: 50%; box-shadow: 0 4px 16px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; z-index: 100; }
        .locate-btn.locating { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 4px 16px rgba(22,119,255,0.3); } 50% { box-shadow: 0 4px 24px rgba(22,119,255,0.6); } }

        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; z-index: 100; }
        .bottom-nav::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: #e8e8e8; }
        
        .nav-items { display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 4px; cursor: pointer; }
        .nav-item .icon { font-size: 24px; margin-bottom: 4px; }
        .nav-item .label { font-size: 11px; color: #666; }

        /* 路线规划面板 - 高德风格 */
        .route-panel { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; z-index: 99; display: none; max-height: 70vh; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); }
        .route-panel.show { display: block; }
        .route-panel::before { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 36px; height: 4px; background: #d9d9d9; border-radius: 2px; }

        .route-header { padding: 24px 16px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; }
        .route-title { font-size: 16px; font-weight: 600; color: #333; }

        .route-modes { display: flex; padding: 12px 16px; gap: 8px; overflow-x: auto; border-bottom: 1px solid #f0f0f0; }
        .route-modes::-webkit-scrollbar { display: none; }
        .mode-btn { flex: 0 0 auto; padding: 8px 16px; background: #f5f5f5; border-radius: 20px; font-size: 13px; color: #666; border: none; cursor: pointer; }
        .mode-btn.active { background: #1677ff; color: #fff; }

        .route-summary-card { margin: 12px; padding: 16px; background: linear-gradient(135deg, #1677ff, #0958d9); border-radius: 12px; color: #fff; }
        .route-summary-card .title { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
        .route-summary-card .stats { display: flex; gap: 20px; }
        .route-summary-card .stat { text-align: center; }
        .route-summary-card .value { font-size: 24px; font-weight: 700; }
        .route-summary-card .label { font-size: 12px; opacity: 0.8; }

        .route-list { max-height: 35vh; overflow-y: auto; padding: 0 12px 16px; }
        .route-item { background: #fff; border: 2px solid #f0f0f0; border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
        .route-item.active { border-color: #1677ff; background: #f0f7ff; }
        .route-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .route-item-name { font-size: 15px; font-weight: 600; color: #333; }
        .route-item-time { font-size: 14px; color: #1677ff; font-weight: 500; }
        .route-item-detail { font-size: 12px; color: #999; line-height: 1.5; }
        .route-item-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .route-tag { font-size: 11px; padding: 3px 8px; background: #f0f5ff; color: #597ef7; border-radius: 4px; }
        .route-tag.orange { background: #fff7e6; color: #fa8c16; }
        .route-tag.green { background: #f6ffed; color: #52c41a; }

        .route-navi-btn { margin: 0 12px 16px; padding: 14px; background: linear-gradient(135deg, #1677ff, #0958d9); color: #fff; border: none; border-radius: 25px; font-size: 16px; font-weight: 600; cursor: pointer; width: calc(100% - 24px); }

        /* POI结果面板 */
        .poi-panel { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; z-index: 98; display: none; max-height: 70vh; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); }
        .poi-panel.show { display: block; }
        .poi-panel::before { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 36px; height: 4px; background: #d9d9d9; border-radius: 2px; }

        .poi-header { padding: 24px 16px 12px; border-bottom: 1px solid #f0f0f0; }
        .poi-title { font-size: 16px; font-weight: 600; color: #333; }
        .poi-count { font-size: 13px; color: #999; margin-top: 4px; }

        .poi-list { max-height: 55vh; overflow-y: auto; padding: 12px; }
        .poi-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
        .poi-card:active { background: #f5f7fa; }
        .poi-card-main { display: flex; justify-content: space-between; align-items: flex-start; }
        .poi-card-name { font-size: 15px; font-weight: 600; color: #333; flex: 1; }
        .poi-card-dist { font-size: 14px; color: #1677ff; font-weight: 500; }
        .poi-card-addr { font-size: 12px; color: #999; margin-top: 6px; line-height: 1.4; }
        .poi-card-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .poi-card-tag { font-size: 11px; padding: 3px 8px; background: #f0f5ff; color: #597ef7; border-radius: 4px; }
        .poi-card-tag.orange { background: #fff7e6; color: #fa8c16; }
        .poi-card-tag.green { background: #f6ffed; color: #52c41a; }
        .poi-card-tag.red { background: #fff1f0; color: #ff4d4f; }

        /* POI详情面板 */
        .detail-panel { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; z-index: 97; display: none; border-radius: 20px 20px 0 0; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
        .detail-panel.show { display: block; }
        .detail-panel::before { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 36px; height: 4px; background: #d9d9d9; border-radius: 2px; }

        .detail-content { padding: 24px 16px 16px; }
        .detail-name { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 8px; }
        .detail-addr { font-size: 14px; color: #666; line-height: 1.5; margin-bottom: 12px; }
        .detail-price { font-size: 20px; color: #ff6b00; font-weight: 600; margin-bottom: 12px; }
        .detail-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .detail-tag { font-size: 12px; padding: 4px 10px; background: #f0f5ff; color: #597ef7; border-radius: 6px; }
        .detail-tag.orange { background: #fff7e6; color: #fa8c16; }
        .detail-tag.green { background: #f6ffed; color: #52c41a; }

        .detail-actions { display: flex; gap: 12px; }
        .detail-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; }
        .detail-btn.secondary { background: #f5f5f5; color: #333; }
        .detail-btn.primary { background: linear-gradient(135deg, #1677ff, #0958d9); color: #fff; }

        /* 导航面板 */
        .navi-panel { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.98); z-index: 200; display: none; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
        .navi-panel.show { display: block; }
        .navi-content { text-align: center; padding: 20px 0; }
        .navi-distance { font-size: 48px; font-weight: 700; color: #333; }
        .navi-label { font-size: 14px; color: #999; margin-top: 8px; }
        .navi-progress { height: 4px; background: #f0f0f0; border-radius: 2px; margin: 20px 0; overflow: hidden; }
        .navi-progress-bar { height: 100%; background: linear-gradient(90deg, #1677ff, #0958d9); border-radius: 2px; transition: width 0.3s; }
        .navi-actions { display: flex; gap: 12px; }
        .navi-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; }
        .navi-btn.secondary { background: #f5f5f5; color: #333; }
        .navi-btn.primary { background: linear-gradient(135deg, #1677ff, #0958d9); color: #fff; }

        .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 24px; font-size: 14px; z-index: 9999; opacity: 0; transition: all 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .close-x { width: 32px; height: 32px; background: #f5f5f5; border-radius: 50%; border: none; cursor: pointer; font-size: 16px; color: #666; }

        .price-table { background: #fafafa; border-radius: 8px; padding: 12px; margin-top: 10px; }
        .price-table-title { font-size: 13px; color: #666; margin-bottom: 8px; font-weight: 500; }
        .price-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px solid #eee; }
        .price-row:last-child { border-bottom: none; }
        .price-row .time { color: #999; }
        .price-row .amount { color: #333; font-weight: 500; }
        .price-row.highlight .amount { color: #ff6b00; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="search-container">
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="搜索地点、停车场、充电站..." autocomplete="off">
            <button class="search-btn" onclick="doSearch()">搜索</button>
        </div>
    </div>

    <div class="suggestions" id="suggestions"></div>
    <div class="locate-btn" onclick="locateMe()" id="locateBtn">📍</div>

    <!-- POI列表面板 -->
    <div class="poi-panel" id="poiPanel">
        <div class="poi-header">
            <div class="poi-title" id="poiTitle">搜索结果</div>
            <div class="poi-count" id="poiCount"></div>
        </div>
        <div class="poi-list" id="poiList"></div>
    </div>

    <!-- POI详情面板 -->
    <div class="detail-panel" id="detailPanel">
        <div class="detail-content">
            <div class="detail-name" id="detailName">位置信息</div>
            <div class="detail-addr" id="detailAddr"></div>
            <div class="detail-price" id="detailPrice"></div>
            <div class="detail-tags" id="detailTags"></div>
            <div class="detail-price-table" id="detailPriceTable"></div>
            <div class="detail-actions">
                <button class="detail-btn secondary" onclick="closeDetail()">关闭</button>
                <button class="detail-btn primary" onclick="naviToHere()">到这里去</button>
            </div>
        </div>
    </div>

    <!-- 路线规划面板 -->
    <div class="route-panel" id="routePanel">
        <div class="route-header">
            <div class="route-title">路线规划</div>
            <button class="close-x" onclick="closeRoutePanel()">✕</button>
        </div>
        <div class="route-modes" id="routeModes">
            <button class="mode-btn active" onclick="switchMode('driving')">🚗 驾车</button>
            <button class="mode-btn" onclick="switchMode('transit')">🚌 公交</button>
            <button class="mode-btn" onclick="switchMode('walking')">🚶 步行</button>
            <button class="mode-btn" onclick="switchMode('riding')">🚴 骑行</button>
            <button class="mode-btn" onclick="switchMode('ev')">⚡ 电动车</button>
        </div>
        <div class="route-summary-card" id="routeSummary" style="display:none;">
            <div class="title" id="routeModeTitle">驾车路线</div>
            <div class="stats">
                <div class="stat"><div class="value" id="routeTime">0</div><div class="label">分钟</div></div>
                <div class="stat"><div class="value" id="routeDist">0</div><div class="label">公里</div></div>
                <div class="stat"><div class="value" id="routeToll">¥0</div><div class="label">高速费</div></div>
            </div>
        </div>
        <div class="route-list" id="routeList"></div>
        <button class="route-navi-btn" onclick="startNavi()" id="routeNaviBtn" style="display:none;">🚀 开始导航</button>
    </div>

    <!-- 导航面板 -->
    <div class="navi-panel" id="naviPanel">
        <div class="navi-content">
            <div class="navi-distance" id="naviDistance">0 km</div>
            <div class="navi-label">剩余距离</div>
            <div class="navi-progress"><div class="navi-progress-bar" id="naviProgressBar" style="width: 0%"></div></div>
        </div>
        <div class="navi-actions">
            <button class="navi-btn secondary" onclick="stopNavi()">结束导航</button>
            <button class="navi-btn primary" onclick="pauseNavi()" id="pauseBtn">暂停</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="bottom-nav">
        <div class="nav-items">
            <div class="nav-item" onclick="toggleTraffic()"><div class="icon">🚦</div><div class="label">路况</div></div>
            <div class="nav-item" onclick="searchNearby('停车场')"><div class="icon">🅿️</div><div class="label">停车场</div></div>
            <div class="nav-item" onclick="searchNearby('充电站')"><div class="icon">⚡</div><div class="label">充电</div></div>
            <div class="nav-item" onclick="locateMe()"><div class="icon">📍</div><div class="label">定位</div></div>
        </div>
    </div>

    <script src="https://webapi.amap.com/maps?v=2.0&key=8429788d2971b1eb0b278b878180ce92&plugin=AMap.TileLayer.Traffic"></script>
    <script>
        const AMAP_KEY = '8429788d2971b1eb0b278b878180ce92';

        var map, myMarker, destMarker;
        var markers = [], routeLine = null;
        var userPos = [113.2644, 23.1291];
        var trafficOn = false, trafficLayer = null;
        var selectedPOI = null, currentPOIs = [];
        var currentMode = 'driving', currentRoutes = [];
        var jsonpCounter = 0;
        var totalDist = 0, naviInterval = null, naviPaused = false;

        function jsonp(url, params, callback) {
            var cb = 'cb_' + (++jsonpCounter);
            var script = document.createElement('script');
            script.src = url + '?' + Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&') + '&callback=__jsonp_' + cb + '&key=' + AMAP_KEY;
            
            window['__jsonp_' + cb] = function(data) {
                callback(data);
                delete window['__jsonp_' + cb];
                document.body.removeChild(script);
            };
            script.onerror = function() { callback({ status: '0' }); };
            document.body.appendChild(script);
            setTimeout(function() { if (window['__jsonp_' + cb]) { window['__jsonp_' + cb]({ status: '0' }); } }, 10000);
        }

        function toast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(function() { t.classList.remove('show'); }, 2000);
        }

        function initMap() {
            map = new AMap.Map('map', { zoom: 14, center: userPos, viewMode: '2D' });
            map.on('complete', tryLocate);
        }

        function tryLocate() {
            if (!navigator.geolocation) { setUserPos(userPos[0], userPos[1], '默认位置(广州)'); return; }
            document.getElementById('locateBtn').classList.add('locating');
            navigator.geolocation.getCurrentPosition(
                p => { document.getElementById('locateBtn').classList.remove('locating'); setUserPos(p.coords.longitude, p.coords.latitude, '定位成功'); },
                () => { document.getElementById('locateBtn').classList.remove('locating'); tryAmapLocate(); },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function tryAmapLocate() {
            try {
                AMap.plugin('AMap.Geolocation', function() {
                    new AMap.Geolocation({ enableHighAccuracy: true, timeout: 10000 })
                        .getCurrentPosition((s, r) => {
                            if (s === 'complete') setUserPos(r.position.lng, r.position.lat, '定位成功');
                            else setUserPos(userPos[0], userPos[1], '默认位置(广州)');
                        });
                });
            } catch(e) { setUserPos(userPos[0], userPos[1], '默认位置(广州)'); }
        }

        function setUserPos(lng, lat, msg) {
            userPos = [lng, lat];
            if (myMarker) map.remove(myMarker);
            myMarker = new AMap.Marker({
                position: userPos, map: map,
                icon: new AMap.Icon({ size: new AMap.Size(32, 32), image: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxMCIgZmlsbD0iIzE2NzdmZiIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjYiIGZpbGw9IiNmZmYiLz48L3N2Zz4=', imageSize: new AMap.Size(32, 32) }),
                offset: new AMap.Pixel(-16, -16)
            });
            map.setCenter(userPos);
            if (msg) toast(msg);
        }

        function locateMe() {
            document.getElementById('locateBtn').classList.add('locating');
            toast('正在定位...');
            tryLocate();
            setTimeout(() => document.getElementById('locateBtn').classList.remove('locating'), 3000);
        }

        // 搜索联想
        document.getElementById('searchInput').addEventListener('input', function(e) {
            var kw = e.target.value.trim();
            if (kw.length < 1) { document.getElementById('suggestions').style.display = 'none'; return; }
            jsonp('https://restapi.amap.com/v3/assistant/inputtips', { keywords: kw, location: userPos.join(','), city: '广州', datatype: 'poi' }, function(data) {
                if (data.status === '1' && data.tips && data.tips.length > 0) {
                    var html = '';
                    data.tips.slice(0, 8).forEach(function(tip) {
                        if (tip.location) {
                            html += '<div class="suggestion-item" onclick="selectTip(\'' + tip.name.replace(/'/g, "\\'") + '\',\'' + tip.location + '\',\'' + (tip.address||'').replace(/'/g, "\\'") + '\')">' +
                                '<div class="name">' + tip.name + '</div>' +
                                '<div class="addr">' + (tip.district||'') + ' ' + (tip.address||'') + '</div>' +
                                '</div>';
                        }
                    });
                    document.getElementById('suggestions').innerHTML = html;
                    document.getElementById('suggestions').style.display = 'block';
                } else {
                    document.getElementById('suggestions').style.display = 'none';
                }
            });
        });

        document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') doSearch(); });

        function selectTip(name, location, address) {
            document.getElementById('suggestions').style.display = 'none';
            document.getElementById('searchInput').value = name;
            var parts = location.split(',');
            if (parts.length >= 2) showDetail(name, address, [parseFloat(parts[0]), parseFloat(parts[1])], 'poi');
        }

        function doSearch() {
            var kw = document.getElementById('searchInput').value.trim();
            if (!kw) { toast('请输入搜索内容'); return; }
            document.getElementById('suggestions').style.display = 'none';
            closeAllPanels();
            toast('搜索中...');
            
            jsonp('https://restapi.amap.com/v3/place/text', { keywords: kw, city: '广州', offset: 20, page: 1, extensions: 'all' }, function(data) {
                if (data.status === '1' && data.pois && data.pois.length > 0) {
                    currentPOIs = data.pois.map(p => {
                        if (!p.location) return null;
                        var parts = p.location.split(',');
                        return { name: p.name, address: p.address || p.pname + p.cityname + p.adname, lngLat: [parseFloat(parts[0]), parseFloat(parts[1])], type: p.type || '', tel: p.tel || '' };
                    }).filter(p => p);
                    if (currentPOIs.length > 0) showPOIList(kw, currentPOIs, 'poi');
                    else toast('未找到相关结果');
                } else {
                    toast('未找到"' + kw + '"相关结果');
                }
            });
        }

        function searchNearby(kw) {
            closeAllPanels();
            toast('搜索附近' + kw + '...');
            
            jsonp('https://restapi.amap.com/v3/place/around', { keywords: kw, location: userPos.join(','), radius: 5000, offset: 20, page: 1, extensions: 'all', sort: 'distance' }, function(data) {
                if (data.status === '1' && data.pois && data.pois.length > 0) {
                    currentPOIs = data.pois.map(p => {
                        var parts = p.location.split(',');
                        return { name: p.name, address: p.address || p.pname + p.cityname + p.adname, lngLat: [parseFloat(parts[0]), parseFloat(parts[1])], distance: p.distance ? parseFloat(p.distance) : 0, type: p.type || '', tel: p.tel || '' };
                    });
                    showPOIList('附近的' + kw, currentPOIs, kw);
                } else {
                    toast('附近未找到' + kw);
                }
            });
        }

        function showPOIList(title, pois, kw) {
            document.getElementById('poiTitle').textContent = title;
            document.getElementById('poiCount').textContent = '共 ' + pois.length + ' 个结果';
            
            var html = '';
            pois.forEach(function(p, i) {
                var dist = p.distance ? (p.distance < 1000 ? p.distance + 'm' : (p.distance/1000).toFixed(1) + 'km') : '';
                var tags = getTags(p, kw);
                
                html += '<div class="poi-card" onclick="showDetail(\'' + p.name.replace(/'/g, "\\'") + '\',\'' + p.address.replace(/'/g, "\\'") + '\',[' + p.lngLat[0] + ',' + p.lngLat[1] + '],\'' + kw + '\')">' +
                    '<div class="poi-card-main"><div class="poi-card-name">' + p.name + '</div>' + (dist ? '<div class="poi-card-dist">' + dist + '</div>' : '') + '</div>' +
                    '<div class="poi-card-addr">' + p.address + '</div>';
                
                if (tags.length > 0) {
                    html += '<div class="poi-card-tags">';
                    tags.forEach(t => html += '<span class="poi-card-tag ' + t.type + '">' + t.text + '</span>');
                    html += '</div>';
                }
                html += '</div>';
            });
            
            document.getElementById('poiList').innerHTML = html;
            document.getElementById('poiPanel').classList.add('show');
        }

        function getTags(poi, kw) {
            var tags = [], name = poi.name || '', type = poi.type || '';
            
            if (kw === '停车场' || type.indexOf('停车场') !== -1) {
                if (/地下/.test(name+type)) tags.push({ text: '🅿️ 地下停车场', type: '' });
                else if (/路边|路侧/.test(name+type)) tags.push({ text: '🚧 路边停车', type: 'orange' });
                else if (/地面/.test(name)) tags.push({ text: '🏠 地面停车场', type: '' });
                else if (/商场|商业/.test(name+type)) tags.push({ text: '🏬 商场', type: '' });
                else if (/小区|住宅/.test(name+type)) tags.push({ text: '🏘️ 小区', type: 'red' });
                else if (/医院/.test(name)) tags.push({ text: '🏥 医院', type: '' });
                else if (/景区/.test(name)) tags.push({ text: '🏞️ 景区', type: '' });
                else tags.push({ text: '🏢 公共停车场', type: '' });
                
                if (/充电/.test(name+type)) tags.push({ text: '⚡ 有充电桩', type: 'green' });
                tags.push({ text: getParkingPriceText(name, type), type: '' });
            } else if (kw === '充电站' || type.indexOf('充电') !== -1) {
                if (/国家电网/.test(name)) tags.push({ text: '⚡ 国家电网', type: '' });
                else if (/特来电/.test(name)) tags.push({ text: '⚡ 特来电', type: '' });
                else if (/星星/.test(name)) tags.push({ text: '⚡ 星星充电', type: '' });
                else if (/特斯拉/.test(name)) tags.push({ text: '⚡ 特斯拉', type: 'green' });
                else if (/小桔/.test(name)) tags.push({ text: '⚡ 小桔充电', type: '' });
                else tags.push({ text: '⚡ 充电站', type: '' });
                
                var priceInfo = getChargingPriceInfo(name);
                tags.push({ text: priceInfo.text, type: priceInfo.type });
            }
            
            return tags;
        }

        function getParkingPriceText(name, type) {
            if (/商场|商业/.test(name+type)) return '💰 ¥10-15/时';
            if (/小区|住宅/.test(name+type)) return '💰 ¥5-8/时(业主)';
            if (/医院/.test(name)) return '💰 ¥6-10/时';
            if (/景区/.test(name)) return '💰 ¥15-20/时';
            if (/路边|路侧/.test(name+type)) return '💰 ¥8/时';
            return '💰 ¥8-12/时';
        }

        function getChargingPriceInfo(name) {
            var hour = new Date().getHours();
            var base = /国家电网/.test(name) ? 1.1 : /特来电/.test(name) ? 1.2 : /特斯拉/.test(name) ? 1.8 : /小桔/.test(name) ? 1.3 : /星星/.test(name) ? 1.0 : 1.0;
            
            var mult, period;
            if (hour >= 8 && hour < 11 || hour >= 14 && hour < 17 || hour >= 17 && hour < 21) { mult = 1.5; period = '峰时'; }
            else if (hour >= 11 && hour < 14) { mult = 1.2; period = '平时'; }
            else { mult = 0.6; period = '谷时'; }
            
            var price = (base * mult).toFixed(2);
            return { text: period + ' ¥' + price + '/度', type: mult > 1 ? 'orange' : 'green' };
        }

        function showPriceTable(name, kw) {
            if (kw === '停车场' || kw === '充电站') {
                var html = '<div class="price-table"><div class="price-table-title">' + (kw === '停车场' ? '💰 停车收费参考' : '⚡ 充电电价参考') + '</div>';
                
                if (kw === '停车场') {
                    html += '<div class="price-row"><span class="time">首小时</span><span class="amount">¥5-10</span></div>';
                    html += '<div class="price-row"><span class="time">超出部分</span><span class="amount">¥3-8/小时</span></div>';
                    html += '<div class="price-row"><span class="time">24小时封顶</span><span class="amount">¥50-80</span></div>';
                    if (/小区|住宅/.test(name)) html += '<div class="price-row highlight"><span class="time">业主优惠</span><span class="amount">¥3-5/小时</span></div>';
                } else {
                    var hour = new Date().getHours();
                    var base = /国家电网/.test(name) ? 1.1 : /特来电/.test(name) ? 1.2 : /特斯拉/.test(name) ? 1.8 : 1.0;
                    
                    html += '<div class="price-row' + (hour>=8&&hour<11||hour>=14&&hour<17||hour>=17&&hour<21?' highlight':'') + '"><span class="time">峰时 8-11, 14-17, 17-21</span><span class="amount">¥' + (base*1.5).toFixed(2) + '/度</span></div>';
                    html += '<div class="price-row' + (hour>=11&&hour<14?' highlight':'') + '"><span class="time">平时 11-14</span><span class="amount">¥' + (base*1.2).toFixed(2) + '/度</span></div>';
                    html += '<div class="price-row' + (hour<8||hour>=21?' highlight':'') + '"><span class="time">谷时 21-次日8</span><span class="amount">¥' + (base*0.6).toFixed(2) + '/度</span></div>';
                    html += '<div class="price-row"><span class="time">服务费</span><span class="amount">约¥0.5-1/度</span></div>';
                }
                html += '</div>';
                return html;
            }
            return '';
        }

        function showDetail(name, address, lngLat, kw) {
            selectedPOI = { name, address, lngLat, kw };
            
            if (destMarker) map.remove(destMarker);
            destMarker = new AMap.Marker({
                position: lngLat, map: map,
                icon: new AMap.Icon({ size: new AMap.Size(32, 40), image: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDMyIDQwIj48cGF0aCBkPSJNMTYgMEM5LjQgMCA0IDQuNCA0IDkuNWMwIDQuMyAzLjggNy41IDguMSA3LjVsMS40IDEuNGMuNC40IDEuMi40IDEuNyAwbDEuNC0xLjRDMTE4LjIgMTcgNDAgMTMuMSA0MCA5LjUgNDAgNC40IDM0LjYgMCAyNiAwaC0ycDAgNC40IDQgOS41IDguMSA3LjVsMS40IDEuNGMuNC40IDEuMi40IDEuNyAwem0iIGZpbGw9IiNmZjZiMDAiLz48L3N2Zz4=', imageSize: new AMap.Size(32, 40) }),
                offset: new AMap.Pixel(-16, -40)
            });
            markers.push(destMarker);
            map.setCenter(lngLat);
            
            document.getElementById('detailName').textContent = name;
            document.getElementById('detailAddr').innerHTML = '📍 ' + address;
            
            var tags = getTags({ name, type: '' }, kw);
            var tagsHtml = '';
            tags.forEach(t => tagsHtml += '<span class="detail-tag ' + t.type + '">' + t.text + '</span>');
            document.getElementById('detailTags').innerHTML = tagsHtml;
            
            // 价格显示
            var priceText = '';
            tags.forEach(t => { if (t.text.indexOf('¥') !== -1) priceText = t.text; });
            document.getElementById('detailPrice').textContent = priceText;
            
            // 价格表
            document.getElementById('detailPriceTable').innerHTML = showPriceTable(name, kw);
            
            closeAllPanels();
            document.getElementById('detailPanel').classList.add('show');
        }

        function closeDetail() { document.getElementById('detailPanel').classList.remove('show'); }

        function closeAllPanels() {
            document.getElementById('poiPanel').classList.remove('show');
            document.getElementById('detailPanel').classList.remove('show');
            document.getElementById('routePanel').classList.remove('show');
            document.getElementById('naviPanel').classList.remove('show');
        }

        function naviToHere() {
            if (!selectedPOI) return;
            closeAllPanels();
            showRoutePanel();
        }

        function showRoutePanel() {
            if (!selectedPOI) { toast('请先选择目的地'); return; }
            document.getElementById('routePanel').classList.add('show');
            planRoute();
        }

        function closeRoutePanel() { document.getElementById('routePanel').classList.remove('show'); }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.mode-btn:nth-child(' + ['driving','transit','walking','riding','ev'].indexOf(mode) + ')').classList.add('active');
            planRoute();
        }

        function planRoute() {
            if (!selectedPOI) return;
            toast('规划路线...');
            
            var origin = userPos.join(','), dest = selectedPOI.lngLat.join(',');
            var url, params;
            
            if (currentMode === 'driving' || currentMode === 'ev') {
                url = 'https://restapi.amap.com/v3/direction/driving';
                params = { origin, destination: dest, strategy: 0 };
            } else if (currentMode === 'transit') {
                url = 'https://restapi.amap.com/v3/direction/transit/integrated';
                params = { origin, destination: dest, city: '广州', strategy: 0 };
            } else if (currentMode === 'walking') {
                url = 'https://restapi.amap.com/v3/direction/walking';
                params = { origin, destination: dest };
            } else if (currentMode === 'riding') {
                url = 'https://restapi.amap.com/v4/direction/bicycling';
                params = { origin, destination: dest };
            }

            jsonp(url, params, function(data) {
                if (data.status === '1' && data.route && data.route.paths && data.route.paths.length > 0) {
                    currentRoutes = data.route.paths;
                    showRoutes(data.route.paths);
                } else {
                    toast('路线规划失败');
                }
            });
        }

        function showRoutes(paths) {
            var modeNames = { driving: '驾车', transit: '公交', walking: '步行', riding: '骑行', ev: '电动车' };
            var first = paths[0];
            
            // 显示摘要
            document.getElementById('routeSummary').style.display = 'block';
            document.getElementById('routeModeTitle').textContent = modeNames[currentMode] + '路线';
            document.getElementById('routeTime').textContent = first.duration ? Math.round(first.duration / 60) : '--';
            document.getElementById('routeDist').textContent = first.distance ? (first.distance / 1000).toFixed(1) : '--';
            document.getElementById('routeToll').textContent = first.tolls > 0 ? '¥' + first.tolls : '免费';
            
            totalDist = first.distance ? first.distance / 1000 : 0;
            
            // 显示路线列表
            var html = '';
            paths.forEach(function(path, i) {
                var dist = path.distance ? (path.distance / 1000).toFixed(1) + 'km' : '--';
                var time = path.duration ? Math.round(path.duration / 60) + '分钟' : '--';
                var toll = path.tolls > 0 ? '高速费¥' + path.tolls : '无高速费';
                var tag = i === 0 ? '推荐' : (i === 1 ? '备选' : '');
                
                html += '<div class="route-item' + (i === 0 ? ' active' : '') + '" onclick="selectRoute(' + i + ')">' +
                    '<div class="route-item-header">' +
                    '<div class="route-item-name">方案' + (i+1) + (tag ? ' · ' + tag : '') + '</div>' +
                    '<div class="route-item-time">' + time + '</div>' +
                    '</div>' +
                    '<div class="route-item-detail">' + dist + ' · ' + toll + '</div>' +
                    '</div>';
            });
            
            document.getElementById('routeList').innerHTML = html;
            document.getElementById('routeNaviBtn').style.display = 'block';
            
            // 默认绘制第一条
            selectRoute(0);
        }

        function selectRoute(idx) {
            document.querySelectorAll('.route-item').forEach((el, i) => el.classList.toggle('active', i === idx));
            
            var path = currentRoutes[idx];
            if (!path || !path.polyline) return;
            
            if (routeLine) map.remove(routeLine);
            var coords = path.polyline.split(';').map(p => {
                var parts = p.split(',');
                return [parseFloat(parts[0]), parseFloat(parts[1])];
            });
            
            routeLine = new AMap.Polyline({
                path: coords, strokeColor: '#1677ff', strokeWeight: 7, strokeOpacity: 0.9
            });
            routeLine.setMap(map);
            map.setFitView([routeLine]);
        }

        function startNavi() {
            document.getElementById('routePanel').classList.remove('show');
            document.getElementById('naviPanel').classList.add('show');
            document.getElementById('naviDistance').textContent = totalDist.toFixed(1) + ' km';
            document.getElementById('naviProgressBar').style.width = '0%';
            naviPaused = false;
            document.getElementById('pauseBtn').textContent = '暂停';
            
            var progress = 0;
            naviInterval = setInterval(function() {
                if (naviPaused) return;
                progress += 0.5;
                var remaining = Math.max(0, totalDist - (totalDist * progress / 100));
                document.getElementById('naviDistance').textContent = remaining.toFixed(1) + ' km';
                document.getElementById('naviProgressBar').style.width = progress + '%';
                
                if (progress >= 100) {
                    stopNavi();
                    toast('已到达目的地！');
                }
            }, 500);
        }

        function pauseNavi() {
            naviPaused = !naviPaused;
            document.getElementById('pauseBtn').textContent = naviPaused ? '继续' : '暂停';
        }

        function stopNavi() {
            document.getElementById('naviPanel').classList.remove('show');
            if (naviInterval) { clearInterval(naviInterval); naviInterval = null; }
        }

        function toggleTraffic() {
            if (trafficOn) {
                if (trafficLayer) map.remove(trafficLayer);
                trafficOn = false; toast('路况已关闭');
            } else {
                trafficLayer = new AMap.TileLayer.Traffic({ autoRefresh: true, interval: 180 });
                map.add(trafficLayer);
                trafficOn = true; toast('路况已开启');
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
