<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>广东新能源导航</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; background: #fff; height: 100vh; touch-action: manipulation; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .search-container { position: absolute; top: 0; left: 0; right: 0; z-index: 200; padding: 12px; background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0) 100%); }
        
        .search-bar { background: rgba(255,255,255,0.95); border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; align-items: center; padding: 0 16px; height: 48px; }
        .search-icon { font-size: 18px; color: #1677ff; }
        .search-bar input { flex: 1; border: none; outline: none; font-size: 15px; color: #333; background: transparent; padding: 0 12px; }
        .search-btn { background: #1677ff; color: white; padding: 8px 20px; border-radius: 20px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; }

        .suggestions { position: absolute; top: 68px; left: 12px; right: 12px; background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); max-height: 45vh; overflow-y: auto; z-index: 201; display: none; }
        .suggestion-item { padding: 12px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item .icon { font-size: 18px; }
        .suggestion-item .name { font-size: 15px; color: #333; font-weight: 500; }
        .suggestion-item .addr { font-size: 12px; color: #999; margin-top: 2px; }

        .locate-btn { position: absolute; right: 16px; top: 100px; width: 52px; height: 52px; background: #fff; border-radius: 50%; box-shadow: 0 4px 20px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; }
        .locate-btn.locating { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 4px 20px rgba(22,119,255,0.3); } 50% { box-shadow: 0 4px 30px rgba(22,119,255,0.5); } }

        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; z-index: 100; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); }
        
        .nav-items { display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px 4px; cursor: pointer; min-width: 60px; }
        .nav-item .icon { font-size: 26px; margin-bottom: 4px; }
        .nav-item .label { font-size: 11px; color: #999; }
        .nav-item.active .label { color: #1677ff; }

        /* 可拖动面板 */
        .drag-panel { position: absolute; bottom: 65px; left: 0; right: 0; background: #fff; z-index: 99; max-height: 65vh; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,0.1); display: none; }
        .drag-panel.show { display: block; }
        .drag-panel.collapsed { max-height: 170px; }
        .drag-panel.collapsed .panel-content { display: none; }
        .drag-panel.collapsed .panel-summary { display: block; }
        
        .drag-handle { height: 28px; display: flex; align-items: center; justify-content: center; cursor: grab; }
        .drag-bar { width: 44px; height: 6px; background: #d0d0d0; border-radius: 3px; }
        
        .panel-summary { display: none; padding: 0 16px 16px; }
        .mini-card { display: flex; align-items: center; gap: 12px; background: #f8f9fa; border-radius: 14px; padding: 14px; cursor: pointer; }
        .mini-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #1677ff, #0958d9); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; flex-shrink: 0; }
        .mini-info { flex: 1; min-width: 0; }
        .mini-name { font-size: 15px; font-weight: 600; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-addr { font-size: 12px; color: #999; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-extra { font-size: 12px; color: #1677ff; margin-top: 6px; font-weight: 500; }
        .mini-btn { padding: 10px 18px; background: linear-gradient(135deg, #1677ff, #0958d9); color: #fff; border: none; border-radius: 22px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        
        .panel-content { padding: 0 16px 16px; overflow-y: auto; max-height: calc(65vh - 44px); }
        .panel-title { font-size: 17px; font-weight: 600; color: #333; margin-bottom: 12px; }
        .panel-count { font-size: 13px; color: #999; margin-bottom: 16px; }

        /* 出行方式选择 */
        .mode-selector { display: flex; gap: 10px; padding: 0 0 16px; border-bottom: 1px solid #f0f0f0; margin-bottom: 16px; overflow-x: auto; }
        .mode-selector::-webkit-scrollbar { display: none; }
        .mode-chip { flex: 0 0 auto; padding: 10px 20px; background: #f5f7fa; border-radius: 22px; font-size: 14px; color: #666; cursor: pointer; border: 2px solid transparent; white-space: nowrap; transition: all 0.2s; }
        .mode-chip.active { background: #e6f4ff; color: #1677ff; border-color: #1677ff; }

        /* POI卡片 */
        .poi-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 16px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
        .poi-card:active { background: #f8f9fa; transform: scale(0.99); }
        .poi-main { display: flex; justify-content: space-between; align-items: flex-start; }
        .poi-name { font-size: 16px; font-weight: 600; color: #333; flex: 1; }
        .poi-dist { font-size: 14px; color: #1677ff; font-weight: 500; }
        .poi-addr { font-size: 13px; color: #999; margin-top: 8px; line-height: 1.5; }
        .poi-tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .poi-tag { font-size: 12px; padding: 4px 10px; background: #f0f5ff; color: #597ef7; border-radius: 6px; }
        .poi-tag.orange { background: #fff7e6; color: #fa8c16; }
        .poi-tag.green { background: #f6ffed; color: #52c41a; }
        .poi-tag.red { background: #fff1f0; color: #ff4d4f; }
        .poi-action { margin-top: 12px; }
        .poi-nav-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #1677ff, #0958d9); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; }

        /* 路线规划卡片 */
        .route-summary { padding: 20px; background: linear-gradient(135deg, #1677ff, #0958d9); border-radius: 16px; color: #fff; margin-bottom: 16px; }
        .route-summary .title { font-size: 15px; opacity: 0.9; margin-bottom: 12px; }
        .route-summary .stats { display: flex; gap: 24px; }
        .route-summary .stat { text-align: center; flex: 1; }
        .route-summary .value { font-size: 28px; font-weight: 700; }
        .route-summary .label { font-size: 12px; opacity: 0.85; margin-top: 4px; }

        .route-card { background: #fff; border: 2px solid #f0f0f0; border-radius: 16px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
        .route-card.active { border-color: #1677ff; background: #f0f7ff; }
        .route-card:active { transform: scale(0.99); }
        .route-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .route-name { font-size: 16px; font-weight: 600; color: #333; }
        .route-time { font-size: 15px; color: #1677ff; font-weight: 600; }
        .route-detail { font-size: 13px; color: #999; }

        .navi-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #1677ff, #0958d9); color: #fff; border: none; border-radius: 28px; font-size: 17px; font-weight: 600; cursor: pointer; margin-top: 16px; box-shadow: 0 4px 16px rgba(22,119,255,0.3); }

        /* POI详情 */
        .detail-header { padding: 0 0 16px; border-bottom: 1px solid #f0f0f0; }
        .detail-name { font-size: 20px; font-weight: 600; color: #333; }
        .detail-addr { font-size: 14px; color: #666; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
        .detail-price { font-size: 24px; color: #ff6b00; font-weight: 700; margin-top: 12px; }
        .detail-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
        .detail-tag { font-size: 13px; padding: 5px 12px; background: #f0f5ff; color: #597ef7; border-radius: 8px; }
        .detail-tag.orange { background: #fff7e6; color: #fa8c16; }
        .detail-tag.green { background: #f6ffed; color: #52c41a; }

        .price-table { background: #fafafa; border-radius: 12px; padding: 16px; margin-top: 16px; }
        .price-table-title { font-size: 14px; color: #666; margin-bottom: 12px; font-weight: 500; }
        .price-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px solid #eee; }
        .price-row:last-child { border-bottom: none; }
        .price-row .time { color: #999; }
        .price-row .amount { color: #333; font-weight: 500; }
        .price-row.highlight .amount { color: #ff6b00; font-weight: 600; }

        .detail-actions { display: flex; gap: 14px; margin-top: 20px; }
        .detail-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; }
        .detail-btn.secondary { background: #f5f5f5; color: #666; }
        .detail-btn.primary { background: linear-gradient(135deg, #1677ff, #0958d9); color: #fff; box-shadow: 0 4px 16px rgba(22,119,255,0.3); }

        /* 导航面板 */
        .navi-panel { position: absolute; bottom: 65px; left: 0; right: 0; background: rgba(255,255,255,0.98); z-index: 200; padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); display: none; }
        .navi-panel.show { display: block; }
        .navi-distance { font-size: 56px; font-weight: 700; color: #333; text-align: center; letter-spacing: -1px; }
        .navi-label { font-size: 14px; color: #999; text-align: center; margin-top: 8px; }
        .navi-progress { height: 6px; background: #f0f0f0; border-radius: 3px; margin: 24px 0; overflow: hidden; }
        .navi-progress-bar { height: 100%; background: linear-gradient(90deg, #1677ff, #0958d9); border-radius: 3px; transition: width 0.3s; }
        .navi-actions { display: flex; gap: 14px; }
        .navi-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; }
        .navi-btn.secondary { background: #f5f5f5; color: #666; }
        .navi-btn.primary { background: linear-gradient(135deg, #1677ff, #0958d9); color: #fff; box-shadow: 0 4px 16px rgba(22,119,255,0.3); }

        .toast { position: fixed; top: 100px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(0,0,0,0.8); color: #fff; padding: 14px 28px; border-radius: 28px; font-size: 14px; z-index: 9999; opacity: 0; transition: all 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="search-container">
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="搜索地点、停车场、充电站..." autocomplete="off">
            <button class="search-btn">搜索</button>
        </div>
    </div>

    <div class="suggestions" id="suggestions"></div>
    <div class="locate-btn" onclick="locateMe()" id="locateBtn">📍</div>

    <!-- 可拖动面板 -->
    <div class="drag-panel" id="mainPanel">
        <div class="drag-handle" onclick="togglePanel()">
            <div class="drag-bar"></div>
        </div>
        <div class="panel-summary" id="panelSummary" onclick="togglePanel()"></div>
        <div class="panel-content" id="panelContent"></div>
    </div>

    <!-- 导航面板 -->
    <div class="navi-panel" id="naviPanel">
        <div class="navi-distance" id="naviDistance">0 km</div>
        <div class="navi-label">剩余距离</div>
        <div class="navi-progress"><div class="navi-progress-bar" id="naviProgressBar" style="width: 0%"></div></div>
        <div class="navi-actions">
            <button class="navi-btn secondary" onclick="stopNavi()">结束导航</button>
            <button class="navi-btn primary" onclick="pauseNavi()" id="pauseBtn">暂停</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="bottom-nav">
        <div class="nav-items">
            <div class="nav-item" onclick="toggleTraffic()"><div class="icon">🚦</div><div class="label">路况</div></div>
            <div class="nav-item" onclick="searchNearby('停车场')"><div class="icon">🅿️</div><div class="label">停车场</div></div>
            <div class="nav-item" onclick="searchNearby('充电站')"><div class="icon">⚡</div><div class="label">充电</div></div>
            <div class="nav-item" onclick="locateMe()"><div class="icon">📍</div><div class="label">定位</div></div>
        </div>
    </div>

    <script src="https://webapi.amap.com/maps?v=2.0&key=8429788d2971b1eb0b278b878180ce92&plugin=AMap.TileLayer.Traffic"></script>
    <script>
        const AMAP_KEY = '8429788d2971b1eb0b278b878180ce92';

        var map, myMarker, destMarker;
        var userPos = [113.2644, 23.1291];
        var trafficOn = false, trafficLayer = null;
        var selectedPOI = null, currentMode = 'driving';
        var currentRoutes = [], currentPOIs = [];
        var totalDist = 0, naviInterval = null, naviPaused = false;

        function jsonp(url, params, callback) {
            var cb = 'cb_' + Date.now();
            var script = document.createElement('script');
            script.src = url + '?' + Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&') + '&callback=' + cb + '&key=' + AMAP_KEY;
            window[cb] = function(data) { callback(data); delete window[cb]; document.body.removeChild(script); };
            script.onerror = () => callback({ status: '0' });
            document.body.appendChild(script);
            setTimeout(() => { if (window[cb]) window[cb]({ status: '0' }); }, 10000);
        }

        function toast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function initMap() {
            map = new AMap.Map('map', { zoom: 14, center: userPos, viewMode: '2D' });
            map.on('complete', tryLocate);
        }

        function tryLocate() {
            document.getElementById('locateBtn').classList.add('locating');
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    p => { 
                        document.getElementById('locateBtn').classList.remove('locating'); 
                        setUserPos(p.coords.longitude, p.coords.latitude, '定位成功'); 
                    },
                    () => { 
                        document.getElementById('locateBtn').classList.remove('locating'); 
                        tryAmapLocate(); 
                    },
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            } else {
                tryAmapLocate();
            }
            
            setTimeout(() => {
                document.getElementById('locateBtn').classList.remove('locating');
            }, 10000);
        }

        function tryAmapLocate() {
            try {
                if (typeof AMap === 'undefined') {
                    setUserPos(userPos[0], userPos[1], '默认位置(广州)');
                    return;
                }
                AMap.plugin('AMap.Geolocation', function() {
                    var geolocation = new AMap.Geolocation({ enableHighAccuracy: true, timeout: 8000 });
                    geolocation.getCurrentPosition((s, r) => {
                        if (s === 'complete' && r && r.position) {
                            setUserPos(r.position.lng, r.position.lat, '定位成功');
                        } else {
                            setUserPos(userPos[0], userPos[1], '默认位置(广州)');
                        }
                    });
                });
            } catch(e) { 
                setUserPos(userPos[0], userPos[1], '默认位置(广州)'); 
            }
        }

        function setUserPos(lng, lat, msg) {
            userPos = [lng, lat];
            if (myMarker) map.remove(myMarker);
            myMarker = new AMap.Marker({
                position: userPos, map: map,
                icon: new AMap.Icon({ size: new AMap.Size(24, 24), image: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij48Y2lyY2xlIGN4PSIxMiIgY3k9IjEyIiByPSI5IiBmaWxsPSIjMTY3N2ZmIi8+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iNCIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==', imageSize: new AMap.Size(24, 24) }),
                offset: new AMap.Pixel(-12, -12)
            });
            map.setCenter(userPos);
            if (msg) toast(msg);
        }

        function locateMe() {
            document.getElementById('locateBtn').classList.add('locating');
            toast('正在定位...');
            tryLocate();
            setTimeout(() => document.getElementById('locateBtn').classList.remove('locating'), 3000);
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            var kw = e.target.value.trim();
            if (kw.length < 1) { document.getElementById('suggestions').style.display = 'none'; return; }
            jsonp('https://restapi.amap.com/v3/assistant/inputtips', { keywords: kw, location: userPos.join(','), city: '广州', datatype: 'poi' }, function(data) {
                if (data.status === '1' && data.tips && data.tips.length > 0) {
                    var html = '';
                    data.tips.slice(0, 8).forEach(function(tip) {
                        if (tip.location) {
                            html += '<div class="suggestion-item" onclick="selectTip(\'' + tip.name.replace(/'/g, "\\'") + '\',\'' + tip.location + '\',\'' + (tip.address||'').replace(/'/g, "\\'") + '\')">' +
                                '<span class="icon">📍</span>' +
                                '<div><div class="name">' + tip.name + '</div><div class="addr">' + (tip.district||'') + ' ' + (tip.address||'') + '</div></div>' +
                                '</div>';
                        }
                    });
                    document.getElementById('suggestions').innerHTML = html;
                    document.getElementById('suggestions').style.display = 'block';
                } else {
                    document.getElementById('suggestions').style.display = 'none';
                }
            });
        });

        document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') doSearch(); });

        function selectTip(name, location, address) {
            document.getElementById('suggestions').style.display = 'none';
            document.getElementById('searchInput').value = name;
            var parts = location.split(',');
            if (parts.length >= 2) showDetail(name, address, [parseFloat(parts[0]), parseFloat(parts[1])], 'poi');
        }

        function doSearch() {
            var kw = document.getElementById('searchInput').value.trim();
            if (!kw) { toast('请输入搜索内容'); return; }
            document.getElementById('suggestions').style.display = 'none';
            toast('搜索中...');
            
            jsonp('https://restapi.amap.com/v3/place/text', { keywords: kw, city: '广州', offset: 20, page: 1, extensions: 'all' }, function(data) {
                if (data.status === '1' && data.pois && data.pois.length > 0) {
                    currentPOIs = data.pois.map(p => {
                        if (!p.location) return null;
                        var parts = p.location.split(',');
                        return { name: p.name, address: p.address || p.pname + p.cityname + p.adname, lngLat: [parseFloat(parts[0]), parseFloat(parts[1])], type: p.type || '' };
                    }).filter(p => p);
                    if (currentPOIs.length > 0) showPOIList(kw, currentPOIs, 'poi');
                    else toast('未找到相关结果');
                } else {
                    toast('未找到"' + kw + '"相关结果');
                }
            });
        }

        function searchNearby(kw) {
            toast('搜索附近' + kw + '...');
            jsonp('https://restapi.amap.com/v3/place/around', { keywords: kw, location: userPos.join(','), radius: 5000, offset: 20, page: 1, extensions: 'all', sort: 'distance' }, function(data) {
                if (data.status === '1' && data.pois && data.pois.length > 0) {
                    currentPOIs = data.pois.map(p => {
                        var parts = p.location.split(',');
                        return { name: p.name, address: p.address || p.pname + p.cityname + p.adname, lngLat: [parseFloat(parts[0]), parseFloat(parts[1])], distance: p.distance ? parseFloat(p.distance) : 0, type: p.type || '' };
                    });
                    showPOIList('附近的' + kw, currentPOIs, kw);
                } else {
                    toast('附近未找到' + kw);
                }
            });
        }

        function showPOIList(title, pois, kw) {
            var html = '<div class="panel-title">' + title + '</div>';
            html += '<div class="panel-count">共 ' + pois.length + ' 个结果</div>';
            
            html += '<div class="poi-list">';
            pois.forEach(function(p) {
                var dist = p.distance ? (p.distance < 1000 ? p.distance + 'm' : (p.distance/1000).toFixed(1) + 'km') : '';
                var tags = getTags(p, kw);
                
                html += '<div class="poi-card" onclick="showDetail(\'' + p.name.replace(/'/g, "\\'") + '\',\'' + p.address.replace(/'/g, "\\'") + '\',[' + p.lngLat[0] + ',' + p.lngLat[1] + '],\'' + kw + '\')">' +
                    '<div class="poi-main"><div class="poi-name">' + p.name + '</div>' + (dist ? '<div class="poi-dist">' + dist + '</div>' : '') + '</div>' +
                    '<div class="poi-addr">' + p.address + '</div>';
                
                if (tags.length > 0) {
                    html += '<div class="poi-tags">';
                    tags.forEach(t => html += '<span class="poi-tag ' + t.type + '">' + t.text + '</span>');
                    html += '</div>';
                }
                
                html += '<div class="poi-action"><button class="poi-nav-btn" onclick="event.stopPropagation(); planRouteTo(\'' + p.name.replace(/'/g, "\\'") + '\',' + p.lngLat[0] + ',' + p.lngLat[1] + ')">🚗 导航到这里</button></div>';
                html += '</div>';
            });
            html += '</div>';
            
            document.getElementById('panelContent').innerHTML = html;
            
            var summaryIcon = kw === '停车场' ? '🅿️' : kw === '充电站' ? '⚡' : '📍';
            var summaryName = pois.length > 0 ? pois[0].name : title;
            var summaryAddr = pois.length > 0 ? pois[0].address : (pois.length + '个结果');
            var summaryExtra = pois.length > 0 && pois[0].distance ? (pois[0].distance < 1000 ? pois[0].distance + 'm' : (pois[0].distance/1000).toFixed(1) + 'km') : '';
            var summaryNavFn = pois.length > 0 ? 'planRouteTo(\'' + pois[0].name.replace(/'/g, "\\'") + '\',' + pois[0].lngLat[0] + ',' + pois[0].lngLat[1] + ')' : 'togglePanel()';
            updateSummary(summaryIcon, summaryName, summaryAddr, summaryExtra, summaryNavFn);
            
            openPanel();
        }

        function updateSummary(icon, name, addr, extra, navFn) {
            var fn = navFn || 'togglePanel()';
            document.getElementById('panelSummary').innerHTML =
                '<div class="mini-card" onclick="' + fn + '">' +
                    '<div class="mini-icon">' + icon + '</div>' +
                    '<div class="mini-info">' +
                        '<div class="mini-name">' + name + '</div>' +
                        '<div class="mini-addr">' + addr + '</div>' +
                        (extra ? '<div class="mini-extra">' + extra + '</div>' : '') +
                    '</div>' +
                    '<button class="mini-btn" onclick="event.stopPropagation(); ' + fn + '">导航</button>' +
                '</div>';
        }

        function getTags(poi, kw) {
            var tags = [], name = poi.name || '', type = poi.type || '';
            
            if (kw === '停车场' || type.indexOf('停车场') !== -1) {
                if (/地下/.test(name+type)) tags.push({ text: '🅿️ 地下停车场', type: '' });
                else if (/路边|路侧/.test(name+type)) tags.push({ text: '🚧 路边停车', type: 'orange' });
                else if (/地面/.test(name)) tags.push({ text: '🏠 地面停车场', type: '' });
                else if (/商场|商业/.test(name+type)) tags.push({ text: '🏬 商场', type: '' });
                else if (/小区|住宅/.test(name+type)) tags.push({ text: '🏘️ 小区', type: 'red' });
                else tags.push({ text: '🏢 公共停车场', type: '' });
                
                if (/充电/.test(name+type)) tags.push({ text: '⚡ 有充电桩', type: 'green' });
                tags.push({ text: getParkingPriceText(name, type), type: '' });
            } else if (kw === '充电站' || type.indexOf('充电') !== -1) {
                if (/国家电网/.test(name)) tags.push({ text: '⚡ 国家电网', type: '' });
                else if (/特来电/.test(name)) tags.push({ text: '⚡ 特来电', type: '' });
                else if (/星星/.test(name)) tags.push({ text: '⚡ 星星充电', type: '' });
                else if (/特斯拉/.test(name)) tags.push({ text: '⚡ 特斯拉', type: 'green' });
                else tags.push({ text: '⚡ 充电站', type: '' });
                
                var priceInfo = getChargingPriceInfo(name);
                tags.push({ text: priceInfo.text, type: priceInfo.type });
            }
            
            return tags;
        }

        function getParkingPriceText(name, type) {
            if (/商场|商业/.test(name+type)) return '💰 ¥10-15/时';
            if (/小区|住宅/.test(name+type)) return '💰 ¥5-8/时';
            if (/路边|路侧/.test(name+type)) return '💰 ¥8/时';
            return '💰 ¥8-12/时';
        }

        function getChargingPriceInfo(name) {
            var hour = new Date().getHours();
            var base = /国家电网/.test(name) ? 1.1 : /特来电/.test(name) ? 1.2 : /特斯拉/.test(name) ? 1.8 : 1.0;
            
            var mult, period;
            if (hour >= 8 && hour < 11 || hour >= 14 && hour < 17 || hour >= 17 && hour < 21) { mult = 1.5; period = '峰时'; }
            else if (hour >= 11 && hour < 14) { mult = 1.2; period = '平时'; }
            else { mult = 0.6; period = '谷时'; }
            
            var price = (base * mult).toFixed(2);
            return { text: period + ' ¥' + price + '/度', type: mult > 1 ? 'orange' : 'green' };
        }

        function showDetail(name, address, lngLat, kw) {
            selectedPOI = { name, address, lngLat, kw };
            
            if (destMarker) map.remove(destMarker);
            destMarker = new AMap.Marker({
                position: lngLat, map: map,
                icon: new AMap.Icon({ size: new AMap.Size(22, 22), image: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMiIgaGVpZ2h0PSIyMiIgdmlld0JveD0iMCAwIDIyIDIyIj48Y2lyY2xlIGN4PSIxMSIgY3k9IjExIiByPSI4IiBmaWxsPSIjZmY2YjAwIi8+PGNpcmNsZSBjeD0iMTEiIGN5PSIxMSIgcj0iMyIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==', imageSize: new AMap.Size(22, 22) }),
                offset: new AMap.Pixel(-11, -11)
            });
            map.setCenter(lngLat);
            
            var tags = getTags({ name, type: '' }, kw);
            var tagsHtml = '';
            tags.forEach(t => tagsHtml += '<span class="detail-tag ' + t.type + '">' + t.text + '</span>');
            
            var priceText = '';
            tags.forEach(t => { if (t.text.indexOf('¥') !== -1) priceText = t.text; });
            
            var html = '<div class="detail-header">' +
                '<div class="detail-name">' + name + '</div>' +
                '<div class="detail-addr">📍 ' + address + '</div>' +
                '<div class="detail-price">' + priceText + '</div>' +
                '<div class="detail-tags">' + tagsHtml + '</div>' +
                showPriceTable(name, kw) +
                '<div class="detail-actions">' +
                '<button class="detail-btn secondary" onclick="closePanel()">关闭</button>' +
                '<button class="detail-btn primary" onclick="planRouteTo(\'' + name.replace(/'/g, "\\'") + '\',' + lngLat[0] + ',' + lngLat[1] + ')">🚗 导航到这里</button>' +
                '</div></div>';
            
            document.getElementById('panelContent').innerHTML = html;
            
            var summaryIcon = kw === '停车场' ? '🅿️' : kw === '充电站' ? '⚡' : '📍';
            var summaryNavFn = 'planRouteTo(\'' + name.replace(/'/g, "\\'") + '\',' + lngLat[0] + ',' + lngLat[1] + ')';
            updateSummary(summaryIcon, name, address, '', summaryNavFn);
            
            openPanel();
        }

        function showPriceTable(name, kw) {
            if (kw !== '停车场' && kw !== '充电站') return '';
            
            var html = '<div class="price-table"><div class="price-table-title">' + (kw === '停车场' ? '💰 停车收费参考' : '⚡ 充电电价参考') + '</div>';
            
            if (kw === '停车场') {
                html += '<div class="price-row"><span class="time">首小时</span><span class="amount">¥5-10</span></div>';
                html += '<div class="price-row"><span class="time">超出部分</span><span class="amount">¥3-8/小时</span></div>';
                html += '<div class="price-row"><span class="time">24小时封顶</span><span class="amount">¥50-80</span></div>';
            } else {
                var hour = new Date().getHours();
                var base = /国家电网/.test(name) ? 1.1 : /特来电/.test(name) ? 1.2 : /特斯拉/.test(name) ? 1.8 : 1.0;
                
                html += '<div class="price-row' + (hour>=8&&hour<11||hour>=14&&hour<17||hour>=17&&hour<21?' highlight':'') + '"><span class="time">峰时 8-11, 14-17, 17-21</span><span class="amount">¥' + (base*1.5).toFixed(2) + '/度</span></div>';
                html += '<div class="price-row' + (hour>=11&&hour<14?' highlight':'') + '"><span class="time">平时 11-14</span><span class="amount">¥' + (base*1.2).toFixed(2) + '/度</span></div>';
                html += '<div class="price-row' + (hour<8||hour>=21?' highlight':'') + '"><span class="time">谷时 21-次日8</span><span class="amount">¥' + (base*0.6).toFixed(2) + '/度</span></div>';
            }
            html += '</div>';
            return html;
        }

        function planRouteTo(name, lng, lat) {
            selectedPOI = { name, address: '', lngLat: [lng, lat], keyword: 'route' };
            showRoutePanel();
        }

        function showRoutePanel() {
            if (!selectedPOI) { toast('请先选择目的地'); return; }
            
            var modes = [
                { id: 'driving', name: '🚗 驾车', active: currentMode === 'driving' },
                { id: 'transit', name: '🚌 公交', active: currentMode === 'transit' },
                { id: 'walking', name: '🚶 步行', active: currentMode === 'walking' },
                { id: 'riding', name: '🚴 骑行', active: currentMode === 'riding' },
                { id: 'ev', name: '⚡ 电动车', active: currentMode === 'ev' }
            ];
            
            var html = '<div class="panel-title">路线规划</div>';
            html += '<div class="mode-selector">';
            modes.forEach(m => {
                html += '<div class="mode-chip' + (m.active ? ' active' : '') + '" onclick="switchMode(\'' + m.id + '\')">' + m.name + '</div>';
            });
            html += '</div>';
            html += '<div id="routeContent"></div>';
            
            document.getElementById('panelContent').innerHTML = html;
            
            if (selectedPOI) updateSummary('🗺️', '路线规划: ' + selectedPOI.name, '点击展开查看详情');
            
            openPanel();
            planRoute();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
            var chips = document.querySelectorAll('.mode-chip');
            var idx = ['driving','transit','walking','riding','ev'].indexOf(mode);
            if (chips[idx]) chips[idx].classList.add('active');
            planRoute();
        }

        function planRoute() {
            if (!selectedPOI) return;
            
            var origin = userPos.join(','), dest = selectedPOI.lngLat.join(',');
            var url, params;
            
            if (currentMode === 'driving' || currentMode === 'ev') {
                url = 'https://restapi.amap.com/v3/direction/driving';
                params = { origin, destination: dest, strategy: 0 };
            } else if (currentMode === 'transit') {
                url = 'https://restapi.amap.com/v3/direction/transit/integrated';
                params = { origin, destination: dest, city: '广州', strategy: 0 };
            } else if (currentMode === 'walking') {
                url = 'https://restapi.amap.com/v3/direction/walking';
                params = { origin, destination: dest };
            } else if (currentMode === 'riding') {
                url = 'https://restapi.amap.com/v4/direction/bicycling';
                params = { origin, destination: dest };
            }

            jsonp(url, params, function(data) {
                if (data.status === '1' && data.route && data.route.paths && data.route.paths.length > 0) {
                    currentRoutes = data.route.paths;
                    showRoutes(data.route.paths);
                } else {
                    document.getElementById('routeContent').innerHTML = '<div style="text-align:center;color:#999;padding:30px;">路线规划失败，请重试</div>';
                }
            });
        }

        function showRoutes(paths) {
            var modeNames = { driving: '驾车', transit: '公交', walking: '步行', riding: '骑行', ev: '电动车' };
            var first = paths[0];
            
            totalDist = first.distance ? first.distance / 1000 : 0;
            
            var html = '<div class="route-summary">' +
                '<div class="title">' + modeNames[currentMode] + '路线</div>' +
                '<div class="stats">' +
                '<div class="stat"><div class="value">' + (first.duration ? Math.round(first.duration / 60) : '--') + '</div><div class="label">分钟</div></div>' +
                '<div class="stat"><div class="value">' + (first.distance ? (first.distance / 1000).toFixed(1) : '--') + '</div><div class="label">公里</div></div>' +
                '<div class="stat"><div class="value">' + (first.tolls > 0 ? '¥' + first.tolls : '免费') + '</div><div class="label">高速费</div></div>' +
                '</div></div>';
            
            html += '<div class="route-list">';
            paths.forEach(function(path, i) {
                var dist = path.distance ? (path.distance / 1000).toFixed(1) + 'km' : '--';
                var time = path.duration ? Math.round(path.duration / 60) + '分钟' : '--';
                var toll = path.tolls > 0 ? '高速费¥' + path.tolls : '无高速费';
                
                html += '<div class="route-card' + (i === 0 ? ' active' : '') + '" onclick="selectRoute(' + i + ')">' +
                    '<div class="route-header"><div class="route-name">方案' + (i+1) + (i === 0 ? ' · 推荐' : '') + '</div><div class="route-time">' + time + '</div></div>' +
                    '<div class="route-detail">' + dist + ' · ' + toll + '</div>' +
                    '</div>';
            });
            html += '</div>';
            
            html += '<button class="navi-btn" onclick="startNavi()">🚀 开始导航</button>';
            
            document.getElementById('routeContent').innerHTML = html;
            
            var modeNames = { driving: '驾车', transit: '公交', walking: '步行', riding: '骑行', ev: '电动车' };
            var first = paths[0];
            var time = first.duration ? Math.round(first.duration / 60) + '分钟' : '';
            var dist = first.distance ? (first.distance / 1000).toFixed(1) + 'km' : '';
            if (selectedPOI) updateSummary('🚗', selectedPOI.name, modeNames[currentMode] + ' ' + time + ' ' + dist);
            
            selectRoute(0);
        }

        function selectRoute(idx) {
            document.querySelectorAll('.route-card').forEach((el, i) => el.classList.toggle('active', i === idx));
            
            var path = currentRoutes[idx];
            if (!path || !path.polyline) return;
            
            map.remove(routeLine);
            var coords = path.polyline.split(';').map(p => {
                var parts = p.split(',');
                return [parseFloat(parts[0]), parseFloat(parts[1])];
            });
            
            routeLine = new AMap.Polyline({
                path: coords, strokeColor: '#1677ff', strokeWeight: 7, strokeOpacity: 0.9
            });
            routeLine.setMap(map);
            map.setFitView([routeLine]);
        }

        var routeLine = null;

        function startNavi() {
            document.getElementById('mainPanel').classList.remove('show');
            document.getElementById('naviPanel').classList.add('show');
            document.getElementById('naviDistance').textContent = totalDist.toFixed(1) + ' km';
            document.getElementById('naviProgressBar').style.width = '0%';
            naviPaused = false;
            document.getElementById('pauseBtn').textContent = '暂停';
            
            var progress = 0;
            naviInterval = setInterval(function() {
                if (naviPaused) return;
                progress += 0.5;
                var remaining = Math.max(0, totalDist - (totalDist * progress / 100));
                document.getElementById('naviDistance').textContent = remaining.toFixed(1) + ' km';
                document.getElementById('naviProgressBar').style.width = progress + '%';
                
                if (progress >= 100) {
                    stopNavi();
                    toast('已到达目的地！');
                }
            }, 500);
        }

        function pauseNavi() {
            naviPaused = !naviPaused;
            document.getElementById('pauseBtn').textContent = naviPaused ? '继续' : '暂停';
        }

        function stopNavi() {
            document.getElementById('naviPanel').classList.remove('show');
            if (naviInterval) { clearInterval(naviInterval); naviInterval = null; }
        }

        function toggleTraffic() {
            if (trafficOn) {
                if (trafficLayer) map.remove(trafficLayer);
                trafficOn = false; toast('路况已关闭');
            } else {
                trafficLayer = new AMap.TileLayer.Traffic({ autoRefresh: true, interval: 180 });
                map.add(trafficLayer);
                trafficOn = true; toast('路况已开启');
            }
        }

        function openPanel() {
            document.getElementById('mainPanel').classList.add('show');
            document.getElementById('mainPanel').classList.remove('collapsed');
            document.getElementById('naviPanel').classList.remove('show');
        }

        function closePanel() {
            document.getElementById('mainPanel').classList.remove('show');
        }

        function togglePanel() {
            var panel = document.getElementById('mainPanel');
            panel.classList.toggle('collapsed');
        }

        window.onload = initMap;
    </script>
</body>
</html>
