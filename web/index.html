        function drawRoute(path) {
            if (!path || !path.polyline) return;
            
            // 清除之前的路线
            map.clearMap();
            
            // 添加用户定位标记
            myMarker = new AMap.Marker({
                position: userPos, map: map,
                icon: new AMap.Icon({ size: new AMap.Size(24, 24), image: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij48Y2lyY2xlIGN4PSIxMiIgY3k9IjEyIiByPSI5IiBmaWxsPSIjMTY3N2ZmIi8+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iNCIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==', imageSize: new AMap.Size(24, 24) }),
                offset: new AMap.Pixel(-12, -12)
            });
            
            // 添加目的地标记
            if (selectedPOI && selectedPOI.lngLat) {
                destMarker = new AMap.Marker({
                    position: selectedPOI.lngLat, map: map,
                    icon: new AMap.Icon({ size: new AMap.Size(22, 22), image: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMiIgaGVpZ2h0PSIyMiIgdmlld0JveD0iMCAwIDIyIDIyIj48Y2lyY2xlIGN4PSIxMSIgY3k9IjExIiByPSI4IiBmaWxsPSIjZmY2YjAwIi8+PGNpcmNsZSBjeD0iMTEiIGN5PSIxMSIgcj0iMyIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==', imageSize: new AMap.Size(22, 22) }),
                    offset: new AMap.Pixel(-11, -11)
                });
            }
            
            // 绘制路线
            var polyline = path.polyline;
            if (typeof polyline === 'string') {
                var points = polyline.split(';').map(function(p) {
                    var parts = p.split(',');
                    return [parseFloat(parts[0]), parseFloat(parts[1])];
                });
                
                new AMap.Polyline({
                    path: points,
                    map: map,
                    strokeColor: '#1677ff',
                    strokeWidth: 6,
                    strokeOpacity: 0.8,
                    lineJoin: 'round'
                });
                
                // 自动调整地图视角
                map.setFitView([new AMap.Bounds(points)]);
            }
        }

        // 从transit segments提取公交线路名称列表
        function getTransitLineNames(segments) {
            var names = [];
            (segments || []).forEach(function(seg) {
                var bus = seg.bus;
                if (bus && bus.buslines && bus.buslines.length > 0) {
                    bus.buslines.forEach(function(line) {
                        if (line.name && names.indexOf(line.name) === -1) {
                            names.push(line.name);
                        }
                    });
                }
            });
            return names;
        }

        function showTransitRoutes(transits) {
            // 高德公交API: duration(秒), walking_distance(米), segments
            // 旧代码期望 plans.time / plans.walkingDistance / plans.lineNames
            var first = transits[0];
            totalTime = first ? Math.round((first.duration || 0) / 60) : 0;
            totalDist = 0;

            var lineNames = first ? getTransitLineNames(first.segments) : [];
            var walkDist = first ? (first.walking_distance || 0) : 0;
            var busCount = lineNames.length;

            var html = '<div class="route-summary">' +
                '<div class="title">公交路线 · 推荐</div>' +
                '<div class="stats">' +
                '<div class="stat"><div class="value">' + totalTime + '</div><div class="label">分钟</div></div>' +
                '<div class="stat"><div class="value">' + (walkDist > 0 ? walkDist + 'm' : '--') + '</div><div class="label">步行</div></div>' +
                '<div class="stat"><div class="value">' + (busCount > 0 ? busCount + '站' : '--') + '</div><div class="label">公交</div></div>' +
                '</div></div>';

            html += '<div class="route-list">';
            transits.slice(0, 3).forEach(function(t, i) {
                var tTime = t.duration ? Math.round(t.duration / 60) + '分钟' : '--';
                var tLines = getTransitLineNames(t.segments);
                var tBusCount = tLines.length;
                var linesStr = tBusCount > 0 ? tLines.slice(0, 2).join(' → ') + (tBusCount > 2 ? '...' : '') : '公交';

                html += '<div class="route-card' + (i === 0 ? ' active' : '') + '">' +
                    '<div class="route-header"><div class="route-name">方案' + (i+1) + (i === 0 ? ' · 推荐' : '') + '</div><div class="route-time">' + tTime + '</div></div>' +
                    '<div class="route-detail">' + linesStr + '</div>' +
                    '</div>';
            });
            html += '</div>';

            // 添加快捷入口：查看终点周边停车场/充电桩
            html += '<div class="quick-action-bar">';
            html += '<div class="quick-action-btn" onclick="searchDestParkingOrCharging(\'停车场\')"><span class="icon">🅿️</span><span>终点停车场</span></div>';
            html += '<div class="quick-action-btn" onclick="searchDestParkingOrCharging(\'充电站\')"><span class="icon">⚡</span><span>终点充电桩</span></div>';
            html += '</div>';

            html += '<button class="navi-btn" onclick="startFullNavi()">🚀 开始导航</button>';

            document.getElementById('routeContent').innerHTML = html;

            if (selectedPOI) {
                updateSummary('🚌', selectedPOI.name, '公交 ' + totalTime + '分钟');
            }
        }

        function selectRoute(idx) {
            document.querySelectorAll('.route-card').forEach((el, i) => el.classList.toggle('active', i === idx));
            toast('已选择方案' + (idx+1));
        }

        // 全屏导航模式
        function startFullNavi() {
            if (!selectedPOI) { toast('请先选择目的地'); return; }
            
            isNavigating = true;
            currentStepIdx = 0;
            naviProgress = 0;
            
            document.getElementById('mainPanel').classList.remove('show');
            document.getElementById('fullNavi').classList.add('show');
            
            // 更新导航标题
            document.getElementById('naviTitle').textContent = '导航到: ' + selectedPOI.name;
            
            // 初始化导航信息
            updateNaviDisplay();
            
            // 开始GPS跟踪
            startGPSTracking();
            
            // 开始模拟导航
            startSimNavi();
            
            toast('导航开始');
        }

        function updateNaviDisplay() {
            var totalDistNum = (typeof totalDist === 'number' && !isNaN(totalDist)) ? totalDist : 0;
            var totalTimeNum = (typeof totalTime === 'number' && !isNaN(totalTime)) ? totalTime : 0;
            var remainingDistKm = Math.max(0, totalDistNum - (totalDistNum * naviProgress / 100));
            var remainingDistMeters = remainingDistKm * 1000;
            var remainingTimeMin = Math.round(totalTimeNum * (1 - naviProgress / 100));

            // 距离单位适配：<1km显示米，≥1km显示公里
            var distText;
            if (remainingDistMeters < 1000) {
                distText = Math.round(remainingDistMeters) + '米';
            } else {
                distText = remainingDistKm.toFixed(1) + '公里';
            }
            // 时间单位适配：<60分钟显示分钟，≥60显示小时+分钟
            var timeText;
            if (remainingTimeMin < 60) {
                timeText = remainingTimeMin + '分钟';
            } else {
                var hrs = Math.floor(remainingTimeMin / 60);
                var mins = remainingTimeMin % 60;
                timeText = hrs + '小时' + (mins > 0 ? mins + '分钟' : '');
            }

            var remainDistEl = document.getElementById('naviRemainDist');
            var remainTimeEl = document.getElementById('naviRemainTime');
            if (remainDistEl) remainDistEl.textContent = distText;
            if (remainTimeEl) remainTimeEl.textContent = timeText;

            var progress = Math.round(naviProgress);
            var progressFill = document.getElementById('naviProgressFill');
            if (progressFill) progressFill.style.width = progress + '%';
            var progressText = document.getElementById('naviProgressText');
            if (progressText) progressText.textContent = progress + '%';

            var now = new Date();
            var eta = new Date(now.getTime() + remainingTimeMin * 60000);
            var naviEta = document.getElementById('naviEta');
            if (naviEta) naviEta.textContent = '预计 ' + eta.getHours() + ':' + (eta.getMinutes() < 10 ? '0' : '') + eta.getMinutes() + ' 到达';

            if (currentRouteSteps.length > 0) {
                var stepIdx = Math.min(currentStepIdx, currentRouteSteps.length - 1);
                var nextStep = currentRouteSteps[stepIdx];
                if (nextStep) {
                    var instruction = parseInstruction(nextStep.instruction);
                    var insEl = document.getElementById('naviInstruction');
                    if (insEl) insEl.textContent = instruction.text;
                    var roadEl = document.getElementById('naviRoad');
                    if (roadEl) roadEl.textContent = nextStep.road || '当前道路';
                    var iconEl = document.getElementById('maneuverIcon');
                    if (iconEl) iconEl.textContent = instruction.icon;
                    var stepDist = (typeof nextStep.distance === 'number') ? nextStep.distance : (remainingDistKm * 1000);
                    var manDistEl = document.getElementById('maneuverDist');
                    if (manDistEl) manDistEl.textContent = stepDist > 1000 ? (stepDist / 1000).toFixed(1) + '公里' : Math.round(stepDist) + '米';
                    var manRoadEl = document.getElementById('maneuverRoad');
                    if (manRoadEl) manRoadEl.textContent = nextStep.road || '沿当前道路直行';
                    if (remainingDistKm < 0.5 && currentStepIdx < currentRouteSteps.length - 1) {
                        currentStepIdx++;
                        if (soundEnabled) speak(instruction.speak);
                    }
                }
            } else {
                var insEmpty = document.getElementById('naviInstruction');
                if (insEmpty) insEmpty.textContent = '沿当前道路直行';
                var manDistEmpty = document.getElementById('maneuverDist');
                if (manDistEmpty) manDistEmpty.textContent = distText;
                var manRoadEmpty = document.getElementById('maneuverRoad');
                if (manRoadEmpty) manRoadEmpty.textContent = '距离目的地';
            }
        }

        function parseInstruction(instruction) {
            var text = instruction;
            var icon = '⬆️';
            var speak = instruction;
            
            if (/左转|左拐/.test(instruction)) { icon = '⬅️'; speak = '前方路口左转'; }
            else if (/右转|右拐/.test(instruction)) { icon = '➡️'; speak = '前方路口右转'; }
            else if (/掉头/.test(instruction)) { icon = '↩️'; speak = '前方请掉头'; }
            else if (/直行|向前/.test(instruction)) { icon = '⬆️'; speak = '请直行'; }
            else if (/到达|终点/.test(instruction)) { icon = '🏁'; speak = '已到达目的地'; }
            else if (/靠左|左侧/.test(instruction)) { icon = '↙️'; speak = '请靠左行驶'; }
            else if (/靠右|右侧/.test(instruction)) { icon = '↘️'; speak = '请靠右行驶'; }
            
            return { text: text, icon: icon, speak: speak };
        }

        function startSimNavi() {
            if (naviInterval) clearInterval(naviInterval);
            
            var baseSpeed = 25 + Math.random() * 15; // 基础速度25-40km/h
            var speed = baseSpeed;
            var distPerSec = speed / 3600; // 每秒移动距离(km)
            
            // 模拟路况变化
            var trafficChanges = 0;
            var maneuverMessages = [
                '前方路口左转',
                '前方路口右转',
                '请直行',
                '前方500米左转',
                '前方200米右转',
                '进入环岛第2出口',
                '请靠左行驶',
                '请靠右行驶'
            ];
            
            naviInterval = setInterval(function() {
                if (!isNavigating) return;
                
                // 模拟速度变化（路况影响）
                if (Math.random() > 0.9) {
                    speed = Math.max(10, Math.min(60, speed + (Math.random() > 0.5 ? 10 : -10)));
                    distPerSec = speed / 3600;
                }
                
                naviProgress += distPerSec / totalDist * 5; // 每秒前进5%
                
                // 模拟GPS位置更新
                var angle = Math.random() * Math.PI * 2;
                var offset = 0.0001 * Math.random();
                userPos = [
                    userPos[0] + Math.cos(angle) * offset,
                    userPos[1] + Math.sin(angle) * offset
                ];
                
                updateNaviPosition(userPos, speed);
                updateNaviDisplay();
                
                var speedEl = document.getElementById('naviSpeed');
                if (speedEl) speedEl.textContent = Math.round(speed);
                
                // 模拟路况提示变化
                trafficChanges++;
                if (trafficChanges % 8 === 0) {
                    var maneuverEl = document.getElementById('naviNext');
                    var maneuverRoadEl = document.getElementById('maneuverRoad');
                    var maneuverDistEl = document.getElementById('maneuverDist');
                    
                    if (maneuverEl) maneuverEl.textContent = maneuverMessages[Math.floor(Math.random() * maneuverMessages.length)];
                    if (maneuverRoadEl) maneuverRoadEl.textContent = '沿当前道路直行' + (trafficChanges % 16 === 0 ? '，前方左转' : '');
                    if (maneuverDistEl) maneuverDistEl.textContent = (Math.floor(Math.random() * 5) + 1) * 100 + '米';
                }
                
                if (naviProgress >= 100) {
                    stopNavi();
                    toast('已到达目的地！');
                    speak('已到达目的地，导航结束');
                }
            }, 1000);
        }

        function updateNaviPosition(pos, speed) {
            userPos = pos;
            if (myMarker) map.remove(myMarker);
            
            // 更新定位标记 - 带方向箭头
            myMarker = new AMap.Marker({
                position: pos, map: map,
                icon: new AMap.Icon({ 
                    size: new AMap.Size(32, 32), 
                    image: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxMiIgZmlsbD0iIzE2NzdmZiIvPjx0cmlhbmdsZSBjeD0iMTYiIGN5PSI0IiB0eXBlPSJ0cmlhbmdsZSIgcG9pbnRzPSIxNiA0IDI0IDE2IDE2IDI0IiBmaWxsPSIjZmZmIi8+PC9zdmc+', 
                    imageSize: new AMap.Size(32, 32) 
                }),
                offset: new AMap.Pixel(-16, -16)
            });
            
            // 如果是导航模式，保持地图跟随
            if (isNavigating) {
                map.setCenter(pos);
            }
        }

        function stopNavi() {
            if (naviInterval) { clearInterval(naviInterval); naviInterval = null; }
            isNavigating = false;
            naviProgress = 100;
            document.getElementById('fullNavi').classList.remove('show');
            stopGPSTracking();
        }

        function exitNavi() {
            stopNavi();
            toast('已退出导航');
        }

        function toggleNaviSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 导航播报' : '🔇 已静音';
            toast(soundEnabled ? '已开启播报' : '已静音');
        }

        function speak(text) {
            if (soundEnabled && 'speechSynthesis' in window) {
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1;
                speechSynthesis.speak(utterance);
            }
        }

        function shareNavi() {
            if (selectedPOI) {
                var text = '我在使用导航，目的地：' + selectedPOI.name;
                if (navigator.share) {
                    navigator.share({ title: '导航分享', text: text, url: window.location.href });
                } else {
                    toast('分享链接已复制');
                }
            }
        }

        function toggleTraffic() {
            if (trafficOn) {
                if (trafficLayer) map.remove(trafficLayer);
                trafficOn = false; toast('路况已关闭');
            } else {
                trafficLayer = new AMap.TileLayer.Traffic({ autoRefresh: true, interval: 180 });
                map.add(trafficLayer);
                trafficOn = true; toast('路况已开启');
            }
        }

        function openPanel() {
            document.getElementById('mainPanel').classList.add('show');
            document.getElementById('mainPanel').classList.remove('collapsed');
            document.getElementById('fullNavi').classList.remove('show');
        }

        // P1-03: 关闭面板时清空导航缓存数据，防止状态残留
        function closePanel() {
            document.getElementById('mainPanel').classList.remove('show');
            // P1-03: 关闭面板后清空缓存的位置数据
            // 注意：不直接清空destSearchPos/destSearchName，只在模式切换时清空
            console.log('[closePanel] 面板已关闭');
        }

        // P1-03: 强制清空导航相关数据（模式切换时调用）
        function clearNaviCache() {
            // 关闭任何打开的面板
            closePanel();
            // 关闭全屏导航
            var fullNavi = document.getElementById('fullNavi');
            if (fullNavi) fullNavi.classList.remove('show');
            console.log('[clearNaviCache] 导航缓存已清空');
        }

        // P0-1: 修复拖拽面板折叠/展开功能
        function togglePanel() {
            var panel = document.getElementById('mainPanel');
            var isCollapsed = panel.classList.contains('collapsed');
            
            if (isCollapsed) {
                // 展开面板
                panel.classList.remove('collapsed');
                panel.style.maxHeight = '65vh';
            } else {
                // 折叠面板
                panel.classList.add('collapsed');
                panel.style.maxHeight = '120px';
            }
        }

        // P2-02: 地图收起/展开功能
        var isMapCollapsed = false;
        function toggleMapView() {
            var mapEl = document.getElementById('map');
            var toggleBtn = document.getElementById('mapToggleBtn');
            
            if (!mapEl || !toggleBtn) return;
            
            isMapCollapsed = !isMapCollapsed;
            
            if (isMapCollapsed) {
                // 收起地图 - 只显示很小区域
                mapEl.style.height = '35vh';
                mapEl.style.width = '100%';
                toggleBtn.innerHTML = '⬆️';
                toggleBtn.title = '展开地图';
                toggleBtn.classList.add('collapsed');
            } else {
                // 展开地图
                mapEl.style.height = '100%';
                mapEl.style.width = '100%';
                toggleBtn.innerHTML = '⬇️';
                toggleBtn.title = '收起地图';
                toggleBtn.classList.remove('collapsed');
            }
            
            // 触发地图resize重新计算布局
            if (map) {
                setTimeout(function() {
                    map.resize();
                    map.setFitView();
                }, 50);
            }
        }

        // P1-1: 底部导航栏激活态切换
        function setNavActive(idx) {
            var items = document.querySelectorAll('.nav-item');
            items.forEach((item, i) => {
                item.classList.toggle('active', i === idx);
            });
        }

        // 点击页面空白处关闭搜索建议（事件委托）
        function bindSuggestionCloseHandler() {
            document.addEventListener('click', function(e) {
                var sugBox = document.getElementById('suggestions');
                var searchInput = document.getElementById('searchInput');
                if (sugBox && searchInput) {
                    // 点击的不是搜索框本身也不是建议列表
                    if (!searchInput.contains(e.target) && !sugBox.contains(e.target)) {
                        sugBox.style.display = 'none';
                    }
                }
            });
        }

        var isSearching = false;
        function doSearchWithLoading() {
            if (isSearching) return;

            var kw = document.getElementById('searchInput').value.trim();
            if (!kw) { toast('请输入搜索内容'); return; }

            isSearching = true;
            var searchBtn = document.querySelector('.search-btn');
            if (searchBtn) {
                searchBtn.disabled = true;
                searchBtn.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-top:-2px"></span>';
            }

            var sugBox = document.getElementById('suggestions');
            if (sugBox) sugBox.style.display = 'none';
            toast('搜索中...');

            var searchTimeout = setTimeout(function() {
                if (isSearching) {
                    isSearching = false;
                    if (searchBtn) { searchBtn.disabled = false; searchBtn.innerHTML = '搜索'; }
                    toast('搜索超时，请刷新重试');
                    var pc = document.getElementById('panelContent');
                    if (pc) pc.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#999;font-size:14px;">搜索超时，请检查网络后重试</div>';
                }
            }, 7000);

            // 通过本地代理调用高德 Web 服务 REST API
            amapRequest('/v3/place/text', {
                keywords: kw,
                city: '广州',
                offset: 20,
                page: 1,
                extensions: 'all'
            }, function(data) {
                clearTimeout(searchTimeout);
                isSearching = false;
                if (searchBtn) { searchBtn.disabled = false; searchBtn.innerHTML = '搜索'; }
                console.log('[搜索] Proxy response:', data);

                if (data.status === '1' && data.pois && data.pois.length > 0) {
                    currentPOIs = data.pois.map(function(p) {
                        if (!p || !p.location) return null;
                        var parts = p.location.split(',');
                        if (parts.length < 2) return null;
                        var lng = parseFloat(parts[0]);
                        var lat = parseFloat(parts[1]);
                        if (isNaN(lng) || isNaN(lat)) return null;

                        var extra = {};
                        if (p.biz_ext) {
                            if (p.biz_ext.cost) extra.cost = p.biz_ext.cost;
                            if (p.biz_ext.rating) extra.rating = p.biz_ext.rating;
                        }

                        return {
                            name: p.name || '未知地点',
                            address: p.address || (p.pname || '') + (p.cityname || '') + (p.adname || ''),
                            lngLat: [lng, lat],
                            type: p.type || '',
                            distance: p.distance ? parseFloat(p.distance) : 0,
                            extra: extra
                        };
                    }).filter(function(p) { return p; });

                    if (currentPOIs.length > 0) {
                        showPOIList(kw, currentPOIs, 'poi');
                        var mainPanel = document.getElementById('mainPanel');
                        if (mainPanel && !mainPanel.classList.contains('show')) mainPanel.classList.add('show');
                        toast('找到' + currentPOIs.length + '条结果');
                        console.log('[搜索] 成功，第一条:', currentPOIs[0].name, currentPOIs[0].lngLat);
                    } else {
                        toast('未找到相关结果');
                        var pc = document.getElementById('panelContent');
                        if (pc) pc.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#999;font-size:14px;">暂无相关结果，可尝试调整关键词</div>';
                    }
                } else {
                    var errMsg = data.info || (data.status === '0' ? 'API返回错误' : '无结果');
                    console.error('[搜索] Web API错误:', errMsg, data);
                    toast('搜索失败：' + errMsg);
                    var pc2 = document.getElementById('panelContent');
                    if (pc2) pc2.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#d9534f;font-size:14px;">搜索失败：' + errMsg + '<br/>请检查高德Key权限配置</div>';
                }
            });
        }

        window.onload = initMap;
    </script>
</body>
