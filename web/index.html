        function initMap() {
            console.log('[initMap] 初始化地图...');
            
            // P1-10: Safari双指缩放优化 - 检测是否为Safari
            var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            
            map = new AMap.Map('map', { 
                zoom: 14, 
                center: userPos, 
                viewMode: '2D',
                // P1-10: Safari启用手势处理，提升双指缩放灵敏度
                gesturesEnabled: true,
                showLabel: false  // P1-10: 隐藏地图标签减少渲染负担
            });
            
            // P1-04: Firefox地图性能优化 - 关闭地图动画减少卡顿
            // P1-10: Safari下保持动画以保证手势流畅
            try {
                map.setConfig({
                    animateEnable: isSafari ? true : false  // Safari保持动画，其他浏览器禁用
                });
            } catch(e) {
                console.log('[initMap] setConfig not supported:', e);
            }
            
            // P1-10: Safari手势优化 - 确保touch事件正确处理
            if (isSafari) {
                var mapDom = document.getElementById('map');
                if (mapDom) {
                    mapDom.style.touchAction = 'none';  // 允许所有手势
                    mapDom.style.webkitTouchCallout = 'none';
                }
            }
            
            map.on('complete', function() {
                console.log('[initMap] 地图加载完成，等待手动定位');
                
                // P3: 恢复保存的模式状态
                var savedMode = localStorage.getItem('searchMode');
                if (savedMode === 'destination') {
                    switchSearchMode('destination');
                }
            });
            map.on('error', function(err) {
                console.error('[initMap] 地图加载错误:', err);
                toast('地图加载失败，请检查网络或API Key');
            });

            // P0-03: 监听visualViewport变化（安卓微信软键盘弹出/收起）
            // 软键盘弹出时visualViewport.height变小，收起时恢复
            if (window.visualViewport) {
                var viewportResizeTimer = null;
                window.visualViewport.addEventListener('resize', function() {
                    // 防抖处理，避免频繁触发
                    if (viewportResizeTimer) clearTimeout(viewportResizeTimer);
                    viewportResizeTimer = setTimeout(function() {
                        console.log('[visualViewport] 视口变化:', window.visualViewport.width + 'x' + window.visualViewport.height);
                        // P0-03: 触发地图resize重新计算布局
                        if (map) {
                            map.resize();
                        }
                    }, 100);
                });
                window.visualViewport.addEventListener('scroll', function() {
                    // P0-03: 同步地图容器位置，防止点位偏移
                    if (map) {
                        var offsetX = window.visualViewport.offsetLeft;
                        var offsetY = window.visualViewport.offsetTop;
                        var mapContainer = document.getElementById('map');
                        if (mapContainer) {
                            mapContainer.style.transform = 'translate(' + (-offsetX) + 'px,' + (-offsetY) + 'px)';
                        }
                    }
                });
            }

            // 兜底：传统window.resize事件（兼容不支持visualViewport的浏览器）
            var windowResizeTimer = null;
            window.addEventListener('resize', function() {
                if (windowResizeTimer) clearTimeout(windowResizeTimer);
                windowResizeTimer = setTimeout(function() {
                    console.log('[window.resize] 触发地图resize');
                    if (map) map.resize();
                }, 150);
            });

            // P1-06: 监听页面可见性变化，防止后台驻留后地图点位消失
            var mapStateOnHide = null;
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'hidden') {
                    // 页面隐藏时保存当前地图状态
                    console.log('[visibilitychange] 页面隐藏，保存地图状态');
                    if (map && currentPOIs && currentPOIs.length > 0) {
                        mapStateOnHide = {
                            pois: currentPOIs,
                            center: map.getCenter(),
                            zoom: map.getZoom(),
                            mode: currentSearchMode,
                            kw: currentKW
                        };
                    }
                } else {
                    // 页面恢复时恢复地图状态
                    console.log('[visibilitychange] 页面恢复，恢复地图状态');
                    if (map && mapStateOnHide) {
                        // 触发地图resize重新计算布局
                        map.resize();
                        // 如果有保存的点位数据，重新渲染
                        if (mapStateOnHide.pois && mapStateOnHide.pois.length > 0) {
                            // 延迟一点确保地图已经完全恢复
                            setTimeout(function() {
                                if (currentPOIs.length === 0 && mapStateOnHide) {
                                    console.log('[visibilitychange] 恢复保存的点位数据');
                                    renderMapMarkers(mapStateOnHide.pois, mapStateOnHide.kw || '停车场');
                                }
                                mapStateOnHide = null;
                            }, 100);
                        }
                    }
                }
            });

            // HTTP环境提示：非HTTPS且非localhost时，浏览器原生定位不可用
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                console.log('[initMap] 非HTTPS环境，浏览器原生定位不可用');
                setTimeout(function() {
                    toast('当前非HTTPS环境，定位功能受限，建议使用HTTPS访问');
                }, 1000);
            }

            bindSuggestionCloseHandler();
        }

        // ==================== 定位模块 ====================
        // 定位状态管理
        var isLocating = false;
        var locateTimers = [];
        var locateSeq = 0; // 定位序列号，过期回调全部丢弃

        function clearAllLocateTimers() {
            console.log('[定位] 清理所有定时器, count:', locateTimers.length);
            locateTimers.forEach(function(t) { clearTimeout(t); });
            locateTimers = [];
        }

        // 结束定位流程：强制清理 + 序列号自增使后续过期回调全部失效
        function finishLocate(success, message) {
            console.log('[定位] 流程结束, success:', success, ', message:', message);
            clearAllLocateTimers();
            locateSeq++; // 关键：序列号自增，使任何后续异步回调都无法通过校验
            isLocating = false;
            var btn = document.getElementById('locateBtn');
            if (btn) btn.classList.remove('locating');
            if (window._amapGeoInstance) window._amapGeoInstance = null;
            if (message) toast(message);
        }

        // 更新地图中心点和标记
        function updateMarker(lng, lat) {
            if (typeof lng !== 'number' || typeof lat !== 'number' || isNaN(lng) || isNaN(lat)) {
                console.error('[updateMarker] 无效的经纬度:', lng, lat);
                return;
            }
            console.log('[updateMarker] 更新标记: lng=', lng, ', lat=', lat);
            userPos = [lng, lat];
            if (myMarker) map.remove(myMarker);
            myMarker = new AMap.Marker({
                position: userPos, map: map,
                icon: new AMap.Icon({ size: new AMap.Size(24, 24), image: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij48Y2lyY2xlIGN4PSIxMiIgY3k9IjEyIiByPSI5IiBmaWxsPSIjMTY3N2ZmIi8+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iNCIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==', imageSize: new AMap.Size(24, 24) }),
                offset: new AMap.Pixel(-12, -12)
            });
            map.setCenter(userPos);
            console.log('[updateMarker] 地图中心已更新');
        }

        // 高德IP定位（5秒超时）
        function tryAmapLocate(curSeq) {
            console.log('[高德定位] 开始定位, curSeq:', curSeq);
            toast('正在通过网络定位...');

            // 插件加载5秒超时
            var pluginTimeout = setTimeout(function() {
                if (curSeq !== locateSeq) return;
                console.log('[高德定位] 插件加载超时');
                finishLocate(false, '定位服务异常，已使用默认位置');
                updateMarker(113.2644, 23.1291);
            }, 5000);
            locateTimers.push(pluginTimeout);

            AMap.plugin('AMap.Geolocation', function() {
                if (curSeq !== locateSeq) return;
                clearTimeout(pluginTimeout);
                console.log('[高德定位] 插件加载完成');

                // 定位5秒超时
                var geoTimeout = setTimeout(function() {
                    if (curSeq !== locateSeq) return;
                    console.log('[高德定位] 定位超时');
                    finishLocate(false, '定位服务异常，已使用默认位置');
                    updateMarker(113.2644, 23.1291);
                }, 5000);
                locateTimers.push(geoTimeout);

                var geolocation = new AMap.Geolocation({
                    enableHighAccuracy: true,
                    timeout: 10000,
                    buttonPosition: 'RB',
                    needAddress: false,
                    convert: true
                });
                window._amapGeoInstance = geolocation;

                geolocation.getCurrentPosition(function(status, result) {
                    if (curSeq !== locateSeq) return;
                    clearTimeout(geoTimeout);
                    console.log('[高德定位] 回调触发, status:', status);

                    if (status === 'complete' && result && result.position) {
                        console.log('[高德定位] 成功:', result.position.lng, result.position.lat);
                        finishLocate(true, '定位成功');
                        updateMarker(result.position.lng, result.position.lat);
                    } else {
                        console.log('[高德定位] 失败');
                        finishLocate(false, '定位失败，已使用默认位置');
                        updateMarker(113.2644, 23.1291);
                    }
                });
            });
        }

        // 浏览器原生定位（7秒超时）
        function tryBrowserLocate(curSeq) {
            console.log('[浏览器定位] 开始定位, curSeq:', curSeq);
            toast('正在获取精准位置...');

            // 非HTTPS非localhost环境：浏览器定位不可用，直接切高德
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                console.log('[浏览器定位] 非HTTPS环境，跳过浏览器定位');
                tryAmapLocate(curSeq); // 保持同一个序列号
                return;
            }

            if (!navigator.geolocation) {
                console.log('[浏览器定位] 浏览器不支持，切换高德定位');
                tryAmapLocate(curSeq);
                return;
            }

            // 浏览器定位7秒超时
            var browserTimeout = setTimeout(function() {
                if (curSeq !== locateSeq) return;
                console.log('[浏览器定位] 超时7秒');
                tryAmapLocate(curSeq);
            }, 7000);
            locateTimers.push(browserTimeout);

            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    if (curSeq !== locateSeq) return;
                    clearTimeout(browserTimeout);
                    console.log('[浏览器定位] 成功:', pos.coords.longitude, pos.coords.latitude);
                    finishLocate(true, '定位成功');
                    updateMarker(pos.coords.longitude, pos.coords.latitude);
                },
                function(err) {
                    if (curSeq !== locateSeq) return;
                    clearTimeout(browserTimeout);
                    console.log('[浏览器定位] 失败, err.code:', err.code);

                    if (err.code === 1) {
                        // 权限拒绝：不切高德，直接兜底
                        toast('定位权限已关闭，请前往浏览器/系统设置开启');
                        finishLocate(false);
                        updateMarker(113.2644, 23.1291);
                    } else {
                        // 其他错误：切高德
                        toast('位置信息获取失败，正在重试...');
                        tryAmapLocate(curSeq);
                    }
                },
                { enableHighAccuracy: true, timeout: 7000, maximumAge: 30000 }
            );
        }

        // P1-1: 定位权限状态追踪
        var locationPermissionDenied = false;
        
        // 定位按钮点击入口（唯一入口，优先高德Geolocation定位）
        function locateMe() {
            // P0-03: 节流检查
            if (checkThrottle()) return;

            console.log('[locateMe] 定位按钮被点击, isLocating:', isLocating, ', 当前模式:', currentSearchMode);
            if (isLocating) {
                toast('正在定位中，请稍候...');
                return;
            }

            // P0-01: 定位按钮边界规则 - 仅在「我的位置」模式生效
            if (currentSearchMode === 'destination') {
                toast('当前为目的地模式，请先切换到「我的位置」再定位');
                return;
            }

            if (locationPermissionDenied) {
                if (confirm('定位权限被拒绝，需要您手动开启。\n\n请在浏览器地址栏左侧点击🔒图标，允许获取位置信息。\n\n是否尝试重新获取定位？')) {
                    locationPermissionDenied = false;
                } else {
                    toast('可随时点击定位按钮重试，或前往浏览器设置开启权限');
                    return;
                }
            }

            var protocolOK = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            if (!protocolOK) {
                toast('提示：当前为HTTP环境，浏览器定位精度受限，建议使用HTTPS访问');
            }

            isLocating = true;
            clearAllLocateTimers();

            var btn = document.getElementById('locateBtn');
            if (btn) btn.classList.add('locating');
            toast('正在定位...');

            // P0-01/P0-02: 统一坐标更新函数 - 同时更新 myLocationPos、userPos 和坐标就绪标志
            function updateLocationCoords(lng, lat) {
                myLocationPos = [lng, lat];
                userPos = [lng, lat];
                isMyLocationUpdated = true;
                // P0-01: 定位成功后设置坐标就绪标志
                isCoordinateReady.myLocation = true;
                console.log('[locateMe] 坐标已更新:', myLocationPos, 'isCoordinateReady.myLocation:', true);
            }

            var totalTimeout = setTimeout(function() {
                if (!isLocating) return;
                console.log('[locateMe] 总定位超时');
                isLocating = false;
                if (btn) btn.classList.remove('locating');
                // P0-02: 超时时也更新坐标，至少保证有可查询的中心点
                updateLocationCoords(113.2644, 23.1291);
                updateMarker(myLocationPos[0], myLocationPos[1]);
                toast('定位超时，已使用默认位置（可再次点击重新定位）');
            }, 10000);
            locateTimers.push(totalTimeout);

            AMap.plugin('AMap.Geolocation', function() {
                var geolocation = new AMap.Geolocation({
                    enableHighAccuracy: true,
                    timeout: 12000,
                    buttonPosition: 'RB',
                    needAddress: false,
                    convert: true,
                    showButton: false,
                    showMarker: false,
                    showCircle: false
                });

                geolocation.getCurrentPosition(function(status, result) {
                    if (!isLocating) return;
                    clearTimeout(totalTimeout);

                    if (status === 'complete' && result && result.position) {
                        updateLocationCoords(result.position.lng, result.position.lat);
                        isLocating = false;
                        locationPermissionDenied = false;
                        if (btn) btn.classList.remove('locating');
                        updateMarker(myLocationPos[0], myLocationPos[1]);
                        map.setCenter(myLocationPos);
                        toast('定位成功');
                        console.log('[locateMe] 高德定位成功:', myLocationPos);
                    } else {
                        if (navigator.geolocation && protocolOK) {
                            console.log('[locateMe] 高德定位失败，降级浏览器定位');
                            navigator.geolocation.getCurrentPosition(
                                function(pos) {
                                    if (!isLocating) return;
                                    clearTimeout(totalTimeout);
                                    updateLocationCoords(pos.coords.longitude, pos.coords.latitude);
                                    isLocating = false;
                                    locationPermissionDenied = false;
                                    if (btn) btn.classList.remove('locating');
                                    updateMarker(myLocationPos[0], myLocationPos[1]);
                                    map.setCenter(myLocationPos);
                                    toast('定位成功（浏览器）');
                                    console.log('[locateMe] 浏览器定位成功:', myLocationPos);
                                },
                                function(err) {
                                    if (!isLocating) return;
                                    clearTimeout(totalTimeout);
                                    console.log('[locateMe] 浏览器定位失败:', err.code);
                                    isLocating = false;
                                    if (btn) btn.classList.remove('locating');
                                    updateLocationCoords(113.2644, 23.1291);
                                    updateMarker(myLocationPos[0], myLocationPos[1]);
                                    if (err.code === 1) {
                                        locationPermissionDenied = true;
                                        toast('定位权限已拒绝，点击确定重新尝试授权', 4000);
                                        if (confirm('定位权限被拒绝。\n\n点击"确定"重新尝试，或前往浏览器设置手动开启定位权限。')) {
                                            locationPermissionDenied = false;
                                            locateMe();
                                        }
                                    } else if (err.code === 2) {
                                        toast('位置服务不可用，已使用默认位置');
                                    } else if (err.code === 3) {
                                        toast('定位超时，可再次点击重新定位');
                                    } else {
                                        toast('定位失败，已使用默认位置');
                                    }
                                },
                                { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
                            );
                        } else {
                            isLocating = false;
                            if (btn) btn.classList.remove('locating');
                            updateLocationCoords(113.2644, 23.1291);
                            updateMarker(myLocationPos[0], myLocationPos[1]);
                            console.log('[locateMe] 无法定位，使用默认坐标');
                            toast('当前环境不支持定位，已使用默认位置');
                        }
                    }
                });
            });
        }

        // GPS实时跟踪（导航用）
        function startGPSTracking() {
            if (navigator.geolocation) {
                naviWatchId = navigator.geolocation.watchPosition(
                    function(pos) {
                        userPos = [pos.coords.longitude, pos.coords.latitude];
                        updateNaviPosition(userPos, pos.coords.speed || 30);
                    },
                    function(err) { console.log('[GPS追踪] 失败:', err.message); },
                    { enableHighAccuracy: true, maximumAge: 1000 }
                );
            }
        }

        function stopGPSTracking() {
            if (naviWatchId !== null) {
                navigator.geolocation.clearWatch(naviWatchId);
                naviWatchId = null;
            }
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            var kw = e.target.value.trim();
            if (kw.length < 1) { document.getElementById('suggestions').style.display = 'none'; return; }
            amapRequest('/v3/assistant/inputtips', { keywords: kw, location: userPos.join(','), city: '广州', datatype: 'poi' }, function(data) {
                if (data.status === '1' && data.tips && data.tips.length > 0) {
                    var html = '';
                    data.tips.slice(0, 8).forEach(function(tip) {
                        if (tip.location) {
                            html += '<div class="suggestion-item" onclick="selectTip(\'' + tip.name.replace(/'/g, "\\'") + '\',\'' + tip.location + '\',\'' + (tip.address||'').replace(/'/g, "\\'") + '\')">' +
                                '<span class="icon">📍</span>' +
                                '<div><div class="name">' + tip.name + '</div><div class="addr">' + (tip.district||'') + ' ' + (tip.address||'') + '</div></div>' +
                                '</div>';
                        }
                    });
                    document.getElementById('suggestions').innerHTML = html;
                    document.getElementById('suggestions').style.display = 'block';
                } else {
                    document.getElementById('suggestions').style.display = 'none';
                }
            });
        });

        document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') doSearchWithLoading(); });

        function selectTip(name, location, address) {
            document.getElementById('suggestions').style.display = 'none';
            document.getElementById('searchInput').value = name;
            var parts = location.split(',');
            if (parts.length >= 2) showDetail(name, address, [parseFloat(parts[0]), parseFloat(parts[1])], 'poi');
        }

        // 文本搜索（关键词搜索）：使用高德 PlaceSearch.search()
        function doSearch() {
            var kw = document.getElementById('searchInput').value.trim();
            if (!kw) { toast('请输入搜索内容'); return; }
            document.getElementById('suggestions').style.display = 'none';
            toast('搜索中...');

            // 通过本地代理调用高德 Web 服务 REST API
            amapRequest('/v3/place/text', {
                keywords: kw,
                city: '广州',
                offset: 20,
                page: 1,
                extensions: 'all'
            }, function(data) {
                console.log('[doSearch] Proxy response:', data);
                if (data.status === '1' && data.pois && data.pois.length > 0) {
                    currentPOIs = data.pois.map(function(p) {
                        if (!p.location) return null;
                        var parts = p.location.split(',');
                        if (parts.length < 2) return null;
                        var lng = parseFloat(parts[0]);
                        var lat = parseFloat(parts[1]);
                        if (isNaN(lng) || isNaN(lat)) return null;

                        var extra = {};
                        if (p.biz_ext) {
                            if (p.biz_ext.cost) extra.cost = p.biz_ext.cost;
                            if (p.biz_ext.rating) extra.rating = p.biz_ext.rating;
                        }

                        return {
                            name: p.name || '',
                            address: p.address || (p.pname || '') + (p.cityname || '') + (p.adname || ''),
                            lngLat: [lng, lat],
                            type: p.type || p.typecode || '',
                            distance: p.distance ? parseFloat(p.distance) : 0,
                            extra: extra
                        };
                    }).filter(function(p) { return p; });

                    if (currentPOIs.length > 0) {
                        showPOIList(kw, currentPOIs, 'poi');
                        var mainPanel = document.getElementById('mainPanel');
                        if (mainPanel && !mainPanel.classList.contains('show')) mainPanel.classList.add('show');
                        toast('找到' + currentPOIs.length + '条结果');
                    } else {
                        toast('未找到相关结果');
                        var pc = document.getElementById('panelContent');
                        if (pc) pc.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#999;font-size:14px;">暂无相关结果，可尝试调整关键词</div>';
                    }
                } else {
                    var errInfo = data.info || (data.status === '0' ? 'API返回错误' : '无结果');
                    console.error('[doSearch] Web API错误:', errInfo, data);
                    toast('搜索失败：' + errInfo);
                    var pc2 = document.getElementById('panelContent');
                    if (pc2) pc2.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#d9534f;font-size:14px;">搜索失败：' + errInfo + '<br/>请检查高德Key权限配置</div>';
                }
            });
        }

        function parsePOIExtra(p) {
            var extra = {};
            // 从高德数据解析可用信息
            if (p.biz_ext && p.biz_ext.rating) extra.rating = p.biz_ext.rating;
            if (p.biz_ext && p.biz_ext.cost) extra.cost = p.biz_ext.cost;
            if (p.biz_ext && p.biz_ext.takes_time) extra.takesTime = p.biz_ext.takes_time;
            if (p.tag) extra.tag = p.tag;
            if (p.type) extra.bizType = p.type;
            return extra;
        }

        // P0-03: 检索半径按模式隔离存储
        var searchRadiusConfig = {
            myLocation: 2000,
            destination: 2000
        };
        var searchRadius = 2000; // 当前生效的半径
        var radiusOptions = [500, 1000, 2000, 3000, 5000];

        // 双模式查询相关变量 - 严格隔离
        var currentSearchMode = 'myLocation'; // 'myLocation' | 'destination'
        var destSearchPos = null;   // 目的地坐标 [lng, lat]
        var destSearchName = '';    // 目的地名称

        // P1-6: 列表滚动位置存储
        var savedScrollTop = 0;

        // P0-01: 坐标就绪标志 - 确保模式切换/定位后坐标更新完成再发起查询
        var isCoordinateReady = {
            myLocation: true,
            destination: true
        };

        // P1-03/P1-04: 筛选/排序状态隔离（每个模式独立存储）
        var filterState = {
            myLocation: { filter: 'all', sort: 'distance' },
            destination: { filter: 'all', sort: 'distance' }
        };

        /* ==================== P0-03: 全局节流 + 请求队列管控 ==================== */
        // 高频叠加操作防卡死：节流、排队、强制取消
        var activeRequests = [];
        var lastActionTime = 0;     // 上一次操作时间戳
        var THROTTLE_MS = 300;      // 最小操作间隔
        var isSearching = false;    // 搜索状态锁

        function registerRequest(controller) {
            activeRequests.push(controller);
        }

        function cancelAllRequests() {
            activeRequests.forEach(function(controller) {
                try { controller.abort(); } catch(e) {}
            });
            activeRequests = [];
        }

        // P0-03: 节流检查 - 防止高频叠加触发JS报错
        function checkThrottle() {
            var now = Date.now();
            if (now - lastActionTime < THROTTLE_MS) {
                console.warn('[Throttle] 操作过于频繁，已拦截');
                return true;
            }
            lastActionTime = now;
            return false;
        }

        // P0-03: 重置搜索状态 - 切换模式或发起新搜索前调用
        function resetSearchState() {
            cancelAllRequests();
            isSearching = false;
            // 清除可能残留的loading状态
            var navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(function(el) { el.classList.remove('loading'); });
        }

        /* ==================== P0-04: 多标签页状态同步 + 页面驻留状态保存 ==================== */
        // 切换到其他标签页或返回时保持组件状态、导航数据持续更新
        var pageStateRestoreTimer = null;
        var pageStateLastUpdate = Date.now();

        function savePageStateToMemory() {
            // 记录当前状态，用于切回后检查是否丢失
            pageStateLastUpdate = Date.now();
        }

        function restorePageStateFromMemory() {
            // 如果组件状态丢失，静默修复，不打断用户操作
            console.log('[PageState] 切回页面，校验状态完整性');
            savePageStateToMemory();
        }

        // 监听页面可见性变化 - P0-04 核心修复
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // 切到后台：保存状态，保持导航数据更新
                console.log('[PageState] 页面切到后台');
                savePageStateToMemory();
            } else {
                // 切回前台：恢复状态，导航继续刷新
                console.log('[PageState] 页面切回前台');
                restorePageStateFromMemory();
                // P1-05: 切回页面后重新触发一次导航数据刷新
                if (isNavigating && naviInterval === null) {
                    // 确保导航定时器正常工作
                    console.log('[PageState] 恢复导航定时器');
                }
            }
        });

        // P0-01/P0-02/P0-03/P0-05: 切换搜索模式时取消所有请求、清空状态、防键盘自动唤起
        function switchSearchMode(mode) {
            if (currentSearchMode === mode) return;

            // P0-01: 重置坐标就绪标志，等待新坐标更新
            isCoordinateReady[mode] = false;

            // P0-03: 切换模式时强制重置搜索状态 + 取消所有请求，防止Firefox冻结
            resetSearchState();

            // P1-6: 保存当前列表滚动位置
            var panelContent = document.getElementById('panelContent');
            savedScrollTop = panelContent ? panelContent.scrollTop : 0;
            console.log('[switchSearchMode] 保存滚动位置:', savedScrollTop);

            // P1-2: 切换模式时关闭路线面板，防止数据错乱
            closePanel();

            // P1-03: 切换模式强制清空导航弹窗缓存数据
            clearNaviCache();

            // P0-01/P0-02: 切换模式时清空目的地坐标缓存，防止历史坐标残留
            if (mode === 'myLocation') {
                destSearchPos = null;
                destSearchName = '';
                isCoordinateReady.destination = false;
                console.log('[switchSearchMode] 切换到我的位置模式，清空目的地坐标缓存');
            } else {
                // P0-01: **清空上一次的目的地坐标**，强制等待新的用户输入
                destSearchPos = null;
                destSearchName = '';
                isCoordinateReady.destination = false;
                console.log('[switchSearchMode] 切换到目的地模式，已清空历史坐标缓存，等待新坐标');
            }

            // P0-02: 切换模式时应用对应模式的检索半径
            searchRadius = searchRadiusConfig[mode];
            console.log('[switchSearchMode] 模式切换，半径更新为:', searchRadius);

            currentSearchMode = mode;

            // P3: 保存模式状态到localStorage
            localStorage.setItem('searchMode', mode);

            var myLocationEl = document.getElementById('modeMyLocation');
            var destModeEl = document.getElementById('modeDestination');
            var destContainer = document.getElementById('destSearchContainer');

            if (mode === 'myLocation') {
                myLocationEl.classList.add('active');
                destModeEl.classList.remove('active');
                destContainer.classList.remove('show');

                // P1-04: 切换到我的位置时清空空状态提示
                clearEmptyState();
            } else {
                destModeEl.classList.add('active');
                myLocationEl.classList.remove('active');
                destContainer.classList.add('show');

                // P1-04: 切换到目的地时清空空状态提示
                clearEmptyState();

                // P0-04: 移除自动聚焦，防止微信浏览器自动唤起软键盘
                // 不做任何focus操作，用户需要手动点击输入框
            }

            // P1-2: 切换模式时不清空目的地输入，只在切换到"我的位置"且需要时才清空
            // 保持导航状态不变
            if (mode === 'myLocation' && !isNavigating) {
                clearDestInput();
            }

            // P1-05: 清除可能残留的筛选面板关闭状态，持久化保持用户筛选
            // （注意：这里不主动关闭筛选面板，保持用户操作状态）

            // P1-2: 如果正在导航，不中断导航状态，只在非导航状态下刷新搜索
            if (!isNavigating) {
                // 如果当前选中了停车场/充电站按钮，刷新搜索
                var activeNav = document.querySelector('.nav-item.active');
                if (activeNav && mode === 'myLocation') {
                    var kw = activeNav.querySelector('.label').textContent === '停车场' ? '停车场' : '充电站';
                    // P0-01: 等待坐标就绪后再发起搜索
                    waitForCoordinateReady(mode, function() {
                        searchParkingOrCharging(kw);
                    });
                    return; // searchParkingOrCharging由回调触发
                }

                // P1-3: 恢复当前模式的筛选/排序状态
                restoreFilterState();
            }
        }

        // P0-01: 等待坐标就绪后再执行查询
        function waitForCoordinateReady(mode, callback) {
            var maxWait = 2000; // 最多等待2秒
            var interval = 50;
            var waited = 0;

            var checkReady = function() {
                if (isCoordinateReady[mode]) {
                    callback();
                    return;
                }

                waited += interval;
                if (waited >= maxWait) {
                    console.warn('[waitForCoordinateReady] 等待坐标超时，强制执行');
                    isCoordinateReady[mode] = true;
                    callback();
                    return;
                }

                setTimeout(checkReady, interval);
            };

            checkReady();
        }

        // P1-04: 清空空状态提示
        function clearEmptyState() {
            var emptyState = document.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
            var noResults = document.getElementById('noResults');
            if (noResults) {
                noResults.style.display = 'none';
            }
        }
        
        // P1-3: 恢复当前模式的筛选/排序状态
        function restoreFilterState() {
            var filterSelect = document.getElementById('parkingFilter');
            var chargingFilterSelect = document.getElementById('chargingFilter');
            var sortSelect = document.getElementById('sortOrder');
            
            var state = filterState[currentSearchMode];
            if (state) {
                if (filterSelect) filterSelect.value = state.filter || 'all';
                if (chargingFilterSelect) chargingFilterSelect.value = state.filter || 'all';
                if (sortSelect) sortSelect.value = state.sort || 'distance';
            }
        }

        // P0-02: 清空目的地输入
        function clearDestInput() {
            document.getElementById('destInput').value = '';
            document.getElementById('destClear').style.display = 'none';
            document.getElementById('destSuggestions').style.display = 'none';
            destSearchPos = null;
            destSearchName = '';
            // P0-02: 清空输入时重置坐标就绪标志，等待新的坐标输入
            isCoordinateReady.destination = false;

        }

        // 目的地输入变化处理

        document.getElementById('destInput').addEventListener('input', function(e) {
            var value = e.target.value.trim();
            document.getElementById('destClear').style.display = value ? 'block' : 'none';
            
            clearTimeout(destInputTimer);
            if (value.length >= 2) {
                destInputTimer = setTimeout(function() {
                    searchDestSuggestions(value);
                }, 300);
            } else {
                // P3: 输入为空时显示搜索历史
                var historyHtml = showSearchHistory();
                if (historyHtml) {
                    document.getElementById('destSuggestions').innerHTML = historyHtml;
