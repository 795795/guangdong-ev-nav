        /* ========================================
           地图初始化
           ======================================== */
        function initMap() {
            S.map = new AMap.Map('map', {
                center: S.userLocation,
                zoom: 13,
                resizeEnable: true,
                showIndoorMap: false,
                viewMode: '2D',
                mapStyle: 'amap://styles/normal'
            });

            // 路况图层（默认关闭）
            S.trafficLayer = new AMap.TileLayer.Traffic({
                autoRefresh: true,
                interval: 180
            });

            // 卫星图层（默认关闭）
            S.satelliteLayer = new AMap.TileLayer.Satellite();
            S.roadnetLayer = new AMap.TileLayer.RoadNet();

            // 驾车路线规划
            S.driving = new AMap.Driving({
                map: S.map,
                hideMarkers: false,
                autoFitView: true,
                policy: 0
            });

            // 测距工具
            S.rangingTool = new AMap.RangingTool(S.map);
            S.rangingTool.on('end', function(e) {
                $('rangingIndicator').style.display = 'none';
                $('btnRanging').classList.remove('active');
                S.map.setStatus({ dragEnable: true, zoomEnable: true, pitchEnable: true });
                toast('总距离: ' + e.distance.toFixed(0) + ' 米');
            });
            S.rangingTool.on('addnode', function(e) {
                // 每打一个点更新距离
                if (e.distance) {
                    $('rangingDistance').textContent = e.distance.toFixed(0);
                }
            });

            // 信息窗口
            S.infoWindow = new AMap.InfoWindow({
                offset: new AMap.Pixel(0, -20),
                closeWhenClickMap: true
            });

            // 定位功能
            const geolocation = new AMap.Geolocation({
                enableHighAccuracy: true,
                timeout: 10000,
                buttonPosition: 'RB',
                showButton: false
            });
            S.map.addControl(geolocation);

            geolocation.getCurrentPosition(function(status, result) {
                if (status === 'complete') {
                    S.userLocation = [result.position.lng, result.position.lat];
                    S.hasLocation = true;
                    $('navStartInput').value = '我的位置';
                    $('cityName').textContent = result.addressComponent.city || '广州';
                    toast('定位成功');
                } else {
                    // 定位失败，保持默认位置（广州），可手动搜索
                    S.hasLocation = false;
                    $('navStartInput').value = '定位失败，点击重试';
                    $('navStartInput').style.color = 'var(--danger)';
                    $('navStartInput').style.cursor = 'pointer';
                    // 点击输入框重试定位
                    $('navStartInput').onclick = function() {
                        if (S.hasLocation) return;
                        this.value = '定位中...';
                        this.style.color = '';
                        geolocation.getCurrentPosition(function(s2, r2) {
                            if (s2 === 'complete') {
                                S.userLocation = [r2.position.lng, r2.position.lat];
                                S.hasLocation = true;
                                $('navStartInput').value = '我的位置';
                                $('navStartInput').style.color = '';
                                $('navStartInput').onclick = null;
                                toast('定位成功');
                            } else {
                                $('navStartInput').value = '定位失败，点击重试';
                                $('navStartInput').style.color = 'var(--danger)';
                                toast('定位失败，请手动输入起点或切换城市');
                            }
                        });
                    };
                    toast('定位失败，请手动输入起点或切换城市');
                }
            });

            // 加载历史记录
            loadHistory();

            // 从localStorage恢复图层、路况、主题状态
            const settings = loadSettings();
            if (settings.trafficOn) {
                S.trafficOn = false;
                toggleTraffic();
            }
            if (settings.currentMapType && settings.currentMapType !== 'normal') {
                switchMapType(settings.currentMapType);
            }
            if (settings.currentTheme && settings.currentTheme !== 'normal') {
                switchTheme(settings.currentTheme);
            }

            // 从localStorage恢复城市并获取天气
            loadCity();
            // 地图中心平移到缓存的城市
            if (S.currentCityLngLat) {
                S.map.setCenter(S.currentCityLngLat);
                S.userLocation = S.currentCityLngLat;
            }
            fetchWeather(S.currentCity);

            // 恢复搜索类型，自动搜索
            if (settings.currentSearchType && (settings.currentSearchType === 'parking' || settings.currentSearchType === 'charging')) {
                S.currentSearchType = settings.currentSearchType;
                const target = S.currentSearchType.charAt(0).toUpperCase() + S.currentSearchType.slice(1);
                // 高亮快捷图标
                document.querySelectorAll('.quick-icon').forEach(el => el.classList.remove('active'));
                const activeId = S.currentSearchType === 'parking' ? 'quickParking' : 'quickCharge';
                document.getElementById(activeId) && document.getElementById(activeId).classList.add('active');
                // 触发搜索
                searchNearby(S.currentSearchType);
            }

            toast('地图加载完成');
        }

        /* ========================================
           任务1: POI检索（停车场+充电站）
           ======================================== */
        function clearMarkers() {
            S.markers.forEach(m => m.setMap(null));
            S.markers = [];
            if (S.cluster) {
                S.cluster.setMap(null);
                S.cluster = null;
            }
        }

        function createMarker(poi, type) {
            const icon = type === 'parking' 
                ? 'https://webapi.amap.com/theme/v1.3/markers/n/map_bs.png'
                : 'https://webapi.amap.com/theme/v1.3/markers/n/map_r.png';
            
            const marker = new AMap.Marker({
                position: [poi.location.lng, poi.location.lat],
                title: poi.name,
                content: type === 'parking' 
                    ? '<div style="background:#1a73e8;color:#fff;padding:4px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.2);">🅿️ 停车</div>'
                    : '<div style="background:#34a853;color:#fff;padding:4px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.2);">⚡ 充电</div>',
                offset: new AMap.Pixel(-30, -20)
            });

            marker.on('click', function() {
                const content = `
                    <div class="infowindow">
                        <div class="info-name">${poi.name}</div>
                        <div class="info-addr">${poi.address || '地址未知'}</div>
                        <div class="info-actions">
                            <button class="info-btn" onclick="navigateToPoi('${poi.name.replace(/'/g, "\\'")}','${(poi.address||'').replace(/'/g, "\\'")}','${poi.location.lng}','${poi.location.lat}')">去导航</button>
                        </div>
                    </div>
                `;
                S.infoWindow.setContent(content);
                S.infoWindow.open(S.map, [poi.location.lng, poi.location.lat]);
            });

            return marker;
        }

        function renderResults(pois, type) {
            clearMarkers();

            if (!pois || pois.length === 0) {
                toast('未找到附近的' + (type === 'parking' ? '停车场' : '充电站'));
                return;
            }

            const markerColor = type === 'parking' ? '#1a73e8' : '#34a853';
            const newMarkers = pois.map(poi => createMarker(poi, type));
            S.markers = newMarkers;

            // 点聚合（统一使用AMap.MarkerCluster，无论点位数量多少都启用，解决密集点位卡顿问题
            if (AMap.MarkerCluster) {
                S.cluster = new AMap.MarkerCluster(S.map, newMarkers.map(m => ({
                    lnglat: [m.getPosition().lng, m.getPosition().lat],
                    marker: m
                })), {
                    gridSize: 70,
                    averageCenter: false,
                    renderClusterMarker: function(context) {
                        const count = context.count;
                        // 聚合点尺寸根据数量分级显示不同大小
                        const size = count < 10 ? 36 : count < 50 ? 42 : 48;
                        return new AMap.Marker({
                            position: context.lnglat,
                            content: '<div style="background:' + markerColor + ';color:#fff;width:' + size + 'px;height:' + size + 'px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.2);border:2px solid #fff;">' + count + '</div>',
                            offset: new AMap.Pixel(-size / 2, -size / 2)
                        });
                    }
                });
            }

            // 自动适配视野
            const bounds = new AMap.Bounds(
                [Math.min(...pois.map(p => p.location.lng)), Math.min(...pois.map(p => p.location.lat))],
                [Math.max(...pois.map(p => p.location.lng)), Math.max(...pois.map(p => p.location.lat))]
            );
            S.map.setBounds(bounds);
            S.map.setZoom(S.map.getZoom() - 1);

            toast('找到 ' + pois.length + ' 个' + (type === 'parking' ? '停车场' : '充电站'));
        }

        function searchNearby(type) {
            if (!S.map) { toast('地图未加载完成'); return; }
            
            S.currentSearchType = type;
            saveSettings();  // 持久化搜索类型
            
            // 更新快捷图标状态
            document.querySelectorAll('.quick-icon').forEach(el => el.classList.remove('active'));
            if (type === 'parking') $('quickParking').classList.add('active');
            else $('quickCharge').classList.add('active');

            // 检查缓存（5分钟内有效）
            const now = Date.now();
            if (S._searchCache && 
                S._searchCache.type === type && 
                (now - S._searchCacheTime) < S._searchCacheValidMs) {
                renderResults(S._searchCache.pois, type);
                toast('使用缓存数据');
                return;
            }

            // 使用category参数精准搜索停车场/充电桩POI分类，避免混入小区、商铺等其他地点
            // 停车场: 011100 (交通设施服务/停车场)
            // 充电站: 110100 (生活服务/电力供应/充电站) 或 01010007 (交通设施/充电站)
            const category = type === 'parking' ? '011100' : '011100|110100';
            const keyword = '';  // 使用category参数过滤，keyword留空以获得更精准结果
            const ps = new AMap.PlaceSearch({
                pageSize: 30,
                extensions: 'all',
                category: category  // 高德API的category参数，按POI分类过滤
            });

            showLoading('搜索中...');
            toast('正在搜索周边' + (type === 'parking' ? '停车场' : '充电站') + '...');

            // 10秒超时处理
            clearTimeout(S._searchTimeoutTimer);
            S._searchTimeoutTimer = setTimeout(() => {
                ps.cancelSearch();
                hideLoading();
                toast('搜索超时，请检查网络后重试');
            }, 10000);

            ps.searchNearBy(keyword, new AMap.LngLat(S.userLocation[0], S.userLocation[1]), 5000, function(status, result) {
                clearTimeout(S._searchTimeoutTimer);
                hideLoading();
                if (status === 'complete' && result.poiList && result.poiList.pois) {
                    // 二次过滤：只保留真正的停车场/充电站，作为双保险
                    const filtered = result.poiList.pois.filter(poi => {
                        const name = (poi.name || '').toLowerCase();
                        const typeStr = (poi.type || '').toLowerCase();
                        if (type === 'parking') {
                            return name.includes('停车') || name.includes('停车场') || 
                                   name.includes('p+') || typeStr.includes('停车场') || typeStr.includes('停车');
                        } else {
                            return name.includes('充电') || name.includes('充电桩') || 
                                   name.includes('充电站') || typeStr.includes('充电');
                        }
                    });
                    
                    // 缓存结果
                    S._searchCache = { type, pois: filtered.length > 0 ? filtered : result.poiList.pois };
                    S._searchCacheTime = now;
                    renderResults(filtered.length > 0 ? filtered : result.poiList.pois, type);
                } else if (status === 'error' || status === 'no_data') {
                    clearMarkers();
                    toast('未找到附近的' + (type === 'parking' ? '停车场' : '充电站'));
                } else {
                    clearMarkers();
                    toast('搜索失败，请检查网络后重试');
                }
            });
        }

        function searchByKeyword(keyword) {
            if (!keyword.trim()) return;
            
            showLoading('搜索中...');
            const ps = new AMap.PlaceSearch({
                pageSize: 20,
                extensions: 'all',
                city: S.currentCity || '广州'
            });

            ps.search(keyword, function(status, result) {
                hideLoading();
                if (status === 'complete' && result.poiList && result.poiList.pois) {
                    // 只保留停车场和充电站
                    const filtered = result.poiList.pois.filter(poi => {
                        const name = (poi.name || '').toLowerCase();
                        const type = (poi.type || '').toLowerCase();
                        return name.includes('停车场') || name.includes('停车') ||
                               name.includes('充电') || name.includes('充电站') || name.includes('充电桩') ||
                               type.includes('停车场') || type.includes('充电');
                    });
                    
                    if (filtered.length === 0) {
                        filtered.push(...result.poiList.pois.slice(0, 10));
                    }
                    
                    renderResults(filtered, keyword.includes('充电') ? 'charging' : 'parking');
                } else {
                    hideLoading();
                    toast('未找到匹配地点，请尝试其他关键词');
                }
            });
        }

        function showSuggestions(keyword) {
            if (!keyword.trim()) {
                $('suggestions').classList.remove('show');
                return;
            }

            // 使用category参数过滤，仅返回停车场和充电站POI，屏蔽小区、商铺等无关地点
            const ps = new AMap.PlaceSearch({
                pageSize: 10,
                extensions: 'base',
                category: '011100|110100'  // 停车场 | 充电站/电力供应分类
            });

            ps.search(keyword, new AMap.LngLat(S.userLocation[0], S.userLocation[1]), function(status, result) {
                if (status === 'complete' && result.poiList && result.poiList.pois) {
                    const pois = result.poiList.pois;
                    
                    // 二次过滤：确保只保留停车场/充电站
                    const filtered = pois.filter(poi => {
                        const name = (poi.name || '').toLowerCase();
                        const typeStr = (poi.type || '').toLowerCase();
                        return name.includes('停车') || name.includes('停车场') || 
                               name.includes('p+') || name.includes('充电') || 
                               typeStr.includes('停车场') || typeStr.includes('充电') ||
                               typeStr.includes('停车');
                    });
                    
                    if (filtered.length === 0) {
                        $('suggestions').classList.remove('show');
                        return;
                    }
                    
                    const html = filtered.slice(0, 6).map(poi => {
                        const isCharging = (poi.name || '').includes('充电') || (poi.type || '').includes('充电');
                        const type = isCharging ? 'charging' : 'parking';
                        return `
                            <div class="suggestions-item" data-lng="${poi.location.lng}" data-lat="${poi.location.lat}" data-name="${poi.name.replace(/'/g, "\\'")}" data-addr="${(poi.address||'').replace(/'/g, "\\'")}" data-type="${type}">
                                <span class="suggestions-icon ${type}">${isCharging ? '⚡' : '🅿️'}</span>
                                <div class="suggestions-text">
                                    <div class="suggestions-name">${poi.name}</div>
                                    <div class="suggestions-addr">${poi.address || ''}</div>
                                </div>
                                <button class="suggestions-nav-btn" onclick="navigateToPoi('${poi.name.replace(/'/g, "\\'")}','${(poi.address||'').replace(/'/g, "\\'")}','${poi.location.lng}','${poi.location.lat}')">导航</button>
                            </div>
                        `;
                    }).join('');
                    
                    $('suggestions').innerHTML = html;
                    $('suggestions').classList.add('show');
                    
                    // 绑定点击事件
                    document.querySelectorAll('.suggestions-item').forEach(item => {
                        item.addEventListener('click', function(e) {
                            if (e.target.classList.contains('suggestions-nav-btn')) return;
                            const lng = parseFloat(this.dataset.lng);
                            const lat = parseFloat(this.dataset.lat);
                            S.map.setCenter([lng, lat]);
                            S.map.setZoom(16);
                            
                            // 创建临时Marker
                            const tempMarker = createMarker({
                                name: this.dataset.name,
                                address: this.dataset.addr,
                                location: { lng, lat }
                            }, this.dataset.type);
                            clearMarkers();
                            S.markers = [tempMarker];
                            
                            // 点击气泡
                            tempMarker.emit('click');
                            $('suggestions').classList.remove('show');
                        });
                    });
                }
            });
        }

        /* ========================================
           任务2: 地图工具（路况/测距/图层）
           ======================================== */
        function toggleTraffic() {
            S.trafficOn = !S.trafficOn;
            const btn = $('btnTraffic');
            const switchBtn = $('trafficSwitchBtn');
            
            if (S.trafficOn) {
                S.trafficLayer.setMap(S.map);
                btn.classList.add('active');
                switchBtn.classList.add('active');
                toast('已开启实时路况');
            } else {
                S.trafficLayer.setMap(null);
                btn.classList.remove('active');
                switchBtn.classList.remove('active');
                toast('已关闭实时路况');
            }
            saveSettings();  // 持久化到localStorage
        }

        function toggleRanging() {
            const btn = $('btnRanging');
            if (btn.classList.contains('active')) {
                S.rangingTool.turnOff();
                btn.classList.remove('active');
                $('rangingIndicator').style.display = 'none';
                S.map.setStatus({ dragEnable: true, zoomEnable: true, pitchEnable: true });
                toast('已退出测距');
            } else {
                S.rangingTool.turnOn();
                btn.classList.add('active');
                $('rangingDistance').textContent = '0';
                $('rangingIndicator').style.display = 'flex';
                S.map.setStatus({ dragEnable: false, zoomEnable: false, pitchEnable: false });
                toast('点击地图开始测距');
            }
        }

        function switchMapType(type) {
            S.currentMapType = type;
            
            if (type === 'normal') {
                S.satelliteLayer.setMap(null);
                S.roadnetLayer.setMap(null);
            } else if (type === 'satellite') {
                S.satelliteLayer.setMap(S.map);
                S.roadnetLayer.setMap(S.map);  // 卫星图叠加路网，对齐高德同款卫星道路模式
            }
            
            document.querySelectorAll('.layer-item').forEach(el => el.classList.remove('active'));
            $('layer' + type.charAt(0).toUpperCase() + type.slice(1)).classList.add('active');
            saveSettings();  // 持久化到localStorage
        }

        function switchTheme(theme) {
            S.currentTheme = theme;
            const styles = {
                normal: 'amap://styles/normal',
                blue: 'amap://styles/blue',
                dark: 'amap://styles/dark'
            };
            S.map.setMapStyle(styles[theme]);
            
            document.querySelectorAll('.theme-item').forEach(el => el.classList.remove('active'));
            $('theme' + theme.charAt(0).toUpperCase() + theme.slice(1)).classList.add('active');
            saveSettings();  // 持久化到localStorage
        }

        /* ========================================
           任务3: 驾车导航
           ======================================== */
        function loadHistory() {
            try {
                const data = localStorage.getItem('gd_nav_history');
                if (data) {
                    S.history = JSON.parse(data);
                }
            } catch(e) {}
            renderHistory();
        }

        function renderHistory() {
            if (!S.history || S.history.length === 0) {
                $('navHistoryList').innerHTML = '<div class="nav-history-item" style="color:var(--text-3); font-size:13px; justify-content:center;">暂无历史记录</div>';
                return;
            }
            
            const html = S.history.map(h => `
                <div class="nav-history-item" data-lng="${h.lng}" data-lat="${h.lat}" data-name="${h.name.replace(/'/g, "\\'")}">
                    <span class="nav-history-icon ${h.type}">${h.type === 'charging' ? '⚡' : '🅿️'}</span>
                    <div class="nav-history-text-wrap">
                        <div class="nav-history-text">${h.name}</div>
                        <div class="nav-history-addr">${h.addr || ''}</div>
                    </div>
                </div>
            `).join('');
            
            $('navHistoryList').innerHTML = html;
            
            // 绑定点击事件
            document.querySelectorAll('.nav-history-item').forEach(item => {
                if (!item.dataset.lng) return;
                item.addEventListener('click', function() {
                    const lng = parseFloat(this.dataset.lng);
                    const lat = parseFloat(this.dataset.lat);
                    $('navEndInput').value = this.dataset.name;
                    S._endPoint = { lng, lat, name: this.dataset.name };
                    // 地图居中并高亮
                    S.map.setCenter([lng, lat]);
                    S.map.setZoom(16);
                    clearMarkers();
                    const tempMarker = createMarker({
                        name: this.dataset.name,
                        address: this.dataset.addr || '',
                        location: { lng, lat }
                    }, this.dataset.type || 'parking');
                    S.markers = [tempMarker];
                    tempMarker.setMap(S.map);
                });
            });
        }

        function navigateToPoi(name, addr, lng, lat) {
            S.infoWindow.close();
            $('navEndInput').value = name;
            S._endPoint = { lng: parseFloat(lng), lat: parseFloat(lat), name };
            
            if (!S._startPoint && S.hasLocation) {
                S._startPoint = { lng: S.userLocation[0], lat: S.userLocation[1], name: '我的位置' };
            }
            
            // 直接规划路线
            showPanel('route');
            planRoute();
        }

        function planRoute(policy) {
            if (!S._startPoint) {
                if (S.hasLocation) {
                    S._startPoint = { lng: S.userLocation[0], lat: S.userLocation[1], name: '我的位置' };
                } else {
                    toast('请先获取您的位置');
                    return;
                }
            }
            
            if (!S._endPoint) {
                toast('请输入终点');
                showPanel('nav');
                return;
            }
            
            const routePolicy = policy !== undefined ? parseInt(policy) : 0;
            
            // 复用现有Driving实例，避免重复创建导致闪烁
            if (!S.driving) {
                S.driving = new AMap.Driving({
                    map: S.map,
                    hideMarkers: false,
                    autoFitView: true,
                    policy: routePolicy
                });
            } else {
                S.driving.setPolicy(routePolicy);
            }

            showLoading('路线规划中...');
            toast('正在规划路线...');

            S.driving.search(
                new AMap.LngLat(S._startPoint.lng, S._startPoint.lat),
                new AMap.LngLat(S._endPoint.lng, S._endPoint.lat),
                function(status, result) {
                    hideLoading();
                    if (status === 'complete' && result.routes && result.routes.length > 0) {
                        renderRoutes(result.routes);
                    } else if (status === 'complete' && (!result.routes || result.routes.length === 0)) {
                        // 驾车路线规划成功但没有可用路线
                        $('routeList').innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-3); font-size: 14px;">暂无通行路线<br><span style="font-size:12px;margin-top:8px;display:inline-block;">可能起点终点距离过近或无法通行</span></div>';
                        $('routeActions').style.display = 'none';
                        toast('暂无通行路线');
                    } else {
                        // 系统错误
                        $('routeList').innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-3); font-size: 14px;">路线规划失败<br><span style="font-size:12px;margin-top:8px;display:inline-block;">请检查网络后重试</span></div>';
                        toast('路线规划失败');
                    }
                }
            );
        }

        function renderRoutes(routes) {
            // 更新tab激活状态
            document.querySelectorAll('.route-tab').forEach(t => t.classList.remove('active'));

            // 存储路线数据用于后续切换重绘
            S._cachedRoutes = routes;
            
            const html = routes.map((route, idx) => {
                const km = (route.distance / 1000).toFixed(1);
                const minutes = Math.round(route.time / 60);
                const hours = Math.floor(minutes / 60);
                const mins = minutes % 60;
                const timeStr = hours > 0 ? hours + '小时' + mins + '分' : mins + '分钟';
                const tolls = route.tolls || 0;
                
                // 根据策略选择路线标签（高德风格）
                const labels = ['推荐', '躲避拥堵', '避免收费'];
                const label = labels[idx] || (idx + 1) + '号方案';
                
                return `
                    <div class="route-item ${idx === 0 ? 'active' : ''}" data-index="${idx}">
                        <div class="route-header">
                            <span class="route-time">${timeStr}</span>
                            <span class="route-price">${tolls > 0 ? '<span class="toll">¥' + tolls + '</span> 过路费' : '无收费'}</span>
                        </div>
                        <div class="route-info">
                            <span>${km} 公里</span>
                            <span>${route.trafficLights || 0} 个红绿灯</span>
                            <span style="color:var(--primary);font-weight:500;">${label}</span>
                        </div>
                    </div>
                `;
            }).join('');
            
            $('routeList').innerHTML = html;
            $('routeActions').style.display = 'flex';
            
            // 绑定路线点击：切换高亮并调用Driving的searchOnRoute重绘对应路线
            document.querySelectorAll('.route-item').forEach(item => {
                item.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    document.querySelectorAll('.route-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 切换到选中路线并重绘地图（Driving支持切换方案）
                    if (S.driving && S._startPoint && S._endPoint && S._cachedRoutes && S._cachedRoutes[idx]) {
                        // 先清除旧路线，再用当前策略重新规划
                        S.driving.clear();
                        // 根据索引设置策略：0=推荐, 1=躲避拥堵, 2=避免收费
                        const policies = [0, 2, 1];
                        S.driving.setPolicy(policies[idx] || 0);
                        S.driving.search(
                            new AMap.LngLat(S._startPoint.lng, S._startPoint.lat),
                            new AMap.LngLat(S._endPoint.lng, S._endPoint.lat),
                            function(status, result) {
                                // 成功后自动绘制，无需额外处理
                            }
                        );
                    }
                });
            });
            
            toast('找到 ' + routes.length + ' 条路线');
        }

        function clearRoute() {
            S.driving.clear();
            $('navStartInput').value = '我的位置';
            $('navEndInput').value = '';
            S._startPoint = null;
            S._endPoint = null;
            $('routeList').innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-3); font-size: 14px;">请先输入起终点后点击「路线规划」</div>';
            $('routeActions').style.display = 'none';
            toast('已清空路线');
        }

        /* ========================================
           事件绑定
           ======================================== */
        document.addEventListener('DOMContentLoaded', function() {
            initMap();

            // 页面卸载时清理定时器和监听，防止内存泄漏
            window.addEventListener('beforeunload', function() {
                // 清理所有定时器
                clearTimeout(S.searchTimer);
                clearTimeout(S._searchTimeoutTimer);
                clearTimeout(S._toastTimer);
                // 取消所有待处理请求
                _backgroundTimers.forEach(t => clearTimeout(t));
                // 隐藏loading，防止页面关闭后仍在后台loading
                hideLoading();
            });

            // 软键盘弹出监听：地图、底部弹窗高度锁定不变，仅搜索栏微调
            // 使用 visualViewport API 检测真实软键盘状态，兼容安卓/iOS/微信/UC/X5
            const initialHeight = window.innerHeight;
            const visualViewportSupported = window.visualViewport !== undefined;

            function handleKeyboardState() {
                // 优先使用visualViewport，更精确
                let viewportHeight;
                if (visualViewportSupported) {
                    viewportHeight = window.visualViewport.height;
                } else {
                    viewportHeight = window.innerHeight;
                }

                // 计算高度变化百分比
                const ratio = viewportHeight / initialHeight;
                const isKeyboardOpen = ratio < 0.75;

                // 搜索栏：软键盘弹出时字号缩小
                const topSearchInput = document.querySelector('.top-search-input');
                const topSearchBox = document.querySelector('.top-search-box');
                if (topSearchInput) {
                    topSearchInput.style.fontSize = isKeyboardOpen ? '13px' : '';
                }
                if (topSearchBox) {
                    topSearchBox.style.height = isKeyboardOpen ? '36px' : '';
                }

                // 地图容器：强制锁定高度，不随软键盘收缩
                const map = document.getElementById('map');
                if (map) {
                    map.style.height = '100vh';
                    map.style.height = '100dvh';
                }

                // 底部弹窗：锁定高度，不随软键盘上移
                const cityPanel = document.querySelector('.city-panel');
                if (cityPanel && cityPanel.classList.contains('show')) {
                    // 保持弹窗的固定高度百分比
                    cityPanel.style.height = '65vh';
                }
                const leftPanel = document.querySelector('.left-panel');
                if (leftPanel && leftPanel.classList.contains('show')) {
                    leftPanel.style.height = '65vh';
                }
            }

            // window resize 监听（兼容旧版浏览器）
            let resizeTimer = null;
            window.addEventListener('resize', function() {
                if (resizeTimer) clearTimeout(resizeTimer);
                resizeTimer = setTimeout(handleKeyboardState, 100);
            });

            // visualViewport 专项监听（iOS Safari / 微信WKWebView最准确）
            if (visualViewportSupported) {
                window.visualViewport.addEventListener('resize', function() {
                    handleKeyboardState();
                    // 同步地图可视区域，防止高德地图错位
                    if (S.map && typeof S.map.resize === 'function') {
                        S.map.resize();
                    }
                });

                window.visualViewport.addEventListener('scroll', function() {
                    // iOS软键盘弹出时，页面可能发生轻微滚动，重置为0
                    window.scrollTo(0, 0);
                });
            }

            // 横竖屏切换自适应：重置所有面板高度、地图尺寸、抽屉档位
            function handleOrientationChange() {
                setTimeout(function() {
                    // 重置地图尺寸
                    if (S.map && typeof S.map.resize === 'function') {
                        S.map.resize();
                    }

                    // 重置面板高度：竖屏65vh，横屏70vh
                    const isLandscape = window.innerWidth > window.innerHeight;
                    const panelHeight = isLandscape ? '70vh' : '65vh';

                    document.querySelectorAll('.city-panel, .left-panel').forEach(panel => {
                        panel.style.height = panelHeight;
                    });

                    // 重置body滚动位置
                    window.scrollTo(0, 0);
                    document.body.scrollTop = 0;

                    toast(isLandscape ? '已切换横屏' : '已切换竖屏');
                }, 300);
            }

            // orientationchange + resize 双通道监听
            window.addEventListener('orientationchange', handleOrientationChange);

            // ===== 全局防抖包装器（200ms）=====
            const _debouncedSwitchMap = debounce(type => switchMapType(type), 200);
            const _debouncedSwitchTheme = debounce(theme => switchTheme(theme), 200);
            const _debouncedSearchNearby = debounce(type => searchNearby(type), 200);
            const _debouncedSearchKeyword = debounce(kw => {
                $('suggestions').classList.remove('show');
                searchByKeyword(kw);
            }, 200);
            const _debouncedShowPanel = debounce(type => showPanel(type), 200);
            const _debouncedToggleRanging = debounce(() => toggleRanging(), 200);

            // 顶部按钮（防抖200ms）
            $('btnTraffic').addEventListener('click', _debouncedTraffic);
            $('btnRanging').addEventListener('click', _debouncedToggleRanging);
            $('btnLayers').addEventListener('click', () => _debouncedShowPanel('layer'));

            // 城市天气模块点击打开城市选择
            $('citySelector').addEventListener('click', showCityPanel);
            $('cityPanelClose').addEventListener('click', hideCityPanel);
            $('cityPanelOverlay').addEventListener('click', hideCityPanel);

            // 城市搜索输入框（已自带input事件，无需防抖）
            $('citySearchInput').addEventListener('input', function() {
                renderCityList(this.value);
            });

            // 城市弹窗esc关闭
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    hideCityPanel();
                }
            });

            // 测距退出按钮
            $('btnExitRanging').addEventListener('click', function() {
                if ($('btnRanging').classList.contains('active')) {
                    _debouncedToggleRanging();
                }
            });

            // 搜索框（防抖200ms）
            $('searchBtn').addEventListener('click', () => {
                const kw = $('searchInput').value.trim();
                if (kw) _debouncedSearchKeyword(kw);
            });
            $('searchInput').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') {
                    const kw = this.value.trim();
                    if (kw) _debouncedSearchKeyword(kw);
                } else {
                    clearTimeout(S.searchTimer);
                    S.searchTimer = setTimeout(() => showSuggestions(this.value), 300);
                }
            });
            $('searchInput').addEventListener('focus', function() {
                if (this.value.trim()) showSuggestions(this.value);
            });

            // 点击地图外关闭联想
            S.map && S.map.on('click', () => $('suggestions').classList.remove('show'));

            // 快捷图标（防抖200ms）
            $('quickCharge').addEventListener('click', () => _debouncedSearchNearby('charging'));
            $('quickParking').addEventListener('click', () => _debouncedSearchNearby('parking'));

            // 左侧面板
            $('leftPanelClose').addEventListener('click', hidePanel);
            $('leftPanelOverlay').addEventListener('click', hidePanel);
            $('btnNavigation').addEventListener('click', () => _debouncedShowPanel('nav'));

            // 图层面板内各选项（防抖200ms）
            document.querySelectorAll('.layer-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = this.id;
                    if (id === 'layerNormal') _debouncedSwitchMap('normal');
                    else if (id === 'layerSatellite') _debouncedSwitchMap('satellite');
                });
            });
            document.querySelectorAll('.theme-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = this.id;
                    if (id === 'themeNormal') _debouncedSwitchTheme('normal');
                    else if (id === 'themeBlue') _debouncedSwitchTheme('blue');
                    else if (id === 'themeDark') _debouncedSwitchTheme('dark');
                });
            });
            const trafficSwitchBtn = $('trafficSwitchBtn');
            if (trafficSwitchBtn) {
                trafficSwitchBtn.addEventListener('click', _debouncedTraffic);
            }

            // ===== 手势冲突隔离：内容列表滚动不触发地图操作 =====
            const gestureIsolationContainers = [
                'suggestions',
                'cityPanelContent',
                'leftPanelContent'
            ];

            gestureIsolationContainers.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                // PC端滚轮事件阻止冒泡，防止滚动列表同时缩放地图
                el.addEventListener('wheel', function(e) {
                    e.stopPropagation();
                }, { passive: false });
                // 触摸滚动时阻止冒泡，避免触发地图拖拽
                el.addEventListener('touchmove', function(e) {
                    e.stopPropagation();
                }, { passive: false });
            });
            // 导航面板
            $('navSwapBtn').addEventListener('click', () => {
                const temp = S._startPoint;
                S._startPoint = S._endPoint;
                S._endPoint = temp;
                
                const startVal = $('navStartInput').value;
                const endVal = $('navEndInput').value;
                $('navStartInput').value = endVal || '我的位置';
                $('navEndInput').value = startVal;
            });
            
            $('navStartBtn').addEventListener('click', function() {
                const endVal = $('navEndInput').value.trim();
                if (!endVal) {
                    toast('请输入终点');
                    return;
                }
                
                if (!S._endPoint || S._endPoint.name !== endVal) {
                    // 搜索终点坐标
                    const geocoder = new AMap.Geocoder({ city: '全国' });
                    geocoder.getLocation(endVal, function(status, result) {
                        if (status === 'complete' && result.geocodes.length > 0) {
                            const loc = result.geocodes[0].location;
                            S._endPoint = { lng: loc.lng, lat: loc.lat, name: endVal };
                            showPanel('route');
                            planRoute();
                        } else {
                            toast('未找到终点坐标');
                        }
                    });
                } else {
                    showPanel('route');
                    planRoute();
                }
            });

            $('clearHistory').addEventListener('click', function() {
                S.history = [];
                try { localStorage.removeItem('gd_nav_history'); } catch(e) {}
                renderHistory();
                toast('已清空历史记录');
            });

            // 起终点输入框
            $('navStartInput').addEventListener('blur', function() {
                if (this.value.trim() && this.value !== '我的位置') {
                    const geocoder = new AMap.Geocoder({ city: '全国' });
                    geocoder.getLocation(this.value, function(status, result) {
                        if (status === 'complete' && result.geocodes.length > 0) {
                            const loc = result.geocodes[0].location;
                            S._startPoint = { lng: loc.lng, lat: loc.lat, name: this.value };
                        }
                    }.bind(this));
                }
            });
            
            $('navEndInput').addEventListener('blur', function() {
                if (this.value.trim()) {
                    const geocoder = new AMap.Geocoder({ city: '全国' });
                    geocoder.getLocation(this.value, function(status, result) {
                        if (status === 'complete' && result.geocodes.length > 0) {
                            const loc = result.geocodes[0].location;
                            S._endPoint = { lng: loc.lng, lat: loc.lat, name: this.value };
                        }
                    }.bind(this));
                }
            });

            // 起点清空按钮
            $('clearStart').addEventListener('click', function() {
                $('navStartInput').value = S.hasLocation ? '我的位置' : '';
                S._startPoint = null;
                $('clearStart').style.display = 'none';
            });

            // 终点清空按钮
            $('clearEnd').addEventListener('click', function() {
                $('navEndInput').value = '';
                S._endPoint = null;
                $('clearEnd').style.display = 'none';
            });

            // 输入框内容变化显示/隐藏清空按钮
            $('navStartInput').addEventListener('input', function() {
                $('clearStart').style.display = (this.value && this.value !== '我的位置') ? 'flex' : 'none';
            });
            $('navEndInput').addEventListener('input', function() {
                $('clearEnd').style.display = this.value ? 'flex' : 'none';
            });

            // 图层面板（防抖200ms）
            $('layerNormal').addEventListener('click', () => { _debouncedSwitchMap('normal'); });
            $('layerSatellite').addEventListener('click', () => { _debouncedSwitchMap('satellite'); });
            $('themeNormal').addEventListener('click', () => switchTheme('normal'));
            $('themeBlue').addEventListener('click', () => switchTheme('blue'));
            $('themeDark').addEventListener('click', () => switchTheme('dark'));
            $('trafficSwitch').addEventListener('click', _debouncedTraffic);

            // 路线tab
            document.querySelectorAll('.route-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    const policy = this.dataset.policy;
                    document.querySelectorAll('.route-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    planRoute(policy);
                });
            });

            $('btnClearRoute').addEventListener('click', clearRoute);
            $('btnReroute').addEventListener('click', () => planRoute());

            // 地图工具按钮
            $('btnLocate').addEventListener('click', () => {
                if (S.hasLocation) {
                    S.map.setCenter(S.userLocation);
                    S.map.setZoom(14);
                    toast('已定位到我的位置');
                } else {
                    toast('定位中...');
                }
            });
            $('btnZoomIn').addEventListener('click', () => S.map.zoomIn());
            $('btnZoomOut').addEventListener('click', () => S.map.zoomOut());
        });
    </script>
</body>
</html>
