// 分页加载：请求指定页码的数据
function fetchParkingAndChargingPage(center, page){
  var locStr = center[0] + ',' + center[1];

  // 使用 Promise.allSettled：任一接口失败仍可展示部分数据
  var requests = [
    amapFetch('place/around', {
      location: locStr, types: '停车场',
      radius: 5000, extensions: 'all',
      page: page, offset: pageSize, sort: 'distance'
    }),
    amapFetch('station/electric', {
      location: locStr, radius: 5000, extensions: 'all',
      page: page, offset: pageSize
    })
  ];

  if(typeof Promise.allSettled === 'function'){
    Promise.allSettled(requests).then(function(results){
      // 获取错误信息
      var parkingErr = results[0].status === 'rejected' ? (results[0].reason && results[0].reason.message || '停车场数据加载失败') : null;
      var chargingErr = results[1].status === 'rejected' ? (results[1].reason && results[1].reason.message || '充电站数据加载失败') : null;

      var rawParking = (results[0].status === 'fulfilled' && results[0].value && results[0].value.pois) || [];
      var rawCharging = (results[1].status === 'fulfilled' && results[1].value
        && (results[1].value.stations || results[1].value.pois || [])) || [];

      // 获取总数
      if(results[0].status === 'fulfilled' && results[0].value){
        totalParkingCount = parseInt(results[0].value.count || 0, 10);
      }
      if(results[1].status === 'fulfilled' && results[1].value){
        totalChargingCount = parseInt(results[1].value.count || 0, 10);
      }

      // 标记类型 + 字段对齐
      for(var i = 0; i < rawParking.length; i++) rawParking[i]._type = 'parking';
      for(var j = 0; j < rawCharging.length; j++){
        rawCharging[j]._type = 'charging';
        if(!rawCharging[j].location && rawCharging[j].longitude !== undefined){
          rawCharging[j].location = rawCharging[j].longitude + ',' + rawCharging[j].latitude;
        }
        if(!rawCharging[j].name && rawCharging[j].station_name){
          rawCharging[j].name = rawCharging[j].station_name;
        }
        if(!rawCharging[j].address){
          rawCharging[j].address = [
            rawCharging[j].province || '', rawCharging[j].city || '',
            rawCharging[j].district || '', rawCharging[j].address_detail || ''
          ].join('');
        }
      }

      // 累积数据
      allRawParking = allRawParking.concat(rawParking);
      allRawCharging = allRawCharging.concat(rawCharging);
      loadedParkingCount = allRawParking.length;
      loadedChargingCount = allRawCharging.length;

      // 判断是否还有更多数据
      var parkHasMore = totalParkingCount > 0 && loadedParkingCount < totalParkingCount;
      var chargeHasMore = totalChargingCount > 0 && loadedChargingCount < totalChargingCount;
      hasMorePages = parkHasMore || chargeHasMore;

      var combined = allRawParking.concat(allRawCharging);

      if(page === 1){
        hideLoading();
        if(combined.length === 0){
          currentPOIs = [];
          renderPOIPanel([], currentKeyword);
          renderMapMarkers([]);
          if(parkingErr && chargingErr){
            toast('数据获取失败，请检查网络后重试');
          } else if(parkingErr){
            toast('停车场数据加载失败，可稍后重试');
          } else if(chargingErr){
            toast('充电站数据加载失败，可稍后重试');
          } else {
            toast('附近未查询到停车场与充电站', 3000);
          }
          showPanel();
          return;
        }
        var processed = processPOIs(combined, center);
        currentPOIs = processed;
        offlineCache = { pois: processed, kw: currentKeyword, center: center, radius: 5000, ts: Date.now() };
        saveLS('offline_cache', offlineCache);
        renderPOIPanel(processed, currentKeyword);
        renderMapMarkers(processed);

        // 部分数据失败时显示友好提示
        if(parkingErr && !chargingErr){
          toast('停车场数据加载失败，仅显示充电站结果', 3000);
        } else if(chargingErr && !parkingErr){
          toast('充电站数据加载失败，仅显示停车场结果', 3000);
        }
        showPanel();

        // 绑定滚动监听（第一页加载完成后）
        setupScrollLoadMore(center);
      } else {
        // 后续页码：追加数据
        isLoadingMore = false;
        hideLoadingMoreIndicator();

        // 如果没有更多数据，显示"已加载全部"提示
        if(!hasMorePages){
          showNoMoreIndicator();
        }

        var processed = processPOIs(combined, center);
        currentPOIs = processed;
        renderPOIPanel(processed, currentKeyword);
        renderMapMarkers(processed);
      }
    });
  } else {
    // 旧浏览器 fallback
    Promise.all([
      requests[0].catch(function(){ return null; }),
      requests[1].catch(function(){ return null; })
    ]).then(function(results){
      hideLoading();
      var rawParking = (results[0] && results[0].pois) || [];
      var rawCharging = (results[1] && (results[1].stations || results[1].pois || [])) || [];
      for(var i = 0; i < rawParking.length; i++) rawParking[i]._type = 'parking';
      for(var j = 0; j < rawCharging.length; j++){
        rawCharging[j]._type = 'charging';
        if(!rawCharging[j].location && rawCharging[j].longitude !== undefined){
          rawCharging[j].location = rawCharging[j].longitude + ',' + rawCharging[j].latitude;
        }
        if(!rawCharging[j].name && rawCharging[j].station_name){
          rawCharging[j].name = rawCharging[j].station_name;
        }
      }
      var combined = rawParking.concat(rawCharging);
      if(combined.length === 0){
        if(offlineCache && offlineCache.pois && offlineCache.pois.length){
          currentPOIs = offlineCache.pois;
          renderPOIPanel(offlineCache.pois, offlineCache.kw);
          renderMapMarkers(offlineCache.pois);
          showMapError('📡 网络异常，显示上次缓存数据');
        } else {
          renderPOIPanel([], currentKeyword);
          renderMapMarkers([]);
          toast('附近未查询到停车场与充电站');
        }
        showPanel();
        return;
      }
      var processed = processPOIs(combined, center);
      currentPOIs = processed;
      offlineCache = { pois: processed, kw: currentKeyword, center: center, radius: 5000, ts: Date.now() };
      saveLS('offline_cache', offlineCache);
      renderPOIPanel(processed, currentKeyword);
      renderMapMarkers(processed);
      showPanel();
    });
  }
}

// 绑定滚动加载更多
function setupScrollLoadMore(center){
  var pc = $('panelContent');
  if(!pc) return;

  // 移除旧的监听
  if(scrollLoadBound){
    pc.removeEventListener('scroll', scrollLoadBound);
  }

  scrollLoadBound = function(){
    if(isLoadingMore || !hasMorePages) return;
    var rect = pc.getBoundingClientRect();
    var scrollTop = pc.scrollTop || document.body.scrollTop;
    var scrollHeight = pc.scrollHeight;
    // 滚动到距离底部 80px 时触发加载
    if(scrollTop + rect.height >= scrollHeight - 80){
      loadMoreParkingAndCharging(center);
    }
  };

  pc.addEventListener('scroll', scrollLoadBound);
}

function setPanelMode(mode){
  var mp = $('mainPanel');
  if(!mp) return;

  mp.classList.remove('mode-float', 'mode-fullscreen', 'mode-collapsed');

/* =========================================================================
 * 面板拖拽功能（支持触摸和鼠标）
 * ======================================================================== */
var isDragging = false;
var dragStartY = 0;
var dragStartHeight = 0;
var panelMinHeight = 60;      // 折叠状态高度
var panelFloatHeight = 45;     // 悬浮状态高度百分比
var panelNormalHeight = 65;    // 标准状态高度百分比
var panelFullHeight = 92;      // 全屏状态高度百分比
var dragVelocity = 0;
var lastDragY = 0;

function initPanelDrag(){
  var handle = $('panelDragHandle');
  var panel = $('mainPanel');
  if(!handle || !panel) return;

  // 触摸事件
  handle.addEventListener('touchstart', handleDragStart, { passive: true });
  handle.addEventListener('touchmove', handleDragMove, { passive: false });
  handle.addEventListener('touchend', handleDragEnd);

  // 鼠标事件
  handle.addEventListener('mousedown', handleDragStart);
  document.addEventListener('mousemove', handleMouseMove);
  document.addEventListener('mouseup', handleDragEnd);
}

function handleDragStart(e){
  isDragging = true;
  var clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
  dragStartY = clientY;
  lastDragY = clientY;
  dragStartHeight = getCurrentPanelHeightPercent();
  dragVelocity = 0;

  // 添加拖拽状态样式
  var panel = $('mainPanel');
  if(panel) panel.classList.add('dragging');

  // 防止滚动穿透
  e.preventDefault ? e.preventDefault() : (e.returnValue = false);
}

function handleDragMove(e){
  if(!isDragging) return;
  var clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

  // 计算速度（用于惯性判断）
  dragVelocity = clientY - lastDragY;
  lastDragY = clientY;

  var deltaY = dragStartY - clientY;
  var viewportHeight = window.innerHeight;
  var deltaPercent = (deltaY / viewportHeight) * 100;
  var newHeightPercent = dragStartHeight + deltaPercent;

  // 限制高度范围
  newHeightPercent = Math.max(panelMinHeight / viewportHeight * 100, Math.min(panelFullHeight, newHeightPercent));

  // 直接设置面板高度（不触发吸附）
  setPanelHeightPercent(newHeightPercent);

  // 防止页面滚动
  e.preventDefault ? e.preventDefault() : (e.returnValue = false);
}

function handleMouseMove(e){
  if(!isDragging) return;
  handleDragMove(e);
}

function handleDragEnd(){
  if(!isDragging) return;
  isDragging = false;

  var panel = $('mainPanel');
  if(panel) panel.classList.remove('dragging');

  var currentHeight = getCurrentPanelHeightPercent();
  var targetHeight = snapToNearestMode(currentHeight);

  // 平滑过渡到目标高度
  animatePanelHeight(currentHeight, targetHeight);
}

function getCurrentPanelHeightPercent(){
  var panel = $('mainPanel');
  if(!panel) return panelNormalHeight;

  // 检查当前模式
  if(panel.classList.contains('mode-collapsed')) return panelMinHeight / window.innerHeight * 100;
  if(panel.classList.contains('mode-float')) return panelFloatHeight;
  if(panel.classList.contains('mode-fullscreen')) return panelFullHeight;
  return panelNormalHeight;
}

function setPanelHeightPercent(percent){
  var panel = $('mainPanel');
  if(!panel) return;

  // 移除模式类
  panel.classList.remove('mode-float', 'mode-fullscreen', 'mode-collapsed');

  // 应用新高度
  if(percent <= panelMinHeight / window.innerHeight * 100 + 5){
    panel.classList.add('mode-collapsed');
    currentPanelMode = 'collapsed';
  } else if(percent < panelFloatHeight + 10){
    panel.classList.add('mode-float');
    currentPanelMode = 'float';
  } else if(percent > panelFullHeight - 5){
    panel.classList.add('mode-fullscreen');
    currentPanelMode = 'fullscreen';
  } else if(percent < panelNormalHeight + 10){
    currentPanelMode = 'normal';
  } else {
    panel.classList.add('mode-fullscreen');
    currentPanelMode = 'fullscreen';
  }

  // 更新模式按钮状态
  var btns = document.querySelectorAll('.panel-mode-btn');
  for(var i = 0; i < btns.length; i++){
    btns[i].classList.remove('active');
    if(btns[i].getAttribute('data-mode') === currentPanelMode){
      btns[i].classList.add('active');
    }
  }
}

function snapToNearestMode(currentPercent){
  // 根据速度和当前位置决定吸附目标
  var snapThreshold = 15; // 速度阈值

  // 如果拖拽速度很快，直接跳转到目标
  if(Math.abs(dragVelocity) > snapThreshold){
    if(dragVelocity > 0){
      // 向上拖拽（缩小面板）
      if(currentPercent < panelNormalHeight) return panelFloatHeight;
      return panelNormalHeight;
    } else {
      // 向下拖拽（放大面板）
      if(currentPercent > panelNormalHeight) return panelFullHeight;
      return panelNormalHeight;
    }
  }

  // 速度较慢，根据距离判断
  var distances = [
    { mode: 'collapsed', height: panelMinHeight / window.innerHeight * 100 },
    { mode: 'float', height: panelFloatHeight },
    { mode: 'normal', height: panelNormalHeight },
    { mode: 'fullscreen', height: panelFullHeight }
  ];

  var minDistance = Infinity;
  var targetHeight = panelNormalHeight;

  for(var i = 0; i < distances.length; i++){
    var dist = Math.abs(currentPercent - distances[i].height);
    if(dist < minDistance){
      minDistance = dist;
      targetHeight = distances[i].height;
    }
  }

  return targetHeight;
}

function animatePanelHeight(fromPercent, toPercent){
  var duration = 300;
  var startTime = Date.now();
  var panel = $('mainPanel');
  if(!panel) return;

  function animate(){
    var elapsed = Date.now() - startTime;
    var progress = Math.min(elapsed / duration, 1);

    // 使用缓动函数
    progress = easeOutCubic(progress);

    var currentPercent = fromPercent + (toPercent - fromPercent) * progress;
    setPanelHeightPercent(currentPercent);

    if(progress < 1){
      requestAnimationFrame(animate);
    }
  }

  animate();
}

function easeOutCubic(t){
  return 1 - Math.pow(1 - t, 3);
}

/* =========================================================================
 * POI 数据处理
 * ======================================================================== */
function processPOIs(raw, center){
  if(!raw || raw.length === 0) return [];
  var out = [];
  for(var i = 0; i < raw.length; i++){
    var p = raw[i];
    var pos = parseLngLatStr(p.location);
    if(!pos) continue;
    var forcePark = p._type === 'parking';
    var forceCharge = p._type === 'charging';
    var isParking = forcePark || /停车|车位/.test(p.name + ' ' + (p.type || ''));
    var isCharging = forceCharge || /充电|换电/.test(p.name + ' ' + (p.type || ''));
    if(!isParking && !isCharging){
      isParking = /停车|车位/.test(currentKeyword);
      isCharging = /充电|换电/.test(currentKeyword);
    }
    var dist = p.distance ? parseFloat(p.distance) : haversine(center, pos);
    var rating = parseFloat(p.rating || 0);
    var poi = {
      id: p.id || ('p'+i),
      name: p.name || '未命名',
      address: p.address || p.pname || '',
      lngLat: pos,
      isParking: isParking,
      isCharging: isCharging,
      distance: dist,
      tel: p.tel || '',
      rating: rating,
      openTime: (p.biz_ext && (p.biz_ext.open_time || p.biz_ext.open_hours)) || p.opn_hrs || p.biz_hours || '营业时间不详'
    };

    if(isParking){
      var info = {
        parkType: '室内', capPrice: null, freeMins: null, status: 'green', statusText: '车位充足',
        totalSpots: 0, freeSpots: 0, totalFee: '', hourlyFee: ''
      };
      if(/路面|路边|路内/.test(poi.address + p.name)) info.parkType = '路面';
      if(/地下/.test(poi.address + p.name)) info.parkType = '地下';
      if(/露天|室外/.test(poi.address + p.name)) info.parkType = '露天';
      // 提取价格信息
      if(p.biz_ext){
        if(p.biz_ext.cost) info.capPrice = p.biz_ext.cost;
        if(p.biz_ext.parking_lot) info.totalSpots = parseInt(p.biz_ext.parking_lot, 10);
      }
      // 提取实时车位数据（高德停车场接口）
      if(p.num !== undefined && p.num !== null) info.freeSpots = parseInt(p.num, 10);
      else if(p.spaces !== undefined && p.spaces !== null) info.freeSpots = parseInt(p.spaces, 10);
      else if(p.vacancy !== undefined && p.vacancy !== null) info.freeSpots = parseInt(p.vacancy, 10);
      // 提取费用信息
      if(p.cost) info.hourlyFee = p.cost;
      if(p.total_cost) info.totalFee = p.total_cost;
      // 提取免费时长
      if(p.freeMins || p.free_time) info.freeMins = parseInt(p.freeMins || p.free_time, 10);
      // 营业时间
      if(p.openTime) poi.openTime = p.openTime;
      // 状态判断
      if(info.freeSpots > 10){ info.status = 'green'; info.statusText = '车位充足'; }
      else if(info.freeSpots > 3){ info.status = 'yellow'; info.statusText = '车位较少'; }
      else if(info.freeSpots > 0){ info.status = 'red'; info.statusText = '车位紧张'; }
      else if(info.freeSpots === 0){ info.status = 'red'; info.statusText = '已停满'; }
      else {
        // 无实时数据时使用评分
        if(rating > 4.0){ info.status = 'green'; info.statusText = '车位充足'; }
        else if(rating > 3.0){ info.status = 'yellow'; info.statusText = '车位较少'; }
        else { info.status = 'red'; info.statusText = '车位紧张'; }
      }
      poi.parkingInfo = info;
      poi.exitLocation = pos;
    }

    if(isCharging){
      var ci = {
        power: '标准功率', fee: '', totalPiles: 0, freePiles: 0,
        fastPiles: 0, slowPiles: 0, waitNum: 0,
        pay: '扫码支付', open24h: false, status: 'green', statusText: '空闲充足',
        brand: '', supportFast: false
      };
      // 提取费用信息
      if(p.biz_ext && p.biz_ext.cost) ci.fee = p.biz_ext.cost;
      // 提取电价和服务费（高德充电桩接口）
      if(p.electricity) ci.fee = p.electricity + '元/度';
      if(p.serviceCharge) ci.fee += ' + ' + p.serviceCharge + '元/度服务费';
      // 提取桩数量
      var nm = p.name || '';
      var m = /(\d+)\s*个?桩/.exec(nm);
      if(m) ci.totalPiles = parseInt(m[1], 10);
      else if(p.biz_ext && p.biz_ext.parking_lot) ci.totalPiles = parseInt(p.biz_ext.parking_lot, 10);
      else if(p.total) ci.totalPiles = parseInt(p.total, 10);
      // 快充桩数
      if(p.fastChargingNum) ci.fastPiles = parseInt(p.fastChargingNum, 10);
      if(p.slowChargingNum) ci.slowPiles = parseInt(p.slowChargingNum, 10);
      // 空闲桩数（优先使用实时数据）
      if(p.available !== undefined && p.available !== null){
        ci.freePiles = parseInt(p.available, 10);
      } else if(p.freeNum !== undefined && p.freeNum !== null){
        ci.freePiles = parseInt(p.freeNum, 10);
      } else if(p.nums !== undefined && p.nums !== null){
        ci.freePiles = parseInt(p.nums, 10);
      } else {
        ci.freePiles = Math.max(0, Math.round((ci.totalPiles || 5) * (rating/5)));
      }
      // 等待数量
      if(p.waitnum !== undefined) ci.waitNum = parseInt(p.waitnum, 10);
      // 功率判断
      if(/快充|超级|600|800|1000/.test(nm)){ ci.power = '快充'; ci.supportFast = true; }
      else if(/慢充|交流|7k|11k|22k/.test(nm)){ ci.power = '慢充'; }
      // 支持的充电类型
      if(p.chargeTypes){
        ci.chargeTypes = p.chargeTypes.split(',');
      }
      // 状态判断
      if(ci.freePiles === 0){ ci.status = 'red'; ci.statusText = '暂无空闲桩'; if(ci.waitNum > 0) ci.statusText += '（等待'+ci.waitNum+'辆）'; }
      else if(ci.freePiles < 3){ ci.status = 'yellow'; ci.statusText = '空闲较少'; }
      else { ci.status = 'green'; ci.statusText = '空闲充足'; }
      ci.open24h = /24|全天|全天营业/.test(nm + ' ' + (poi.openTime||''));
      // 品牌
      if(p.brand) ci.brand = p.brand;
      poi.chargingInfo = ci;
    }
    out.push(poi);
  }
  return out;
}

/* =========================================================================
 * 地图标记
 * ======================================================================== */
function renderMapMarkers(pois){
  if(!map || !mapReady) return;
  try { if(markerClusterer){ markerClusterer.setMap(null); markerClusterer = null; } } catch(e){}
  try { map.clearMap(); } catch(e){}
  if(!pois || pois.length === 0) return;

  var filtered = pois.filter(function(p){
    if(p.isParking && !preferences.showPark) return false;
    if(p.isCharging && !preferences.showCharge) return false;
    if(p.isParking && preferences.onlyFreePark && p.parkingInfo && p.parkingInfo.status !== 'green') return false;
    if(p.isCharging && preferences.onlyFreeCharge && p.chargingInfo && p.chargingInfo.status !== 'green') return false;
    return true;
  });

  var mkrs = [];
  for(var j = 0; j < filtered.length; j++){
    var po = filtered[j];
    var color = po.isCharging ? '#fa8c16' : (po.isParking ? '#1677ff' : '#52c41a');
    var iconText = po.isCharging ? '⚡' : (po.isParking ? 'P' : '📍');
    try {
      var m = new AMap.Marker({
        position: po.lngLat, map: map, offset: new AMap.Pixel(-14, -28),
        content: '<div style="background:'+color+';color:#fff;width:30px;height:34px;border-radius:8px 8px 8px 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.3);border:2px solid #fff;"><span style="transform:rotate(45deg);">'+iconText+'</span></div>',
        title: po.name, extData: po
      });
      m.on('click', (function(poi){ return function(){ 
  if(map && poi && poi.lngLat){
    map.setCenter(poi.lngLat);
    map.setZoom(16, true, 500);
  }
  showPOIDetail(poi); 
  highlightCard(poi.name); 
}; })(po));
      mkrs.push(m);
    } catch(e){}
  }

  if(mkrs.length > 3 && window.AMap && AMap.MarkerClusterer){
    try {
      markerClusterer = new AMap.MarkerClusterer(map, mkrs, {
        gridSize: 60, maxZoom: 17, averageCenter: true
      });
    } catch(e){}
  }
  try { map.setFitView && map.setFitView(mkrs); } catch(e){}
}

function clearMarkers(){
  if(!map) return;
  try { if(markerClusterer){ markerClusterer.setMap(null); markerClusterer = null; } } catch(e){}
  try { map.clearMap(); } catch(e){}
  if(radiusCircle){ try{ radiusCircle.setMap(null); }catch(e){} radiusCircle = null; }
}

function drawRadiusCircle(center, radius){
  if(!map || !center) return;
  try {
    if(radiusCircle) radiusCircle.setMap(null);
    radiusCircle = new AMap.Circle({
      center: center, radius: radius,
      strokeColor: '#1677ff', strokeWeight: 2, strokeOpacity: 0.75,
      strokeStyle: 'dashed', fillColor: '#1677ff', fillOpacity: 0.06
    });
    radiusCircle.setMap(map);
  } catch(e){}
}

  return favorites.some(function(f){ return f.id === poi.id; });
}

  preferences.showPark = true;
  preferences.showCharge = true;
  preferences.onlyFreeCharge = false;
  preferences.onlyFastCharge = false;
  preferences.only24h = false;
  searchRadiusNearby = 2000;
  saveLS('preferences', preferences);
  // 重新搜索
  if(searchMode === 'nearby'){
    searchParkingAndCharging(searchCenterPos);
  } else {
    searchNearby(currentKeyword);
  }
  toast('已清空筛选条件');
}

// 清除单个筛选条件
function clearFilter(type){
  if(type === 'park'){
    preferences.showPark = true;
    saveLS('preferences', preferences);
    renderPOIPanel(currentPOIs, currentKeyword);
    renderMapMarkers(currentPOIs);
  } else if(type === 'charge'){
    preferences.showCharge = true;
    saveLS('preferences', preferences);
    renderPOIPanel(currentPOIs, currentKeyword);
    renderMapMarkers(currentPOIs);
  } else if(type === 'radius'){
    searchRadiusNearby = 2000;
    searchParkingAndCharging(searchCenterPos);
  } else if(type === 'freecharge'){
    preferences.onlyFreeCharge = false;
    saveLS('preferences', preferences);
    renderPOIPanel(currentPOIs, currentKeyword);
    renderMapMarkers(currentPOIs);
  } else if(type === 'fastcharge'){
    preferences.onlyFastCharge = false;
    saveLS('preferences', preferences);
    renderPOIPanel(currentPOIs, currentKeyword);
    renderMapMarkers(currentPOIs);
  } else if(type === '24h'){
    preferences.only24h = false;
    saveLS('preferences', preferences);
    renderPOIPanel(currentPOIs, currentKeyword);
    renderMapMarkers(currentPOIs);
  }
}

function toggleFavorite(idx){
  var poi = currentPOIs[idx]; if(!poi) return;
  var i = favorites.findIndex(function(f){ return f.id === poi.id; });
  if(i >= 0){ favorites.splice(i, 1); toast('已取消收藏'); }
  else { favorites.push({ id: poi.id, name: poi.name, address: poi.address, lngLat: poi.lngLat }); toast('已收藏'); }
  saveLS('favorites', favorites);
  renderPOIPanel(currentPOIs, currentKeyword);
}

function showPOIByIdx(idx){
  if(!currentPOIs || !currentPOIs[idx]) return;
  var poi = currentPOIs[idx];

  // 地图居中并高亮对应 marker
  if(map && poi && poi.lngLat){
    map.setCenter(poi.lngLat);
    map.setZoom(16, true, 500); // 平滑缩放到 16 级
    highlightMapMarker(poi);
  }

  showPOIDetail(poi);
}

// 高亮地图上对应的 marker
function highlightMapMarker(poi){
  if(!map || !poi) return;
  var markers = map.getAllOverlays('marker');
  for(var i = 0; i < markers.length; i++){
    var m = markers[i];
    var data = m.getExtData();
    if(data && data.id === poi.id){
      // 高亮效果：放大 + 动画 + 光晕
      m.setTop(true);
      // 添加脉冲动画效果
      animateMarker(m);
      break;
    }
  }
}

// marker脉冲动画
function animateMarker(marker){
  if(!marker) return;
  var originContent = marker.getContent();
  var pulseContent = originContent.replace('</div>', '<div style="position:absolute;top:50%;left:50%;width:100%;height:100%;border-radius:8px 8px 8px 0;background:inherit;opacity:0.4;animation:pulse 1s ease-out infinite;"></div></div>');
  marker.setContent(pulseContent);
  setTimeout(function(){
    marker.setContent(originContent);
  }, 2000);
}

// 取消高亮地图 marker
function unhighlightMapMarkers(){
  if(!map) return;
  var markers = map.getAllOverlays('marker');
  for(var i = 0; i < markers.length; i++){
    markers[i].setTop(false);
  }
}

function highlightCard(name){
  var list = document.querySelectorAll('.poi-card');
  for(var i = 0; i < list.length; i++){
    list[i].classList.remove('selected', 'hl');
    if(list[i].getAttribute('data-name') === name){
      list[i].classList.add('selected', 'hl');
      try{ 
        list[i].scrollIntoView({ behavior:'smooth', block:'center', inline:'nearest' }); 
      }catch(e){
        list[i].scrollIntoView();
      }
      setTimeout(function(el){ el.classList.remove('hl'); }.bind(null, list[i]), 1800);
      break;
    }
  }
}

function highlightCardByIdx(idx){
  var list = document.querySelectorAll('.poi-card');
  if(list[idx]){
    for(var i = 0; i < list.length; i++){
      list[i].classList.remove('selected', 'hl');
    }
    list[idx].classList.add('selected', 'hl');
    try{ 
      list[idx].scrollIntoView({ behavior:'smooth', block:'center', inline:'nearest' }); 
    }catch(e){
      list[idx].scrollIntoView();
    }

function setAsRouteEnd(idx){

/* =========================================================================
 * 路线规划
 * ======================================================================== */
function renderRouteInputs(){
  var st = $('routeStartText'); if(st) st.value = routeStartName || '选择起点';
  var et = $('routeEndText');   if(et) et.value = routeEndName   || '选择终点';
  var wpBox = $('routeWaypointsBox'); if(!wpBox) return;
  if(!routeWaypoints || routeWaypoints.length === 0){ wpBox.innerHTML = ''; return; }
  var html = '';
  for(var i = 0; i < routeWaypoints.length; i++){
    html += '<div class="wp-item"><span class="wp-num">途经'+(i+1)+'</span>'
      + '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(routeWaypoints[i].name)+'</span>'
      + '<button class="quick-filter-btn" onclick="window.removeWaypoint && window.removeWaypoint('+i+')">移除</button></div>';
  }
  wpBox.innerHTML = html;
}
function removeWaypoint(i){
  routeWaypoints.splice(i, 1); renderRouteInputs();
  if(routeStart && routeEnd) searchRoute();
}

function showRoutePanel(){
  var rp = $('routePanel'); if(rp) rp.classList.add('show');
}
function showMain(){
  var rp = $('routePanel'); if(rp) rp.classList.remove('show');
}
function swapStartEnd(){
  var tmp = routeStart; routeStart = routeEnd; routeEnd = tmp;
  var n = routeStartName; routeStartName = routeEndName; routeEndName = n;
  renderRouteInputs();
  if(routeStart && routeEnd) searchRoute();
}

function geocodeForRoute(which, text){
  if(!text) return;
  amapFetch('geocode/geo', { address: text, city: '' }).then(function(j){
    var loc = (j && j.geocodes && j.geocodes[0] && j.geocodes[0].location);
    var pos = parseLngLatStr(loc);
    if(pos){
      if(which === 'start'){ routeStart = pos; routeStartName = text; }
      else { routeEnd = pos; routeEndName = text; }
      renderRouteInputs();
      if(routeStart && routeEnd) searchRoute();
    } else toast('未能解析该地址');
  }).catch(function(){ toast('地址解析失败'); });
}

function searchRoute(){
  if(!routeStart || !routeEnd){ toast('请先设置起点和终点'); return; }
  showLoading('正在规划路线...');
  for(var r = 0; r < routePolylines.length; r++){ try{ routePolylines[r].setMap(null); }catch(e){} }
  routePolylines = [];
  try{ for(var mm=0; mm<routeStartMarkers.length; mm++) map.remove(routeStartMarkers[mm]); }catch(e){}
  routeStartMarkers = [];

  var params = {
    origin: routeStart[0]+','+routeStart[1],
    destination: routeEnd[0]+','+routeEnd[1],
    strategy: preferences.routeStrategy || 0,
    extensions: 'base'
  };
  if(routeWaypoints && routeWaypoints.length){
    params.waypoints = routeWaypoints.map(function(w){ return w.lngLat[0]+','+w.lngLat[1]; }).join(';');
  }

  // v5 driving 接口
  var alias = routeMode === 'walking' ? 'direction/walking' : (routeMode === 'riding' ? 'direction/riding' : 'direction/driving');

  amapFetch(alias, params).then(function(j){
    hideLoading();
    var routes = [];
    if(j && j.route && j.route.paths) routes = j.route.paths;
    else if(j && j.routes && j.routes.length) routes = j.routes;
    else if(j && j.plans && j.plans.length) routes = j.plans;

    if(routes.length === 0){ toast('未获取到可用路线'); return; }
    routeResults = routes;

    for(var i = 0; i < routes.length; i++){
      var pathStr = routes[i].polyline || routes[i].steps;
      var path = parseRoutePath(pathStr);
      var color = i === 0 ? '#1677ff' : (i === 1 ? '#fa8c16' : '#52c41a');
      try {
        var poly = new AMap.Polyline({
          path: path, strokeColor: color,
          strokeWeight: i === 0 ? 7 : 5,
          strokeOpacity: i === 0 ? 0.95 : 0.55,
          strokeStyle: i === 0 ? 'solid' : 'dashed',
          lineJoin: 'round', showDir: true
        });
        poly.setMap(map);
        routePolylines.push(poly);
      } catch(e){}
    }

    // 起终点标记
    try {
      routeStartMarkers.push(new AMap.Marker({ position: routeStart, map: map, content: '<div style="width:32px;height:32px;background:#52c41a;color:#fff;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700;">起</div>' }));
      routeStartMarkers.push(new AMap.Marker({ position: routeEnd, map: map, content: '<div style="width:32px;height:32px;background:#f5222d;color:#fff;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700;">终</div>' }));
      for(var w = 0; w < routeWaypoints.length; w++){
        routeStartMarkers.push(new AMap.Marker({ position: routeWaypoints[w].lngLat, map: map, content: '<div style="width:28px;height:28px;background:#fa8c16;color:#fff;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700;">'+(w+1)+'</div>' }));
      }
    } catch(e){}
    try{ map.setFitView(routeStartMarkers); }catch(e){}
    renderRouteList(routes);
    selectRoute(0);
  }).catch(function(err){
    hideLoading();
    toast('路线规划失败：' + (err && err.message ? err.message : String(err)));
  });
}

function parseRoutePath(input){
  if(!input) return [];
  var str = typeof input === 'string' ? input : '';
  var arr = str.split(';');
  var path = [];
  for(var i = 0; i < arr.length; i++){
    var pts = arr[i].split(',');
    if(pts.length >= 2){
      var lng = parseFloat(pts[0]), lat = parseFloat(pts[1]);
      if(!isNaN(lng) && !isNaN(lat)) path.push([lng, lat]);
    }
  }
  return path;
}

function renderRouteList(routes){
  var box = $('routeList'); if(!box) return;
  var html = '';
  for(var i = 0; i < routes.length; i++){
    var r = routes[i];
    var d = parseFloat(r.distance) || 0;
    var t = parseFloat(r.duration) || 0;
    html += '<div class="route-card'+(i===0?' active':'')+'" data-idx="'+i+'">'
      + '<div class="route-card-head">'

function navTo(poiIdx){

// 路线规划函数
function planDrivingRoute(){
  if(!routeStart || !routeEnd){ toast('起点或终点无效'); return; }

  showLoading('正在规划路线...');

  // 使用高德驾车路线规划
  if(!window.AMap){ hideLoading(); toast('地图未加载'); return; }

  // 根据选择的策略设置 policy
  var strategy = preferences.routeStrategy || 0;
  var policy;
  switch(strategy){
    case 0: policy = AMap.DrivingPolicy.LEAST_TIME; break; // 推荐
    case 1: policy = AMap.DrivingPolicy.AVOID_HOT_ROUTES; break; // 躲避拥堵
    case 2: policy = AMap.DrivingPolicy.LEAST_DISTANCE; break; // 最短距离（不走高速）
    case 3: policy = AMap.DrivingPolicy.HIGHWAY_FIRST; break; // 高速优先
    case 4: policy = AMap.DrivingPolicy.ECONOMY; break; // 费用优先（经济路线）
    default: policy = AMap.DrivingPolicy.LEAST_TIME;
  }

  var driving = new AMap.Driving({
    map: map,
    panel: null,  // 不使用内置面板
    policy: policy,
    extensions: 'all'
  });

  // 如果有途经点，添加途经点
  if(routeWaypoints && routeWaypoints.length > 0){
    var waypointList = routeWaypoints.map(function(w){ return w.lngLat; });
    driving.search(routeStart, routeEnd, waypointList, function(status, result){
      handleRouteResult(status, result, driving);
    });
  } else {
    driving.search(routeStart, routeEnd, function(status, result){
      handleRouteResult(status, result, driving);
    });
  }
}

function handleRouteResult(status, result, driving){
  hideLoading();

  if(status === 'complete' && result && result.routes && result.routes.length){
    var route = result.routes[0];
    routeResults = [{
      distance: route.distance,
      duration: route.time,
      polyline: '',
      steps: []
    }];

    // 绘制路线
    if(routeOverview){
      try { map.remove(routeOverview); } catch(e){}
    }
    var path = route.steps.reduce(function(acc, step){
      if(step.path) return acc.concat(step.path);
      return acc;
    }, []);

    routeOverview = new AMap.Polyline({
      path: path,
      strokeColor: '#1677ff',
      strokeWeight: 7,
      strokeOpacity: 0.85,
      showDir: true,
      lineJoin: 'round'
    });
    map.add(routeOverview);
    map.setFitView(routeOverview, false, [50, 50, 50, 100]);

    // 保存路线信息
    routeResults[0].steps = route.steps.map(function(s){
      return {
        instruction: s.instruction || '',
        distance: s.distance || 0,
        duration: s.time || 0
      };
    });
    routeResults[0].polyline = path;

    routeSelectedIdx = 0;

    // 显示路线信息
    var distKm = (route.distance / 1000).toFixed(1);
    var timeMin = Math.round(route.time / 60);
    var strategyText = ['推荐', '躲避拥堵', '不走高速', '高速优先', '费用优先'][preferences.routeStrategy || 0];
    toast('路线规划成功 (' + strategyText + ')：' + distKm + '公里，约' + timeMin + '分钟');

    // 续航评估与充电推荐
    checkRangeAndRecommend(route.distance);

    // 隐藏列表面板，显示地图
    hidePanel();

    // 更新路线面板显示
    updateRouteInfoDisplay();

  } else {
    toast('路线规划失败，请重试');
    console.error('Driving search failed:', status, result);
  }
}

// 续航检查与充电推荐
function checkRangeAndRecommend(routeDistance){
  if(!preferences.evModel || !preferences.batteryCapacity) return; // 没有设置车辆

  var range = preferences.batteryCapacity * preferences.currentCharge / 100 / preferences.consumption * 100; // km
  var routeKm = routeDistance / 1000;

  // 计算是否需要充电
  var needCharge = routeKm > range * 0.8; // 预留20%电量
  var lowBattery = preferences.currentCharge <= preferences.lowBatteryAlert;
  var lowRange = range <= preferences.rangeAlert;

  if(needCharge || lowBattery || lowRange){
    // 显示充电推荐
    var msg = '⚡ ';
    if(needCharge) msg += '里程' + routeKm.toFixed(0) + 'km > 续航' + range.toFixed(0) + 'km，';
    if(lowBattery) msg += '电量' + preferences.currentCharge + '%低于设定值，';
    if(lowRange) msg += '续航' + range.toFixed(0) + 'km低于设定值，';
    msg += '建议途中充电';

    // 语音提醒
    if(voiceOn) speak(msg, true);

    // 在路线面板显示推荐
    showChargingRecommendation(routeDistance);
  }
}

    if(document.visibilityState === 'visible'){
      // 页面重新可见，刷新定位
      if(map && mapReady && searchMode === 'nearby'){
        // 延迟执行，避免频繁刷新
        clearTimeout(window._visibilityTimer);
        window._visibilityTimer = setTimeout(function(){
          if(window.AMap && AMap.Geolocation){
            var geo = new AMap.Geolocation({ enableHighAccuracy: true, convert: true });
            geo.getCurrentPosition(function(status, result){
              if(status === 'complete' && result.position){
                var pos = [result.position.lng, result.position.lat];
                // 如果位置变化超过50米，刷新数据
                if(!myPos || getDistance(myPos, pos) > 50){
                  myPos = pos;
                  placeUserMarker(pos);
                  searchParkingAndCharging(pos);
                  toast('已刷新位置', 1500);
                }
              }
            });
          }
        }, 1000);
      }
    }
  });
}

// 计算两点间距离（米）
function getDistance(p1, p2){
  if(!p1 || !p2) return Infinity;
  var dx = p1[0] - p2[0];
  var dy = p1[1] - p2[1];
  return Math.sqrt(dx*dx + dy*dy) * 111000; // 粗略估算
}

var measureMode = false;
var measurePoints = [];
var measurePolyline = null;
var measureMarkers = [];

function toggleMeasureMode(){
  if(measureMode){
    exitMeasureMode();
  } else {
    enterMeasureMode();
  }
}

function enterMeasureMode(){
  measureMode = true;
  measurePoints = [];
  measurePolyline = null;
  measureMarkers = [];
  measureMode = true;
  // 切换按钮状态
  var measBtn = $('measureBtn');
  if(measBtn) measBtn.classList.add('active');
  toast('点击地图测量距离，双击结束测量');
  map.on('click', onMeasureClick);
  map.on('dblclick', onMeasureDblClick);
}

function exitMeasureMode(){
  measureMode = false;
  // 清除测量线和标记
  if(measurePolyline){ try{ map.remove(measurePolyline); }catch(e){} measurePolyline = null; }
  for(var m = 0; m < measureMarkers.length; m++){ try{ map.remove(measureMarkers[m]); }catch(e){} }
  measureMarkers = [];
  measurePoints = [];
  var measBtn = $('measureBtn');
  if(measBtn) measBtn.classList.remove('active');
  map.off('click', onMeasureClick);
  map.off('dblclick', onMeasureDblClick);
}

function onMeasureClick(e){
  if(!measureMode) return;
  var point = [e.lnglat.getLng(), e.lnglat.getLat()];
  measurePoints.push(point);

  // 添加标记
  var marker = new AMap.Marker({
    position: point,
    icon: new AMap.Icon({ size: new AMap.Size(12, 12), image: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMiIgaGVpZHRoPSIxMiI+PHJlY3Qgd2lkdGg9IjEyIiBoZWlnaHQ9IjEyIiBmaWxsPSIjMTY3N2ZmIi8+PC9zdmc+', size: new AMap.Size(12, 12) }),
    offset: new AMap.Pixel(-6, -6)
  });
  marker.setMap(map);
  measureMarkers.push(marker);

  // 更新线
  updateMeasureLine();

  // 显示当前总距离
  var totalDist = calcTotalMeasureDist();
  toast('已选' + measurePoints.length + '个点，总距离：' + formatDistance(totalDist));
}

function onMeasureDblClick(e){
  if(!measureMode) return;
  e.lnglat && onMeasureClick(e); // 添加最后一个点
  exitMeasureMode();
  var totalDist = calcTotalMeasureDist();
  toast('测量完成，总距离：' + formatDistance(totalDist));
}

function updateMeasureLine(){
  if(measurePolyline){ try{ map.remove(measurePolyline); }catch(e){} }
  if(measurePoints.length < 2) return;
  measurePolyline = new AMap.Polyline({
    path: measurePoints,
    strokeColor: '#ff6600',
    strokeWeight: 3,
    strokeOpacity: 0.8,
    strokeStyle: 'dashed'
  });
  measurePolyline.setMap(map);
}

function calcTotalMeasureDist(){
  var total = 0;
  for(var i = 0; i < measurePoints.length - 1; i++){
    total += calcDistance(measurePoints[i], measurePoints[i+1]);
  }
  return total;
}

function handleSearchInput(){
  var val = ($('searchInput') || {}).value || '';
  if(!val){
    var box = $('suggestionsBox');
    if(box) box.classList.remove('show');
    return;
  }
  suggestDebounced(val);

var suggestDebounced = debounce(function(kw){
  amapFetch('assistant/inputtips', { keywords: kw, city: '', datatype: 'poi' })
    .then(function(j){
      var list = (j && j.tips) || [];
      var filtered = list.filter(function(it){ return it && it.location; });
      renderSuggestions(filtered, kw);
    })
    .catch(function(){ renderSuggestions([], kw); });
}, 300);

function renderSuggestions(list, kw){
  var box = $('suggestionsBox'); if(!box) return;
  var html = '';

  // 搜索历史（当输入为空时显示）
  if(!kw || kw.length === 0){
    if(searchHistory && searchHistory.length > 0){
      html += '<div class="suggestion-header"><span>搜索历史</span><span class="suggestion-clear" onclick="clearSearchHistory()">清空</span></div>';
      for(var h = 0; h < Math.min(searchHistory.length, 5); h++){
        html += '<div class="suggestion-item" data-history="'+escapeHtml(searchHistory[h])+'">'
          + '<div class="suggestion-icon">🕐</div>'
          + '<div class="suggestion-content">'
          +   '<div class="suggestion-name">'+escapeHtml(searchHistory[h])+'</div>'
          +   '<div class="suggestion-addr">历史记录</div>'
          + '</div></div>';
      }
    }
    // 收藏
    if(favorites && favorites.length > 0){
      html += '<div class="suggestion-header"><span>我的收藏</span></div>';
      for(var f = 0; f < Math.min(favorites.length, 3); f++){
        var fav = favorites[f];
        html += '<div class="suggestion-item" data-lnglat="'+(fav.lngLat?fav.lngLat[0]+','+fav.lngLat[1]:'')+'" data-name="'+escapeHtml(fav.name)+'">'
          + '<div class="suggestion-icon">⭐</div>'
          + '<div class="suggestion-content">'
          +   '<div class="suggestion-name">'+escapeHtml(fav.name)+'</div>'
          +   '<div class="suggestion-addr">'+escapeHtml(fav.address||'')+'</div>'
          + '</div></div>';
      }
    }
    // 快捷入口
    html += '<div class="suggestion-header"><span>快捷搜索</span></div>';
    html += '<div class="suggestion-item" data-quick="nearby_charge">'
      + '<div class="suggestion-icon">⚡</div>'
      + '<div class="suggestion-content"><div class="suggestion-name">附近充电站</div><div class="suggestion-addr">搜索附近的充电桩</div></div>'
      + '</div>';
    html += '<div class="suggestion-item" data-quick="nearby_park">'
      + '<div class="suggestion-icon">🅿️</div>'
      + '<div class="suggestion-content"><div class="suggestion-name">附近停车场</div><div class="suggestion-addr">搜索附近的停车位</div></div>'
      + '</div>';
    html += '<div class="suggestion-item" data-quick="nearby_all">'
      + '<div class="suggestion-icon">📍</div>'
      + '<div class="suggestion-content"><div class="suggestion-name">附近全部</div><div class="suggestion-addr">搜索停车场和充电站</div></div>'
      + '</div>';
    box.innerHTML = html || '<div class="suggestion-empty">输入关键词搜索</div>';
    box.classList.add('show');
    bindSuggestionEvents(box);
    return;
  }

  // 搜索结果
  if(!list || list.length === 0){
    box.innerHTML = '<div class="suggestion-empty">无匹配结果，请尝试其他关键词</div>';
    box.classList.add('show');
    return;
  }
  html = '<div class="suggestion-header"><span>搜索建议</span></div>';
  for(var i = 0; i < Math.min(list.length, 8); i++){
    var it = list[i];
    html += '<div class="suggestion-item" data-lnglat="'+escapeHtml(it.location||'')+'" data-name="'+escapeHtml(it.name||'')+'">'
      + '<div class="suggestion-icon">📍</div>'
      + '<div class="suggestion-content">'
      +   '<div class="suggestion-name">'+escapeHtml(it.name||'')+'</div>'
      +   '<div class="suggestion-addr">'+escapeHtml((it.district||'')+' '+(it.address||''))+'</div>'
      + '</div></div>';
  }
  box.innerHTML = html;
  box.classList.add('show');
  bindSuggestionEvents(box);
}

function bindSuggestionEvents(box){
  var items = box.querySelectorAll('.suggestion-item');
  for(var j = 0; j < items.length; j++){
    (function(el){
      el.addEventListener('click', function(){
        var quick = el.getAttribute('data-quick');
        var pos = parseLngLatStr(el.getAttribute('data-lnglat'));
        var nm = el.getAttribute('data-name') || '';
        var history = el.getAttribute('data-history');
        var si = $('searchInput');
        box.classList.remove('show');

        // 快捷搜索
        if(quick){
          if(quick === 'nearby_charge'){
            preferences.showPark = false;
            preferences.showCharge = true;
            saveLS('preferences', preferences);
            searchParkingAndCharging(myPos || searchCenterPos);
            if(si) si.value = '';
          } else if(quick === 'nearby_park'){
            preferences.showPark = true;
            preferences.showCharge = false;
            saveLS('preferences', preferences);
            searchParkingAndCharging(myPos || searchCenterPos);
            if(si) si.value = '';
          } else if(quick === 'nearby_all'){
            preferences.showPark = true;
            preferences.showCharge = true;
            saveLS('preferences', preferences);
            searchParkingAndCharging(myPos || searchCenterPos);
            if(si) si.value = '';
          }
          return;
        }

        // 历史记录
        if(history){
          if(si) si.value = history;
          suggestDebounced(history);
          return;
        }

        // 正常搜索
        if(si) si.value = nm;
        if(nm) addToHistory(nm);
        if(pos){ destSearchPos = pos; searchMode = 'dest'; searchPOIByName(nm, pos); }
        else { searchMode = 'dest'; searchPOIByName(nm); }
      });
    })(items[j]);
  }
}

}

function bindEvents(){
  var si = $('searchInput');
  if(si){ si.addEventListener('input', handleSearchInput); si.addEventListener('focus', handleSearchInput); }
  var sb = $('searchBtn');
  if(sb) sb.addEventListener('click', function(){
    var kw = (si ? si.value : '').trim();
    if(!kw){ toast('请输入关键字'); return; }
    addToHistory(kw); searchMode = 'dest'; searchPOIByName(kw);
    var box = $('suggestionsBox'); if(box) box.classList.remove('show');
  });
  var sc = $('searchClear');
  if(sc) sc.addEventListener('click', function(){
    if(si){ si.value = ''; handleSearchInput(); }
    sc.classList.remove('visible');
  });
  si && si.addEventListener('input', function(){ sc && sc.classList.toggle('visible', si.value.length > 0); });

  // 快捷按钮：底部导航
  document.querySelectorAll('.nav-item').forEach(function(nav){
    nav.addEventListener('click', function(){
      var type = nav.getAttribute('data-nav');
      document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });
      nav.classList.add('active');
      if(type === 'parking'){ searchNearby('停车场'); }
      else if(type === 'charging'){ searchNearby('充电桩'); }
      else if(type === 'traffic'){ toggleTraffic(); }
      else if(type === 'locate'){
        if(myPos){ try{ map.setZoomAndCenter(15, myPos); }catch(e){} toast('已回到定位'); }
        else toast('尚未获得定位');
      }
    });
  });

  var fp = $('toggleParkBtn');     if(fp) fp.addEventListener('click', function(){ toggleParkMarkers(); fp.classList.toggle('active', preferences.showPark); });
  var fc = $('toggleChargeBtn');   if(fc) fc.addEventListener('click', function(){ toggleChargeMarkers(); fc.classList.toggle('active', preferences.showCharge); });
  var traf = $('trafficBtn');      if(traf) traf.addEventListener('click', toggleTraffic);
  var sat  = $('layerBtn');        if(sat)  sat.addEventListener('click', toggleSatellite);
  var loc  = $('locateBtn');       if(loc)  loc.addEventListener('click', function(){ if(myPos){ try{ map.setZoomAndCenter(15, myPos); }catch(e){} toast('已回到定位'); } else toast('尚未获得定位'); });
  var fav  = $('favBtn');           if(fav)  fav.addEventListener('click', showFavoritesPanel);
  var meas = $('measureBtn');       if(meas) meas.addEventListener('click', toggleMeasureMode);
  var pref = $('prefBtn');         if(pref) pref.addEventListener('click', showPreferencesPanel);

  var rs = $('routeSwapBtn');      if(rs) rs.addEventListener('click', swapStartEnd);
  var rc = $('routeClearBtn');     if(rc) rc.addEventListener('click', function(){ clearRoute(); routeStart = null; routeEnd = null; routeStartName = ''; routeEndName = ''; renderRouteInputs(); toast('已清除路线'); });
  var rsrc = $('routeSearchBtn');  if(rsrc) rsrc.addEventListener('click', function(){
    var rst = $('routeStartText'), ret = $('routeEndText');
    if(!routeStart && rst && rst.value.trim()) geocodeForRoute('start', rst.value.trim());
    if(!routeEnd   && ret && ret.value.trim()) geocodeForRoute('end',   ret.value.trim());
    if(routeStart && routeEnd) searchRoute();
    else toast('请补全起点与终点');
  });
  var rst = $('routeStartText');   if(rst) rst.addEventListener('change', function(){ geocodeForRoute('start', this.value.trim()); });
  var ret2 = $('routeEndText');    if(ret2) ret2.addEventListener('change', function(){ geocodeForRoute('end', this.value.trim()); });

  // 策略按钮
  document.querySelectorAll('[data-strategy]').forEach(function(el){
    el.addEventListener('click', function(){
      var val = parseInt(el.getAttribute('data-strategy'), 10);
      preferences.routeStrategy = val; saveLS('preferences', preferences);
      document.querySelectorAll('[data-strategy]').forEach(function(e){ e.classList.toggle('active', parseInt(e.getAttribute('data-strategy'),10)===val); });
      if(routeStart && routeEnd) searchRoute();
    });
  });

  // 路线模式
  document.querySelectorAll('[data-mode]').forEach(function(el){
    el.addEventListener('click', function(){
      routeMode = el.getAttribute('data-mode');
      document.querySelectorAll('[data-mode]').forEach(function(e){ e.classList.toggle('active', e.getAttribute('data-mode')===routeMode); });
      if(routeStart && routeEnd) searchRoute();
    });
  });

  // 长按菜单
  document.querySelectorAll('[data-action]').forEach(function(el){
    el.addEventListener('click', function(){ handleLongpressItem(el.getAttribute('data-action')); });
  });

  var dc = $('detailClose');       if(dc) dc.addEventListener('click', function(){ $('detailOverlay').classList.remove('show'); });
  var neb = $('naviExitBtn');       if(neb) neb.addEventListener('click', exitNavi);
  var nfb = $('naviFullBtn');       if(nfb) nfb.addEventListener('click', function(){ toast('全屏导航中'); });
  var nvb = $('naviVoiceBtn');      if(nvb) nvb.addEventListener('click', function(){ voiceOn = !voiceOn; toast(voiceOn?'语音播报已开启':'语音播报已关闭'); });

  // 点击其他地方关闭联想
  document.addEventListener('click', function(e){
    var box = $('suggestionsBox');
    if(!box || !box.contains(e.target) && e.target !== si) box.classList.remove('show');
  });

  // 软键盘适配
  var inputs = document.querySelectorAll('input, textarea');
  inputs.forEach(function(inp){
    inp.addEventListener('focus', function(){ document.body.classList.add('keyboard-open'); });
    inp.addEventListener('blur',  function(){ document.body.classList.remove('keyboard-open'); });
  });

  // 定位权限检测
  if(navigator.permissions && navigator.permissions.query){
    try{
      navigator.permissions.query({ name: 'geolocation' }).then(function(p){
        if(p.state === 'denied'){
          var guide = $('permissionGuide'); if(guide) guide.classList.add('show');
        }
      });
    }catch(e){}
  }
  var pgb = $('permissionGuideBtn');    if(pgb) pgb.addEventListener('click', function(){ toast('请在浏览器设置中开启定位权限'); $('permissionGuide').classList.remove('show'); });
  var pgcl = $('permissionGuideClose'); if(pgcl) pgcl.addEventListener('click', function(){ $('permissionGuide').classList.remove('show'); });
}

function init(){
  preferences = loadLS('preferences', preferences);
  favorites = loadLS('favorites', []);
  searchHistory = loadLS('search_history', []);
  offlineCache = loadLS('offline_cache', null);
  voiceOn = preferences.voiceOn;
  if(preferences.dark) document.body.classList.add('dark');
  if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) document.body.classList.add('mobile');

  // 加载高德地图 SDK
  loadAmapSDK();

  // 设置页面可见性变化处理器（定位刷新）
  setupVisibilityHandler();

  bindEvents();

  // 初始化面板拖拽功能
  initPanelDrag();
}

// 页面卸载清理
window.addEventListener('beforeunload', function(){
  stopAutoRefresh();
  if(naviInterval) clearInterval(naviInterval);
  try{ if(naviMap) naviMap.destroy(); }catch(e){}
  
  // 清理地图相关
  try{ if(markerClusterer){ markerClusterer.setMap(null); markerClusterer = null; } }catch(e){}
  try{ if(map){ map.destroy(); map = null; } }catch(e){}
  if(trafficLayer){ trafficLayer = null; }
  if(satelliteLayer){ satelliteLayer = null; }
  if(radiusCircle){ radiusCircle = null; }
  
  // 清理定时器
  if(autoRefreshTimer) clearInterval(autoRefreshTimer);
  if(trafficRefreshTimer) clearInterval(trafficRefreshTimer);
  if(dragTimer) clearTimeout(dragTimer);
  
  // 清理事件监听器
  var pc = $('panelContent');
  if(pc && pc.removeEventListener) pc.removeEventListener('scroll', scrollLoadBound);
  
  // 清理定位监听
  if(watchId !== null){
    try{ navigator.geolocation.clearWatch(watchId); }catch(e){}
    watchId = null;
  }
});

// 暴露到 window
window.navTo = navTo;
window.planDrivingRoute = planDrivingRoute;
window.showRoutePanel = showRoutePanel;
window.hideRoutePanel = hideRoutePanel;
window.hidePanel = hidePanel;

window.addToRouteFromDetail = addToRouteFromDetail;

window.toggleDarkMode = toggleDarkMode;
window.toggleVoicePref = toggleVoicePref;
window.cycleRoute = cycleRoute;
window.toggleParkMarkers = toggleParkMarkers;
window.toggleChargeMarkers = toggleChargeMarkers;
window.removeFav = removeFav;
window.navigateToFav = navigateToFav;
window.showPOIByIdx = showPOIByIdx;
window.searchPOIByName = searchPOIByName;
window.searchNearby = searchNearby;
window.startNavi = startNavi;
window.exitNavi = exitNavi;
window.showMain = showMain;
window.showFavoritesPanel = showFavoritesPanel;
window.showPreferencesPanel = showPreferencesPanel;
window.clearCache = clearCache;
window.navigateToFav = navigateToFav;

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
