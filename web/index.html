  routeEnd = f.lngLat; routeEndName = f.name; routeWaypoints = [];
  $('sidePanel').classList.remove('show');
  var sp = $('sideOverlay'); if(sp) sp.classList.remove('show');
  renderRouteInputs(); searchRoute(); showRoutePanel();
}

function showPreferencesPanel(){
  $('sidePanel').classList.add('show');
  $('sidePanelTitle').textContent = '偏好设置';
  var stratMap = ['推荐路线','躲避拥堵','不走高速','高速优先','费用优先'];
  var html = '';
  html += '<div class="pref-row"><span class="pref-row-title">深色模式</span><button class="quick-filter-btn'+(preferences.dark?' active':'')+'" onclick="window.toggleDarkMode && window.toggleDarkMode()">'+(preferences.dark?'已开启':'未开启')+'</button></div>';
  html += '<div class="pref-row"><span class="pref-row-title">语音播报</span><button class="quick-filter-btn'+(preferences.voiceOn?' active':'')+'" onclick="window.toggleVoicePref && window.toggleVoicePref()">'+(preferences.voiceOn?'已开启':'未开启')+'</button></div>';
  html += '<div class="pref-row"><span class="pref-row-title">路线策略</span><button class="pref-badge" onclick="window.cycleRoute && window.cycleRoute()">'+stratMap[preferences.routeStrategy||0]+'</button></div>';
  html += '<div class="pref-row"><span class="pref-row-title">显示停车场</span><button class="quick-filter-btn'+(preferences.showPark?' active':'')+'" onclick="window.toggleParkMarkers && window.toggleParkMarkers()">'+(preferences.showPark?'显示':'隐藏')+'</button></div>';
  html += '<div class="pref-row"><span class="pref-row-title">显示充电桩</span><button class="quick-filter-btn'+(preferences.showCharge?' active':'')+'" onclick="window.toggleChargeMarkers && window.toggleChargeMarkers()">'+(preferences.showCharge?'显示':'隐藏')+'</button></div>';
  html += '<div class="pref-row"><span class="pref-row-title">清除缓存</span><button class="quick-filter-btn" onclick="window.clearCache && window.clearCache()">清除</button></div>';
  $('sidePanelContent').innerHTML = html;
  var sp = $('sideOverlay'); if(sp) sp.classList.add('show');
  var spc = $('sidePanelClose');
  if(spc) spc.onclick = function(){
    $('sidePanel').classList.remove('show');
    if(sp) sp.classList.remove('show');
  };
}
function cycleRoute(){
  preferences.routeStrategy = (preferences.routeStrategy + 1) % 5;
  saveLS('preferences', preferences);
  showPreferencesPanel();
  if(routeStart && routeEnd) searchRoute();
}
function clearCache(){
  localStorage.clear();
  toast('缓存已清除，请刷新页面');
}
function toggleParkMarkers(){
  preferences.showPark = !preferences.showPark; saveLS('preferences', preferences);
  if(currentPOIs.length) renderMapMarkers(currentPOIs);
}
function toggleChargeMarkers(){
  preferences.showCharge = !preferences.showCharge; saveLS('preferences', preferences);
  if(currentPOIs.length) renderMapMarkers(currentPOIs);
}
function toggleVoicePref(){
  preferences.voiceOn = !preferences.voiceOn; saveLS('preferences', preferences);
  voiceOn = preferences.voiceOn;
}

/* =========================================================================
 * 事件绑定
 * ======================================================================== */
function bindEvents(){
  var si = $('searchInput');
  if(si){ si.addEventListener('input', handleSearchInput); si.addEventListener('focus', handleSearchInput); }
  var sb = $('searchBtn');
  if(sb) sb.addEventListener('click', function(){
    var kw = (si ? si.value : '').trim();
    if(!kw){ toast('请输入关键字'); return; }
    addToHistory(kw); searchMode = 'dest'; searchPOIByName(kw);
    var box = $('suggestionsBox'); if(box) box.classList.remove('show');
  });
  var sc = $('searchClear');
  if(sc) sc.addEventListener('click', function(){
    if(si){ si.value = ''; handleSearchInput(); }
    sc.classList.remove('visible');
  });
  si && si.addEventListener('input', function(){ sc && sc.classList.toggle('visible', si.value.length > 0); });

  // 快捷按钮：底部导航
  document.querySelectorAll('.nav-item').forEach(function(nav){
    nav.addEventListener('click', function(){
      var type = nav.getAttribute('data-nav');
      document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });
      nav.classList.add('active');
      if(type === 'parking'){ searchNearby('停车场'); }
      else if(type === 'charging'){ searchNearby('充电桩'); }
      else if(type === 'traffic'){ toggleTraffic(); }
      else if(type === 'locate'){
        if(myPos){ try{ map.setZoomAndCenter(15, myPos); }catch(e){} toast('已回到定位'); }
        else toast('尚未获得定位');
      }
    });
  });

  var fp = $('toggleParkBtn');     if(fp) fp.addEventListener('click', function(){ toggleParkMarkers(); fp.classList.toggle('active', preferences.showPark); });
  var fc = $('toggleChargeBtn');   if(fc) fc.addEventListener('click', function(){ toggleChargeMarkers(); fc.classList.toggle('active', preferences.showCharge); });
  var traf = $('trafficBtn');      if(traf) traf.addEventListener('click', toggleTraffic);
  var sat  = $('layerBtn');        if(sat)  sat.addEventListener('click', toggleSatellite);
  var loc  = $('locateBtn');       if(loc)  loc.addEventListener('click', function(){ if(myPos){ try{ map.setZoomAndCenter(15, myPos); }catch(e){} toast('已回到定位'); } else toast('尚未获得定位'); });
  var fav  = $('favBtn');           if(fav)  fav.addEventListener('click', showFavoritesPanel);
  var pref = $('prefBtn');         if(pref) pref.addEventListener('click', showPreferencesPanel);

  var rs = $('routeSwapBtn');      if(rs) rs.addEventListener('click', swapStartEnd);
  var rc = $('routeClearBtn');     if(rc) rc.addEventListener('click', function(){ clearRoute(); routeStart = null; routeEnd = null; routeStartName = ''; routeEndName = ''; renderRouteInputs(); toast('已清除路线'); });
  var rsrc = $('routeSearchBtn');  if(rsrc) rsrc.addEventListener('click', function(){
    var rst = $('routeStartText'), ret = $('routeEndText');
    if(!routeStart && rst && rst.value.trim()) geocodeForRoute('start', rst.value.trim());
    if(!routeEnd   && ret && ret.value.trim()) geocodeForRoute('end',   ret.value.trim());
    if(routeStart && routeEnd) searchRoute();
    else toast('请补全起点与终点');
  });
  var rst = $('routeStartText');   if(rst) rst.addEventListener('change', function(){ geocodeForRoute('start', this.value.trim()); });
  var ret2 = $('routeEndText');    if(ret2) ret2.addEventListener('change', function(){ geocodeForRoute('end', this.value.trim()); });

  // 策略按钮
  document.querySelectorAll('[data-strategy]').forEach(function(el){
    el.addEventListener('click', function(){
      var val = parseInt(el.getAttribute('data-strategy'), 10);
      preferences.routeStrategy = val; saveLS('preferences', preferences);
      document.querySelectorAll('[data-strategy]').forEach(function(e){ e.classList.toggle('active', parseInt(e.getAttribute('data-strategy'),10)===val); });
      if(routeStart && routeEnd) searchRoute();
    });
  });

  // 路线模式
  document.querySelectorAll('[data-mode]').forEach(function(el){
    el.addEventListener('click', function(){
      routeMode = el.getAttribute('data-mode');
      document.querySelectorAll('[data-mode]').forEach(function(e){ e.classList.toggle('active', e.getAttribute('data-mode')===routeMode); });
      if(routeStart && routeEnd) searchRoute();
    });
  });

  // 长按菜单
  document.querySelectorAll('[data-action]').forEach(function(el){
    el.addEventListener('click', function(){ handleLongpressItem(el.getAttribute('data-action')); });
  });

  var dc = $('detailClose');       if(dc) dc.addEventListener('click', function(){ $('detailOverlay').classList.remove('show'); });
  var neb = $('naviExitBtn');       if(neb) neb.addEventListener('click', exitNavi);
  var nfb = $('naviFullBtn');       if(nfb) nfb.addEventListener('click', function(){ toast('全屏导航中'); });
  var nvb = $('naviVoiceBtn');      if(nvb) nvb.addEventListener('click', function(){ voiceOn = !voiceOn; toast(voiceOn?'语音播报已开启':'语音播报已关闭'); });

  // 点击其他地方关闭联想
  document.addEventListener('click', function(e){
    var box = $('suggestionsBox');
    if(!box || !box.contains(e.target) && e.target !== si) box.classList.remove('show');
  });

  // 软键盘适配
  var inputs = document.querySelectorAll('input, textarea');
  inputs.forEach(function(inp){
    inp.addEventListener('focus', function(){ document.body.classList.add('keyboard-open'); });
    inp.addEventListener('blur',  function(){ document.body.classList.remove('keyboard-open'); });
  });

  // 定位权限检测
  if(navigator.permissions && navigator.permissions.query){
    try{
      navigator.permissions.query({ name: 'geolocation' }).then(function(p){
        if(p.state === 'denied'){
          var guide = $('permissionGuide'); if(guide) guide.classList.add('show');
        }
      });
    }catch(e){}
  }
  var pgb = $('permissionGuideBtn');    if(pgb) pgb.addEventListener('click', function(){ toast('请在浏览器设置中开启定位权限'); $('permissionGuide').classList.remove('show'); });
  var pgcl = $('permissionGuideClose'); if(pgcl) pgcl.addEventListener('click', function(){ $('permissionGuide').classList.remove('show'); });
}

/* =========================================================================
 * 启动
 * ======================================================================== */
function init(){
  preferences = loadLS('preferences', preferences);
  favorites = loadLS('favorites', []);
  searchHistory = loadLS('search_history', []);
  offlineCache = loadLS('offline_cache', null);
  voiceOn = preferences.voiceOn;
  if(preferences.dark) document.body.classList.add('dark');
  if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) document.body.classList.add('mobile');

  // 加载高德地图 SDK
  loadAmapSDK();

  bindEvents();
}

// 页面卸载清理
window.addEventListener('beforeunload', function(){
  stopAutoRefresh();
  if(naviInterval) clearInterval(naviInterval);
  try{ if(naviMap) naviMap.destroy(); }catch(e){}
});

// 暴露到 window
window.navTo = navTo;
window.setAsRouteEnd = setAsRouteEnd;
window.navFromDetail = navFromDetail;
window.addToRouteFromDetail = addToRouteFromDetail;
window.sharePOI = sharePOI;
window.removeWaypoint = removeWaypoint;
window.toggleDarkMode = toggleDarkMode;
window.toggleVoicePref = toggleVoicePref;
window.cycleRoute = cycleRoute;
window.toggleParkMarkers = toggleParkMarkers;
window.toggleChargeMarkers = toggleChargeMarkers;
window.removeFav = removeFav;
window.navigateToFav = navigateToFav;
window.showPOIByIdx = showPOIByIdx;
window.searchPOIByName = searchPOIByName;
window.searchNearby = searchNearby;
window.startNavi = startNavi;
window.exitNavi = exitNavi;
window.showMain = showMain;
window.showFavoritesPanel = showFavoritesPanel;
window.showPreferencesPanel = showPreferencesPanel;
window.clearCache = clearCache;
window.navigateToFav = navigateToFav;

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
