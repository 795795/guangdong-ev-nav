}

// ================================================================
// 轻量导航 + P0实时递减
// ================================================================
function startNavi(routeIdx){
  if(!routeResults || !routeResults[routeIdx || 0]){ toast('请先规划路线'); return; }
  var route = routeResults[routeIdx || 0];
  $('naviOverlay').classList.add('show');
  $('naviVoiceBtn').textContent = voiceOn ? '🔊' : '🔇';

  setTimeout(function(){
    try {
      if(!naviMap){
        naviMap = new AMap.Map('naviMap', {
          zoom: 16, center: routeStartPos || myPos, showLabel: false, resizeEnable: true,
          mapStyle: isDarkMode ? 'amap://styles/dark' : 'amap://styles/normal'
        });
      } else {
        naviMap.setCenter(routeStartPos || myPos);
        naviMap.setZoom(16);
        naviMap.setMapStyle(isDarkMode ? 'amap://styles/dark' : 'amap://styles/normal');
      }

      var path = [];
      if(route.steps && route.steps.length > 0){
        for(var i = 0; i < route.steps.length; i++){
          if(route.steps[i].path) path = path.concat(route.steps[i].path);
        }
      }
      if(path.length < 2) path = [routeStartPos, routeEndPos].filter(function(p){ return p; });

      if(naviPolyline){ try{ naviMap.remove(naviPolyline); } catch(e){} naviPolyline = null; }
      if(naviStartMarker){ try{ naviMap.remove(naviStartMarker); } catch(e){} naviStartMarker = null; }
      if(naviEndMarker){ try{ naviMap.remove(naviEndMarker); } catch(e){} naviEndMarker = null; }

      try { naviPolyline = new AMap.Polyline({ map: naviMap, path: path, strokeColor: '#1677ff', strokeWeight: 10, strokeOpacity: 0.9, lineJoin: 'round', showDir: true }); } catch(e){}
      if(routeStartPos){ try { naviStartMarker = new AMap.Marker({ map: naviMap, position: routeStartPos, offset: new AMap.Pixel(-20,-20), content: '<div style="background:#52c41a;color:#fff;padding:5px 10px;border-radius:12px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.25);white-space:nowrap;">起点</div>' }); } catch(e){} }
      if(routeEndPos){ try { naviEndMarker = new AMap.Marker({ map: naviMap, position: routeEndPos, offset: new AMap.Pixel(-20,-20), content: '<div style="background:#ff4d4f;color:#fff;padding:5px 10px;border-radius:12px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.25);white-space:nowrap;">终点</div>' }); } catch(e){} }
      try { naviMap.setFitView(); } catch(e){}
    } catch(e){ console.error(e); toast('导航启动失败'); }

    // P0: 初始化导航数据
    naviTotalDist = route.distance || 0;
    naviTotalTime = route.time || Math.floor(naviTotalDist / 15);
    naviRemainingDist = naviTotalDist;
    naviRemainingTime = naviTotalTime;
    naviStepIdx = 0;

    updateNaviDisplay();

    // P0: 启动实时递减定时器
    if(naviInterval) clearInterval(naviInterval);
    naviInterval = setInterval(function(){
      if(naviRemainingDist > 0 && naviRemainingTime > 0){
        var distDec = Math.max(50, naviTotalDist / (naviTotalTime / 3));
        var timeDec = 3;
        naviRemainingDist = Math.max(0, naviRemainingDist - distDec);
        naviRemainingTime = Math.max(0, naviRemainingTime - timeDec);
        updateNaviDisplay();
        if(voiceOn && naviRemainingDist % 500 < distDec && naviRemainingDist > 0 && naviRemainingDist < naviTotalDist * 0.3){
          speak('距离终点还有 ' + formatDistance(naviRemainingDist));
        }
        if(naviRemainingDist <= 0 || naviRemainingTime <= 0){
          clearInterval(naviInterval);
          naviInterval = null;
          $('naviInstruction').textContent = '已到达目的地 🎉';
          $('naviArrow').textContent = '🏁';
          $('naviDistanceNext').textContent = '导航结束';
          if(voiceOn) speak('已到达目的地，祝您愉快');
          toast('已到达目的地 🎉');
        }
      }
    }, 3000);

    // P1: 后台驻留导航继续更新
    document.addEventListener('visibilitychange', function(){
      if(!document.hidden && $('naviOverlay').classList.contains('show')) updateNaviDisplay();
    });
  }, 300);
}

function updateNaviDisplay(){
  $('naviRemain').textContent = formatDistance(naviRemainingDist);
  $('naviTime').textContent = formatTime(naviRemainingTime);
  var eta = new Date();
  eta.setMinutes(eta.getMinutes() + Math.ceil(naviRemainingTime / 60));
  $('naviETA').textContent = eta.getHours().toString().padStart(2, '0') + ':' + eta.getMinutes().toString().padStart(2, '0');
  if(routeResults && routeResults[routeSelectedIdx] && routeResults[routeSelectedIdx].steps){
    var steps = routeResults[routeSelectedIdx].steps;
    var currentStep = steps[Math.min(naviStepIdx, steps.length - 1)];
    if(currentStep && currentStep.instruction){
      $('naviInstruction').textContent = currentStep.instruction.replace(/<[^>]+>/g, '');
    }
    if(currentStep && currentStep.distance){
      $('naviDistanceNext').textContent = '前方 ' + formatDistance(currentStep.distance);
    }
  }
}

function speak(text){
  try {
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = 1.1;
    speechSynthesis.speak(utter);
  } catch(e){}
}

function exitNavi(){
  if(naviInterval){ clearInterval(naviInterval); naviInterval = null; }
  $('naviOverlay').classList.remove('show');
  toast('已退出导航');
}

document.addEventListener('DOMContentLoaded', function(){
  $('naviVoiceBtn').addEventListener('click', function(){
    voiceOn = !voiceOn;
    preferences.voiceEnabled = voiceOn;
    saveLS('preferences', preferences);
    this.textContent = voiceOn ? '🔊' : '🔇';
    toast(voiceOn ? '🔊 语音开启' : '🔇 语音关闭');
  });
  $('naviFullBtn').addEventListener('click', function(){
    if(naviMap) naviMap.setFitView();
  });
});

// ================================================================
// 事件绑定 & 初始化
// ================================================================
function bindEvents(){
  $('searchInput').addEventListener('input', handleSearchInput);
  $('searchInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ var v = this.value.trim(); if(v){ addToHistory(v); searchPOIByName(v, null); $('suggestionsBox').classList.remove('show'); } }
  });
  $('searchBtn').addEventListener('click', function(){
    var v = $('searchInput').value.trim();
    if(v){ addToHistory(v); searchPOIByName(v, null); $('suggestionsBox').classList.remove('show'); }
  });
  $('searchClear').addEventListener('click', function(){
    $('searchInput').value = '';
    $('searchInput').focus();
    $('searchClear').classList.remove('visible');
    $('suggestionsBox').classList.remove('show');
  });

  var modes = document.querySelectorAll('.mode-option');
  for(var m = 0; m < modes.length; m++){
    modes[m].addEventListener('click', function(){
      for(var j = 0; j < modes.length; j++) modes[j].classList.remove('active');
      this.classList.add('active');
      var mode = this.getAttribute('data-mode');
      if(mode === 'nearby'){ searchMode = 'nearby'; searchNearby(currentKeyword); }
      else if(mode === 'dest'){ searchMode = 'dest'; toast('输入目的地关键词后搜索'); $('mainPanel').classList.remove('show'); $('routePanel').classList.remove('show'); }
      else if(mode === 'route'){ searchMode = 'route'; $('routePanel').classList.add('show'); $('mainPanel').classList.remove('show'); if(!routeStartPos && myPos){ routeStartPos = myPos; routeStartName = '我的位置'; } updateRoutePanelInfo(); }
    });
  }

  $('trafficBtn').addEventListener('click', toggleTraffic);
  $('layerBtn').addEventListener('click', toggleSatellite);
  $('locateBtn').addEventListener('click', function(){
    if(!map) return;
    if(geolocation){
      geolocation.getCurrentPosition(function(status, result){
        if(status === 'complete' && result.position){ myPos = [result.position.lng, result.position.lat]; map.setCenter(myPos); map.setZoom(16); toast('📍 已定位到当前位置'); }
        else toast('定位失败');
      });
    } else if(myPos){ map.setCenter(myPos); map.setZoom(16); }
  });
  // P1: POI 分类显隐
  var tpBtn = $('toggleParkBtn');
  if(tpBtn) tpBtn.addEventListener('click', toggleParkingMarkers);
  var tcBtn = $('toggleChargeBtn');
  if(tcBtn) tcBtn.addEventListener('click', toggleChargingMarkers);

  $('favBtn').addEventListener('click', showFavoritesPanel);
  $('prefBtn').addEventListener('click', showPreferencesPanel);

  // P1: 互换起终点按钮
  $('routeSwapBtn').addEventListener('click', function(){
    var tmpPos = routeStartPos; var tmpName = routeStartName;
    routeStartPos = routeEndPos; routeStartName = routeEndName;
    routeEndPos = tmpPos; routeEndName = tmpName;
    updateRoutePanelInfo();
    if(routeStartPos && routeEndPos) searchRoute();
    else toast('已互换起终点');
  });

  $('routeClearBtn').addEventListener('click', function(){
    routeStartPos = null; routeEndPos = null; routeStartName = ''; routeEndName = '';
    clearRoute(); updateRoutePanelInfo(); toast('已清空');
  });
  $('routeSearchBtn').addEventListener('click', searchRoute);

  var routeSels = document.querySelectorAll('.route-strategy');
  for(var r = 0; r < routeSels.length; r++){
    routeSels[r].addEventListener('click', function(){
      for(var k = 0; k < routeSels.length; k++) routeSels[k].classList.remove('active');
      this.classList.add('active');
      currentRouteStrategy = this.getAttribute('data-strategy');
      if(routeStartPos && routeEndPos) searchRoute();
    });
  }

  $('routeStartText') && $('routeStartText').addEventListener('click', function(){
    selectingFor = 'start';
    $('searchInput').value = '';
    $('searchInput').placeholder = '输入起点名称或点击地图选择';
    toast('请输入起点或长按地图选点');
    $('searchInput').focus();
  });
  $('routeEndText') && $('routeEndText').addEventListener('click', function(){
    selectingFor = 'end';
    $('searchInput').value = '';
    $('searchInput').placeholder = '输入终点名称或点击地图选择';
    toast('请输入终点或长按地图选点');
    $('searchInput').focus();
  });

  var navItems = document.querySelectorAll('.nav-item');
  for(var n = 0; n < navItems.length; n++){
    navItems[n].addEventListener('click', function(){
      for(var j = 0; j < navItems.length; j++) navItems[j].classList.remove('active');
      this.classList.add('active');
      var nav = this.getAttribute('data-nav');
      if(nav === 'home'){ showMain(); }
      else if(nav === 'parking'){ searchNearby('停车场'); }
      else if(nav === 'charging'){ searchNearby('充电桩'); }
      else if(nav === 'traffic'){ toggleTraffic(); }
      else if(nav === 'locate'){ if(myPos && map){ map.setCenter(myPos); map.setZoom(16); toast('已定位'); }}
    });
  }

  $('detailClose').addEventListener('click', function(){ $('detailOverlay').classList.remove('show'); });
  $('detailOverlay').addEventListener('click', function(e){ if(e.target === $('detailOverlay')) $('detailOverlay').classList.remove('show'); });
  $('sideOverlay').addEventListener('click', function(){ $('sideOverlay').classList.remove('show'); $('sidePanel').classList.remove('show'); });
  $('sidePanelClose').addEventListener('click', function(){ $('sideOverlay').classList.remove('show'); $('sidePanel').classList.remove('show'); });
  $('naviExitBtn').addEventListener('click', exitNavi);

  // 关闭联想列表
  document.addEventListener('click', function(e){
    var sug = $('suggestionsBox'), sbar = document.querySelector('.search-bar');
    if(sug && sug.classList.contains('show') && !sug.contains(e.target) && !(sbar && sbar.contains(e.target))) sug.classList.remove('show');
  });

  window.addEventListener('resize', function(){
    try{ if(map) map.resize(); if(naviMap) naviMap.resize(); } catch(e){}
  });
}

function showMain(){ $('mainPanel').classList.add('show'); $('routePanel').classList.remove('show'); }

// ================================================================
// 初始化入口
// ================================================================
function init(){
  searchHistory = loadLS('search_history', []) || [];
  favorites = loadLS('favorites', []) || [];
  preferences = loadLS('preferences', preferences) || preferences;
  offlineCache = loadLS('offline_cache', { pois: null, kw: null, center: null, radius: null, ts: 0 }) || offlineCache;
  voiceOn = preferences.voiceEnabled;
  if(preferences.darkModeAuto){
    if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
      isDarkMode = true;
      document.body.classList.add('dark');
    }
  } else if(preferences.darkMode){
    isDarkMode = true;
    document.body.classList.add('dark');
  }
  // P2: 移动端软键盘监听
  if(typeof initKeyboardListener === 'function') initKeyboardListener();
  initMap();
  initAutoComplete();
  bindEvents();
  console.log('[系统] 广东新能源导航 v3.0 启动 | 全量功能已就绪');
}

if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
</script>
