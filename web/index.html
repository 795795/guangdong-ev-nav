.offline-banner { position: absolute; top: calc(var(--safe-top) + 100px); left: 50%; transform: translateX(-50%); background: rgba(255, 77, 79, 0.95); color: #fff; padding: 8px 16px; border-radius: var(--radius-pill); font-size: 13px; z-index: 300; display: none; box-shadow: var(--shadow-md); }
.offline-banner.show { display: block; }
@media (min-width: 768px) { .drag-panel, .route-panel { left: 50%; right: auto; transform: translateX(-50%); width: 560px; max-width: 90vw; border-radius: var(--radius-xl); bottom: 80px; } .bottom-nav { max-width: 600px; left: 50%; right: auto; transform: translateX(-50%); } .search-container { max-width: 720px; left: 50%; right: auto; transform: translateX(-50%); } .mode-switch-container { max-width: 720px; left: 50%; right: auto; transform: translateX(-50%); } }
@media (min-width: 1024px) { .drag-panel, .route-panel { width: 640px; bottom: 90px; } .bottom-nav { max-width: 700px; } }
@media (orientation: landscape) and (max-height: 500px) { #map { width: 100%; height: 100vh !important; } .drag-panel, .route-panel { max-height: 65vh; bottom: 60px; } }
</style>
</head>
<body>
<div id="map"></div>
<div class="search-container">
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" placeholder="搜索地点、停车场、充电桩、道路、小区..." autocomplete="off">
    <button class="search-clear" id="searchClear">✕</button>
    <button class="search-btn" id="searchBtn">搜索</button>
  </div>
</div>
<div class="suggestions" id="suggestionsBox"></div>
<div class="mode-switch-container">
  <div class="mode-switch">
    <div class="mode-option active" data-mode="nearby">📍我的附近</div>
    <div class="mode-option" data-mode="dest">🏁目的地周边</div>
    <div class="mode-option" data-mode="route">🛣️路线规划</div>
  </div>
</div>
<div class="top-right-btns">
  <button class="circle-btn" id="trafficBtn" title="实时路况">🚦</button>
  <button class="circle-btn" id="layerBtn" title="卫星地图">🛰️</button>
  <button class="circle-btn" id="locateBtn" title="定位">📍</button>
  <button class="circle-btn" id="favBtn" title="收藏">⭐</button>
  <button class="circle-btn" id="prefBtn" title="设置">⚙️</button>
</div>
<div class="offline-banner" id="offlineBanner">⚠️网络异常</div>
<div class="drag-panel" id="mainPanel">
  <div class="drag-handle" id="dragHandle"><div class="drag-bar"></div></div>
  <div class="panel-content" id="panelContent"></div>
</div>
<div class="route-panel" id="routePanel">
  <div class="drag-handle"><div class="drag-bar"></div></div>
  <div class="route-header">
    <div class="route-header-title">路线规划</div>
    <div class="route-from-to" id="routeFromTo">
      <div class="st"><span class="dot g"></span><span id="routeStartText">选择起点（点击此处或地图）</span></div>
      <div class="st"><span class="dot r"></span><span id="routeEndText">选择终点（点击此处或地图）</span></div>
    </div>
    <div class="route-actions">
      <button class="route-action-btn" id="routeClearBtn">清空</button>
      <button class="route-action-btn" id="routeSwapBtn">交换</button>
      <button class="route-action-btn primary" id="routeSearchBtn">规划路线</button>
    </div>
  </div>
  <div class="route-strategies" id="routeStrategies">
    <div class="route-strategy active" data-strategy="fastest">⚡推荐</div>
    <div class="route-strategy" data-strategy="shortest">📏最短</div>
    <div class="route-strategy" data-strategy="nohighway">🚫不走高速</div>
    <div class="route-strategy" data-strategy="walk">🚶步行</div>
    <div class="route-strategy" data-strategy="bike">🚴骑行</div>
  </div>
  <div class="route-list" id="routeList">
    <div class="empty-state"><div class="empty-icon">🗺️</div><div class="empty-text">选择起终点后点击"规划路线"</div><div class="empty-hint">也可直接搜索地点</div></div>
  </div>
</div>
<div class="bottom-nav">
  <div class="nav-items">
    <div class="nav-item active" data-nav="home"><div class="icon">🏠</div><div class="label">首页</div></div>
    <div class="nav-item" data-nav="parking"><div class="icon">🅿️</div><div class="label">停车场</div></div>
    <div class="nav-item" data-nav="charging"><div class="icon">⚡</div><div class="label">充电</div></div>
    <div class="nav-item" data-nav="traffic"><div class="icon">🚦</div><div class="label">路况</div></div>
    <div class="nav-item" data-nav="locate"><div class="icon">📍</div><div class="label">定位</div></div>
  </div>
</div>
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel" id="detailPanel">
    <button class="detail-close" id="detailClose">✕</button>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>
<div class="side-panel-overlay" id="sideOverlay"></div>
<div class="side-panel" id="sidePanel">
  <div class="side-panel-header"><div class="side-panel-title" id="sidePanelTitle">我的收藏</div><button class="side-panel-close" id="sidePanelClose">✕</button></div>
  <div class="side-panel-content" id="sidePanelContent"></div>
</div>
<div class="navi-overlay" id="naviOverlay">
  <div class="navi-map">
    <div id="naviMap"></div>
    <div class="navi-top-panel">
      <div class="navi-direction"><div class="navi-arrow" id="naviArrow">⬆</div><div><div class="navi-instruction" id="naviInstruction">沿当前道路直行</div><div class="navi-distance-next" id="naviDistanceNext">准备出发</div></div></div>
      <div class="navi-summary">
        <div class="navi-summary-item"><div class="navi-summary-value" id="naviRemain">--</div><div class="navi-summary-label">剩余距离</div></div>
        <div class="navi-summary-item"><div class="navi-summary-value primary" id="naviTime">--</div><div class="navi-summary-label">预计时间</div></div>
        <div class="navi-summary-item"><div class="navi-summary-value" id="naviETA">--</div><div class="navi-summary-label">到达时间</div></div>
      </div>
    </div>
  </div>
  <div class="navi-bottom-panel">
    <button class="poi-nav-btn secondary" id="naviExitBtn">退出导航</button>
    <button class="poi-nav-btn" id="naviVoiceBtn">🔊语音提示</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="skeleton-overlay" id="loadingOverlay"><div class="loading-spinner"></div><div class="loading-text" id="loadingText">加载中...</div></div>

<script src="https://webapi.amap.com/maps?v=2.0&key=8429788d2971b1eb0b278b878180ce92&plugin=AMap.PlaceSearch,AMap.AutoComplete,AMap.Driving,AMap.Transfer,AMap.Walking,AMap.Riding,AMap.Geolocation,AMap.ToolBar,AMap.Scale,AMap.TileLayer.Traffic,AMap.TileLayer.Satellite,AMap.MarkerClusterer,AMap.Geocoder"></script>

<script>
// ===================== 全局状态 =====================
var map, autoComplete, placeSearch, geolocation, trafficLayer, satelliteLayer;
var naviMap = null, naviTrafficLayer = null, naviPolyline = null, naviStartMarker = null, naviEndMarker = null;
var myPos = null, myPosName = '我的位置';
var markers = [], currentPOIs = [], currentKeyword = '停车场';
var searchMode = 'nearby', destSearchPos = null, destSearchName = '', searchRadius = 2000;
var radiusOptions = [500, 1000, 2000, 3000, 5000];
var routePolylines = [], routeResults = null, routeStartPos = null, routeEndPos = null, currentRouteStrategy = 'fastest', routeStartName = '', routeEndName = '';
var searchHistory = [], favorites = [], preferences = { defaultRoute: 'fastest', sortBy: 'distance', voiceEnabled: true, darkModeAuto: true, autoZoom: true };
var isDarkMode = false, selectingFor = null, isSatellite = false, voiceOn = true;
var currentParkingDetail = null, currentChargingDetail = null;
var debounceTimer = null;

// ===================== 工具函数 =====================
function $(id){ return document.getElementById(id); }
function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function formatDistance(d){ if(!d && d!==0) return ''; if(d < 1000) return Math.round(d)+'m'; return (d/1000).toFixed(1)+'km'; }
function formatTime(sec){ if(!sec) return ''; if(sec < 60) return sec+'秒'; if(sec < 3600) return Math.round(sec/60)+'分钟'; var h=Math.floor(sec/3600), m=Math.round((sec%3600)/60); return h+'小时'+(m>0?m+'分':''); }
function toast(msg, dur){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(function(){ t.classList.remove('show'); }, dur||2000); }
function showLoading(txt){ $('loadingText').textContent = txt || '加载中...'; $('loadingOverlay').classList.add('show'); }
function hideLoading(){ $('loadingOverlay').classList.remove('show'); }
function haversine(p1, p2){ if(!p1||!p2) return 0; var R=6371000, rLat1=p1[1]*Math.PI/180, rLat2=p2[1]*Math.PI/180, dLat=(p2[1]-p1[1])*Math.PI/180, dLon=(p2[0]-p1[0])*Math.PI/180, a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(rLat1)*Math.cos(rLat2)*Math.sin(dLon/2)*Math.sin(dLon/2); return Math.round(2*R*Math.asin(Math.sqrt(a))); }
function saveLS(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function loadLS(k, def){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function debounceFn(fn, wait){ return function(){ var ctx=this, args=arguments; clearTimeout(debounceTimer); debounceTimer=setTimeout(function(){ fn.apply(ctx, args); }, wait); }; }
function isFav(name){ return favorites.some(function(f){ return f.name === name; }); }
function toggleFav(poi){
  var idx = -1; for(var i=0; i<favorites.length; i++){ if(favorites[i].name === poi.name){ idx = i; break; } }
  if(idx >= 0){ favorites.splice(idx, 1); saveLS('favorites', favorites); toast('已取消收藏'); }
  else{ favorites.push(poi); saveLS('favorites', favorites); toast('已添加到收藏⭐'); }
  return idx < 0;
}

// ===================== 地图初始化（V1.0: 显示地图+路名+定位+点位） =====================
function initMap(){
  try{
    map = new AMap.Map('map', { zoom: 14, center: [113.2644, 23.1291], viewMode: '2D', resizeEnable: true, showLabel: true });
  } catch(e){ console.error('地图初始化失败', e); toast('地图加载失败,请检查网络'); return; }
  // 路况图层
  try{ trafficLayer = new AMap.TileLayer.Traffic({ autoRefresh: true, interval: 180 }); } catch(e){}
  try{ satelliteLayer = new AMap.TileLayer.Satellite(); } catch(e){}
  // 定位
  try{
    geolocation = new AMap.Geolocation({ enableHighAccuracy: true, timeout: 10000, buttonPosition: 'RB', zoomToAccuracy: true });
    map.addControl(geolocation);
    geolocation.getCurrentPosition(function(status, result){
      if(status === 'complete' && result.position){
        myPos = [result.position.lng, result.position.lat];
        map.setCenter(myPos); map.setZoom(15);
        setTimeout(function(){ searchNearby('停车场'); }, 300);
      } else {
        myPos = [113.2644, 23.1291];
        toast('定位失败,使用默认位置广州');
        setTimeout(function(){ searchNearby('停车场'); }, 500);
      }
    });
  } catch(e){ myPos = [113.2644, 23.1291]; setTimeout(function(){ searchNearby('停车场'); }, 500); }
  // 地图点击事件（用于路线规划选点）
  map.on('click', function(e){
    if(selectingFor === 'start'){
      routeStartPos = [e.lnglat.lng, e.lnglat.lat];
      routeStartName = '地图选点';
      updateRoutePanelInfo(); toast('已设为起点'); selectingFor = null;
    } else if(selectingFor === 'end'){
      routeEndPos = [e.lnglat.lng, e.lnglat.lat];
      routeEndName = '地图选点';
      updateRoutePanelInfo(); toast('已设为终点'); selectingFor = null;
    }
  });
}

// ===================== 联想搜索（V2.0） =====================
function initAutoComplete(){
  try{ autoComplete = new AMap.AutoComplete({ city: '全国' }); placeSearch = new AMap.PlaceSearch({ city: '全国', pageSize: 20, pageIndex: 1, extensions: 'base' }); } catch(e){}
}
function renderSuggestions(list, mode){
  var box = $('suggestionsBox');
  if(!list || list.length === 0){ box.innerHTML = '<div class="suggestion-empty">无匹配结果</div>'; box.classList.add('show'); return; }
  var header = mode === 'search' ? '<div class="suggestion-header"><span>搜索建议</span><button class="suggestion-clear" onclick="clearHistory()">清空历史</button></div>' : '<div class="suggestion-header"><span>选择' + (mode==='start'?'起点':'终点') + '</span></div>';
  var items = list.map(function(item, idx){
    var name = escapeHtml(item.name || ''), addr = escapeHtml((item.district||'') + ' ' + (item.address||'')), icon = '📍';
    if(name.indexOf('停车')>=0) icon = '🅿️';
    else if(name.indexOf('充电')>=0) icon = '⚡';
    else if(name.indexOf('公交')>=0 || name.indexOf('地铁')>=0) icon = '🚇';
    else if(name.indexOf('学校')>=0) icon = '🏫';
    else if(name.indexOf('医院')>=0) icon = '🏥';
    else if(name.indexOf('商场')>=0 || name.indexOf('购物')>=0) icon = '🛒';
    else if(name.indexOf('酒店')>=0 || name.indexOf('宾馆')>=0) icon = '🏨';
    return '<div class="suggestion-item" data-idx="'+idx+'"><div class="suggestion-icon">'+icon+'</div><div class="suggestion-content"><div class="suggestion-name">'+name+'</div><div class="suggestion-addr">'+addr+'</div></div></div>';
  }).join('');
  box.innerHTML = header + items; box.classList.add('show');
  Array.prototype.forEach.call(box.querySelectorAll('.suggestion-item'), function(el){
    el.addEventListener('click', function(){
      var idx = parseInt(el.getAttribute('data-idx')); var item = list[idx]; if(!item) return;
      box.classList.remove('show');
      if(mode === 'start' || mode === 'end'){
        var pos = item.location ? [item.location.lng, item.location.lat] : [myPos[0], myPos[1]];
        if(mode==='start'){ routeStartPos = pos; routeStartName = item.name; } else { routeEndPos = pos; routeEndName = item.name; }
        updateRoutePanelInfo();
      } else {
        addToHistory(item.name);
        if(item.location){ searchPOIByName(item.name, [item.location.lng, item.location.lat]); }
        else { searchPOIByName(item.name, null); }
      }
    });
  });
}
function handleSearchInput(){
  var kw = $('searchInput').value.trim();
  if(kw.length > 0){ $('searchClear').classList.add('visible'); } else { $('searchClear').classList.remove('visible'); $('suggestionsBox').classList.remove('show'); return; }
  if(selectingFor === 'start' || selectingFor === 'end'){ debouncedSuggest(kw, selectingFor); return; }
  if(searchHistory.length > 0 && !autoComplete){
    var h = searchHistory.slice(0, 10).map(function(name){ return { name: name, district: '(搜索历史)', address: '' }; });
    renderSuggestions(h, 'search');
    return;
  }
  debouncedSuggest(kw, 'search');
}
var debouncedSuggest = debounceFn(function(kw, mode){
  if(!autoComplete){ toast('搜索组件加载中'); return; }
  autoComplete.search(kw, function(status, result){
    var tips = (result && result.tips) ? result.tips.slice(0, 12).filter(function(t){ return t.location; }) : [];
    if(mode === 'search' && searchHistory.length > 0){
      var h = searchHistory.slice(0, 5).map(function(name){ return { name: name, district: '(历史记录)', address: '' }; });
      renderSuggestions(h.concat(tips), 'search');
    } else { renderSuggestions(tips, mode || 'search'); }
  });
}, 300);
function addToHistory(name){ if(!name) return; searchHistory = searchHistory.filter(function(x){ return x !== name; }); searchHistory.unshift(name); if(searchHistory.length>20) searchHistory = searchHistory.slice(0, 20); saveLS('search_history', searchHistory); }
function clearHistory(){ searchHistory = []; saveLS('search_history', []); $('suggestionsBox').classList.remove('show'); toast('搜索历史已清空'); }

// ===================== POI 搜索 & 渲染（V1.0 + V2.0） =====================
function searchNearby(kw){
  if(!map){ toast('地图未就绪'); return; }
  currentKeyword = kw || '停车场';
  searchMode = 'nearby';
  showLoading('正在搜索附近的'+currentKeyword+'...');
  clearMarkers();
  var searchPos = myPos || [113.2644, 23.1291];
  try{
    var ps = new AMap.PlaceSearch({ pageSize: 25, pageIndex: 1, extensions: 'base' });
    ps.searchNearBy(kw, searchPos, searchRadius, function(status, result){
      hideLoading();
      if(status === 'complete' && result.poiList && result.poiList.pois && result.poiList.pois.length > 0){
        var pois = processPOIs(result.poiList.pois, searchPos);
        currentPOIs = pois;
        renderPOIPanel(pois, kw);
        renderMapMarkers(pois);
        if(map && preferences.autoZoom){ map.setFitView(); try{ map.setZoom(Math.max(map.getZoom(), 14)); } catch(e){} }
      } else { toast('未找到' + kw); currentPOIs = []; renderPOIPanel([], kw); }
    });
  } catch(e){ console.error(e); hideLoading(); toast('搜索失败'); }
}
function searchPOIByName(kw, pos){
  if(!map){ toast('地图未就绪'); return; }
  currentKeyword = kw;
  searchMode = 'dest';
  destSearchPos = pos || null; destSearchName = kw;
  showLoading('正在搜索'+kw+'...');
  clearMarkers();
  try{
    var ps = new AMap.PlaceSearch({ pageSize: 25, pageIndex: 1, extensions: 'base', city: '全国' });
    ps.search(kw, function(status, result){
      hideLoading();
      if(status === 'complete' && result.poiList && result.poiList.pois && result.poiList.pois.length > 0){
        var center = pos || (result.poiList.pois[0].location ? [result.poiList.pois[0].location.lng, result.poiList.pois[0].location.lat] : myPos);
        var pois = processPOIs(result.poiList.pois, center);
        currentPOIs = pois;
        renderPOIPanel(pois, kw);
        renderMapMarkers(pois);
        if(map){ map.setCenter(center); map.setZoom(15); }
      } else { toast('未找到相关结果'); }
    });
  } catch(e){ console.error(e); hideLoading(); toast('搜索失败'); }
}
function processPOIs(rawPois, centerPos){
  var list = [];
  for(var i=0; i<rawPois.length; i++){
    var p = rawPois[i]; if(!p || !p.location) continue;
    var isParking = (p.name || '').indexOf('停车') >= 0 || (p.type || '').indexOf('停车') >= 0;
    var isCharging = (p.name || '').indexOf('充电') >= 0 || (p.type || '').indexOf('充电') >= 0;
    var poi = {
      name: p.name, address: p.address || '', type: p.type || '',
      lngLat: [p.location.lng, p.location.lat],
      distance: centerPos ? haversine(centerPos, [p.location.lng, p.location.lat]) : null,
      tel: p.tel || '', id: p.id,
      isParking: isParking, isCharging: isCharging,
      // V2.0 模拟字段 - 实际可对接第三方API
      price: isCharging ? (0.8 + Math.random() * 0.8).toFixed(2) + '元/度' : (isParking ? Math.floor(5 + Math.random() * 10) + '元/小时' : null),
      totalSpots: isParking ? Math.floor(50 + Math.random() * 200) : (isCharging ? Math.floor(6 + Math.random() * 30) : null),
      freeSpots: isParking ? Math.floor(Math.random() * 40) : (isCharging ? Math.floor(Math.random() * 10) : null),
      openTime: '00:00-24:00', rating: (3.5 + Math.random() * 1.5).toFixed(1)
    };
    list.push(poi);
  }
  // 按距离排序
  list.sort(function(a, b){ return (a.distance || 999999) - (b.distance || 999999); });
  return list;
}
function renderMapMarkers(pois){
  try { map && map.clearMap(); } catch(e){}
  if(!map || !pois || pois.length === 0) return;
  var mkrs = [];
  for(var i=0; i<pois.length; i++){
    var p = pois[i]; if(!p || !p.lngLat || !p.lngLat[0]) continue;
    try{
      var isPark = p.isParking || currentKeyword === '停车场';
      var isCh = p.isCharging || currentKeyword === '充电' || currentKeyword === '充电桩';
      var iconText = isCh ? '⚡' : (isPark ? 'P' : '📍');
      var marker = new AMap.Marker({
        position: p.lngLat, map: map,
        offset: new AMap.Pixel(-12, -24),
        content: '<div style="background:'+(isCh?'#fa8c16':(isPark?'#1677ff':'#52c41a'))+';color:#fff;width:26px;height:32px;border-radius:6px 6px 6px 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.3);border:2px solid #fff;"><span style="transform:rotate(45deg);">'+iconText+'</span></div>',
        title: p.name
      });
      (function(poi){
        marker.on('click', function(){ showPOIDetail(poi); highlightCard(poi.name); });
      })(p);
      mkrs.push(marker);
    } catch(e){ console.warn('marker error', e); }
  }
  markers = mkrs;
  console.log('[地图] 已渲染 ' + mkrs.length + ' 个点位');
}
function clearMarkers(){
  try{ for(var i=0; i<markers.length; i++){ try{ map.remove(markers[i]); } catch(e2){} } } catch(e){}
  markers = [];
}
function highlightCard(name){
  var cards = document.querySelectorAll('.poi-card');
  for(var i=0; i<cards.length; i++){ cards[i].classList.remove('selected'); }
  for(var j=0; j<cards.length; j++){
    if(cards[j].getAttribute('data-name') === name){
      cards[j].classList.add('selected');
      cards[j].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      break;
    }
  }
}

// ===================== 渲染 POI 面板（V1.0 + V2.0 信息字段） =====================
function renderPOIPanel(pois, kw){
  var panel = $('panelContent');
  if(!pois || pois.length === 0){

function sortPOIs(by){

  else sorted.sort(function(a, b){ return (a.distance||999999) - (b.distance||999999); });

function filterPOIs(by){

}

// ===================== 路线规划（V3.0 多路线策略） =====================
function updateRoutePanelInfo(){
  $('routeStartText').textContent = routeStartName || (routeStartPos ? '已选起点' : '选择起点');
  $('routeEndText').textContent = routeEndName || (routeEndPos ? '已选终点' : '选择终点');
}
function searchRoute(){
  if(!routeStartPos){ toast('请选择起点'); return; }
  if(!routeEndPos){ toast('请选择终点'); return; }
  if(!map){ toast('地图未就绪'); return; }
  showLoading('路线规划中...');
  clearRoute();
  $('routePanel').classList.add('show'); $('mainPanel').classList.remove('show');
  var strategy = 0;
  switch(currentRouteStrategy){
    case 'fastest': strategy = 0; break;
    case 'shortest': strategy = 2; break;
    case 'nohighway': strategy = 3; break;
    case 'walk': strategy = -1; break;
    case 'bike': strategy = -2; break;
    default: strategy = 0;
  }
  var svc;
  try{
    if(strategy === -1){ svc = new AMap.Walking({ map: map }); }
    else if(strategy === -2){ svc = new AMap.Riding({ map: map }); }
    else { svc = new AMap.Driving({ map: map, policy: strategy }); }
    svc.search(routeStartPos, routeEndPos, function(status, result){
      hideLoading();
      if(status !== 'complete' || !result || !result.routes || result.routes.length === 0){
        toast('路线规划失败');
        $('routeList').innerHTML = '<div class="empty-state"><div class="empty-icon">🚫</div><div class="empty-text">无法规划路线</div></div>';
        return;
      }
      routeResults = result.routes;
      renderRouteList(result.routes);
      drawRoute(result.routes[0], 0);
    });
  } catch(e){ console.error(e); hideLoading(); toast('路线规划失败'); }
}
function clearRoute(){
  for(var i=0; i<routePolylines.length; i++){
    try{ map.remove(routePolylines[i]); } catch(e){}
  }
  routePolylines = [];
}
function drawRoute(route, idx, color){
  if(!route || !route.steps || !map) return;
  clearRoute();
  var path = [];
  for(var i=0; i<route.steps.length; i++){
    var step = route.steps[i];
    if(step.path){ path = path.concat(step.path); }
    else if(step.start_location && step.end_location){ path.push(step.start_location); path.push(step.end_location); }
  }
  if(path.length === 0 && route.polyline){
    // driving 返回 polyline
    var pts = route.polyline.split(';');
    for(var j=0; j<pts.length; j++){ var xy = pts[j].split(','); if(xy[0]&&xy[1]) path.push([parseFloat(xy[0]), parseFloat(xy[1])]); }
  }
  if(path.length < 2){ return; }
  var colors = ['#1677ff', '#52c41a', '#fa8c16', '#722ed1'];
  var useColor = color || colors[idx % colors.length];
  try{
    var polyline = new AMap.Polyline({
      map: map, path: path, strokeColor: useColor, strokeWeight: 7, strokeOpacity: 0.85, lineJoin: 'round', showDir: true
    });
    routePolylines.push(polyline);
    // 起点/终点标记
    var startM = new AMap.Marker({ position: path[0], map: map, offset: new AMap.Pixel(-12, -24), content: '<div style="background:#52c41a;color:#fff;padding:4px 8px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.3);">起点</div>' });
    var endM = new AMap.Marker({ position: path[path.length-1], map: map, offset: new AMap.Pixel(-12, -24), content: '<div style="background:#fa541c;color:#fff;padding:4px 8px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.3);">终点</div>' });
    routePolylines.push(startM, endM);
    map.setFitView(routePolylines, false, [80, 80, 160, 80]);
  } catch(e){ console.warn('绘制路线失败', e); toast('路线绘制失败'); }
}
function renderRouteList(routes){
  var html = '';
  for(var i=0; i<routes.length; i++){
    var r = routes[i];
    html += '<div class="route-item '+(i===0?'active':'')+'" data-idx="'+i+'" onclick="selectRoute('+i+')">'
      + '<div class="route-item-header"><div class="route-item-name">方案 '+(i+1)+' '+(r.policy || '')+'</div><div class="route-item-time">'+formatTime(r.time || Math.floor(r.distance/15))+'</div></div>'
      + '<div class="route-item-info"><span>📏 '+formatDistance(r.distance||0)+'</span>'
      + '<span>🚦 约 '+(r.tolls||0)+' 个红绿灯</span>'
      + '<span>💰 过路费 ¥'+(r.tolls_cost||0)+'</span></div>'
      + '</div>';
  }
  $('routeList').innerHTML = html;
  var items = document.querySelectorAll('.route-item');
  for(var k=0; k<items.length; k++){
    items[k].addEventListener('click', function(){
      var idx = parseInt(this.getAttribute('data-idx')); selectRoute(idx);
    });
  }
}
function selectRoute(idx){
  if(!routeResults || !routeResults[idx]) return;
  var items = document.querySelectorAll('.route-item');
  for(var i=0; i<items.length; i++) items[i].classList.remove('active');
  if(items[idx]) items[idx].classList.add('active');
  drawRoute(routeResults[idx], idx);
  // 如果路线可导航
  if(routeStartPos && routeEndPos){
    toast('已切换到路线方案 '+(idx+1));
  }
}

  if(!routeResults || !routeResults[routeIdx || 0]){ toast('请先规划路线'); return; }
  var route = routeResults[routeIdx || 0];
  if(!route.steps || route.steps.length === 0){ toast('路线不可用于导航'); return; }
  $('naviOverlay').classList.add('show');
  setTimeout(function(){
    try{
      if(!naviMap){
        naviMap = new AMap.Map('naviMap', { zoom: 16, center: routeStartPos || myPos, showLabel: true, resizeEnable: true });
      } else { naviMap.setCenter(routeStartPos || myPos); naviMap.setZoom(16); }
      var path = [];
      for(var i=0; i<route.steps.length; i++){
        if(route.steps[i].path){ path = path.concat(route.steps[i].path); }
      }
      if(path.length < 2){ path = [routeStartPos, routeEndPos].filter(function(p){ return p; }); }
      try{ naviPolyline = new AMap.Polyline({ map: naviMap, path: path, strokeColor: '#1677ff', strokeWeight: 10, strokeOpacity: 0.9, lineJoin: 'round', showDir: true }); } catch(e){}
      if(routeStartPos){ try{ naviStartMarker = new AMap.Marker({ map: naviMap, position: routeStartPos, offset: new AMap.Pixel(-12,-24), content: '<div style="background:#52c41a;color:#fff;padding:4px 8px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.3);">起点</div>' }); } catch(e){} }
      if(routeEndPos){ try{ naviEndMarker = new AMap.Marker({ map: naviMap, position: routeEndPos, offset: new AMap.Pixel(-12,-24), content: '<div style="background:#fa541c;color:#fff;padding:4px 8px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.3);">终点</div>' }); } catch(e){} }
      try{ naviMap.setFitView(); } catch(e){}
    } catch(e){ console.error(e); toast('导航启动失败'); }
    var totalDist = route.distance || 0, totalTime = route.time || Math.floor(totalDist/15);
    $('naviRemain').textContent = formatDistance(totalDist);
    $('naviTime').textContent = formatTime(totalTime);
    var eta = new Date(); eta.setMinutes(eta.getMinutes() + Math.ceil(totalTime/60));
    $('naviETA').textContent = eta.getHours().toString().padStart(2,'0')+':'+eta.getMinutes().toString().padStart(2,'0');
    $('naviInstruction').textContent = route.steps[0] ? route.steps[0].instruction || '准备出发' : '准备出发';
    $('naviArrow').textContent = '➡';
    $('naviDistanceNext').textContent = (route.steps[0]&&route.steps[0].distance?('前行 '+formatDistance(route.steps[0].distance)):'开始行驶');
  }, 300);
}
function exitNavi(){ $('naviOverlay').classList.remove('show'); }

// ===================== 事件绑定 & 初始化 =====================
function bindEvents(){
  // 搜索框
  $('searchInput').addEventListener('input', handleSearchInput);
  $('searchInput').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ var v = this.value.trim(); if(v){ addToHistory(v); searchPOIByName(v, null); $('suggestionsBox').classList.remove('show'); } }});
  $('searchBtn').addEventListener('click', function(){ var v = $('searchInput').value.trim(); if(v){ addToHistory(v); searchPOIByName(v, null); $('suggestionsBox').classList.remove('show'); }});
  $('searchClear').addEventListener('click', function(){ $('searchInput').value=''; $('searchInput').focus(); $('searchClear').classList.remove('visible'); $('suggestionsBox').classList.remove('show'); });
  // 模式切换
  var modes = document.querySelectorAll('.mode-option');
  for(var m=0; m<modes.length; m++){
    modes[m].addEventListener('click', function(){
      for(var j=0; j<modes.length; j++) modes[j].classList.remove('active');
      this.classList.add('active');
      var mode = this.getAttribute('data-mode');
      if(mode === 'nearby'){ searchMode='nearby'; searchNearby(currentKeyword); }
      else if(mode === 'dest'){
        searchMode = 'dest'; toast('输入目的地关键词后搜索');
        $('mainPanel').classList.remove('show');
      } else if(mode === 'route'){
        searchMode = 'route'; $('routePanel').classList.add('show'); $('mainPanel').classList.remove('show');
        if(!routeStartPos){ routeStartPos = myPos; routeStartName = '我的位置'; }
        updateRoutePanelInfo();
      }
    });
  }
  // 右上角按钮
  $('trafficBtn').addEventListener('click', toggleTraffic);
  $('layerBtn').addEventListener('click', toggleSatellite);
  $('locateBtn').addEventListener('click', function(){
    if(!map){ return; }
    if(geolocation){
      geolocation.getCurrentPosition(function(status, result){
        if(status === 'complete' && result.position){
          myPos = [result.position.lng, result.position.lat];
          map.setCenter(myPos); map.setZoom(16); toast('已定位到当前位置');
        } else { toast('定位失败'); }
      });
    } else if(myPos){ map.setCenter(myPos); map.setZoom(16); }
  });
  $('favBtn').addEventListener('click', showFavoritesPanel);
  $('prefBtn').addEventListener('click', showPreferencesPanel);
  // 路线面板
  $('routeClearBtn').addEventListener('click', function(){ routeStartPos=null; routeEndPos=null; routeStartName=''; routeEndName=''; clearRoute(); updateRoutePanelInfo(); toast('已清空'); });
  $('routeSwapBtn').addEventListener('click', function(){ var tmp=routeStartPos; routeStartPos=routeEndPos; routeEndPos=tmp; var tn=routeStartName; routeStartName=routeEndName; routeEndName=tn; updateRoutePanelInfo(); });
  $('routeSearchBtn').addEventListener('click', searchRoute);
  var routeSels = document.querySelectorAll('.route-strategy');
  for(var r=0; r<routeSels.length; r++){
    routeSels[r].addEventListener('click', function(){
      for(var k=0; k<routeSels.length; k++) routeSels[k].classList.remove('active');
      this.classList.add('active');
      currentRouteStrategy = this.getAttribute('data-strategy');
      if(routeStartPos && routeEndPos){ searchRoute(); }
    });
  }
  // 起终点点击切换到选点模式
  $('routeStartText') && $('routeStartText').addEventListener('click', function(){ selectingFor='start'; $('searchInput').value=''; $('searchInput').placeholder='输入起点名称或点击地图选择'; handleSearchInput(); setTimeout(function(){ $('searchInput').focus(); }, 100); toast('请输入起点或在地图上点击'); });
  $('routeEndText') && $('routeEndText').addEventListener('click', function(){ selectingFor='end'; $('searchInput').value=''; $('searchInput').placeholder='输入终点名称或点击地图选择'; handleSearchInput(); setTimeout(function(){ $('searchInput').focus(); }, 100); toast('请输入终点或在地图上点击'); });
  // 底部导航
  var navItems = document.querySelectorAll('.nav-item');
  for(var n=0; n<navItems.length; n++){
    navItems[n].addEventListener('click', function(){
      for(var j=0; j<navItems.length; j++) navItems[j].classList.remove('active');
      this.classList.add('active');
      var nav = this.getAttribute('data-nav');
      if(nav === 'home'){ showMain(); }
      else if(nav === 'parking'){ searchNearby('停车场'); }
      else if(nav === 'charging'){ searchNearby('充电桩'); }
      else if(nav === 'traffic'){ toggleTraffic(); }
      else if(nav === 'locate'){ if(myPos && map){ map.setCenter(myPos); map.setZoom(16); toast('已定位'); }}
    });
  }
  // 详情/侧边栏关闭
  $('detailClose').addEventListener('click', function(){ $('detailOverlay').classList.remove('show'); });
  $('sideOverlay').addEventListener('click', function(){ $('sideOverlay').classList.remove('show'); $('sidePanel').classList.remove('show'); });
  $('sidePanelClose').addEventListener('click', function(){ $('sideOverlay').classList.remove('show'); $('sidePanel').classList.remove('show'); });
  // 导航退出
  $('naviExitBtn').addEventListener('click', exitNavi);
  $('naviVoiceBtn').addEventListener('click', function(){ voiceOn = !voiceOn; preferences.voiceEnabled = voiceOn; saveLS('preferences', preferences); toast(voiceOn?'语音播报开启':'语音播报关闭'); this.textContent = voiceOn?'🔊语音提示':'🔇语音提示'; });
  // 点击地图/输入框以外区域关闭联想
  document.addEventListener('click', function(e){
    var sug = $('suggestionsBox'), sbar = document.querySelector('.search-bar');
    if(sug && sug.classList.contains('show') && !sug.contains(e.target) && !(sbar && sbar.contains(e.target))){
      sug.classList.remove('show');
    }
  });
  // 窗口变化
  window.addEventListener('resize', function(){
    try{ if(map) map.resize(); if(naviMap) naviMap.resize(); } catch(e){}
  });
}
function showMain(){ $('mainPanel').classList.add('show'); $('routePanel').classList.remove('show'); }

// ===================== 初始化入口 =====================
function init(){
  // 加载本地数据
  searchHistory = loadLS('search_history', []) || [];
  favorites = loadLS('favorites', []) || [];
  preferences = loadLS('preferences', preferences) || preferences;
  voiceOn = preferences.voiceEnabled;
  // 深色模式
  if(preferences.darkModeAuto){
    if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
      isDarkMode = true; document.body.classList.add('dark');
    }
  }
  initMap();
  initAutoComplete();
  bindEvents();
  console.log('[系统] 广东新能源导航 v2.0 启动完成, 已加载功能: 地图,定位,搜索,联想,路线,收藏,深色模式');
}
// 页面加载完成后启动
if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
</script>
