<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#1a73e8">
    <!-- 微信X5浏览器兼容：禁止下拉回弹 -->
    <meta name="x5-orientation" content="portrait">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <title>广东新能源导航</title>
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=faf78a1b9d57c1e1a88fd9f50c795032&plugin=AMap.PlaceSearch,AMap.Geocoder,AMap.Geolocation,AMap.Driving,AMap.RangingTool,AMap.TileLayer,AMap.MarkerCluster"></script>
    
    <style>
        :root {
            --primary: #1a73e8;
            --primary-light: rgba(26,115,232,0.08);
            --primary-hover: #1557b0;
            --success: #34a853;
            --danger: #ea4335;
            --bg-soft: #f5f5f5;
            --text-1: #1f1f1f;
            --text-2: #5f6368;
            --text-3: #9ca3af;
            --border: #e0e0e0;
            --border-light: #f0f0f0;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --anim-fast: 0.15s ease;
            --anim-normal: 0.3s ease;
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body { 
            background: #fff; 
            color: var(--text-1); 
            overflow: hidden; 
            overscroll-behavior: none; 
            touch-action: manipulation;
            -webkit-overflow-scrolling: touch; /* iOS惯性滚动 */
            -webkit-user-select: none;
            user-select: none;
        }

        /* ========== LAYER 1: 全屏地图 ========== */
        #map {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* ========== LAYER 2: 顶部通栏 ========== */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 20;
            padding: var(--safe-top) 16px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.95);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            pointer-events: auto;
        }
        .city-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(0,0,0,0.04);
            border-radius: var(--radius-lg);
            cursor: pointer;
            min-width: 60px;
        }
        .city-name { font-weight: 600; font-size: 14px; }
        .city-arrow { font-size: 10px; color: var(--text-3); }
        
        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-btn {
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius-md);
            background: rgba(0,0,0,0.04);
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: all var(--anim-fast);
        }
        .top-btn:hover, .top-btn.active { background: var(--primary-light); color: var(--primary); }
        .top-btn:active { transform: scale(0.95); }

        /* ========== LAYER 3: 左上角搜索组件 ========== */
        .search-container {
            position: fixed;
            top: calc(var(--safe-top) + 60px);
            left: 16px;
            width: calc(100% - 32px);
            max-width: 380px;
            z-index: 30;
            pointer-events: auto;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            padding: 4px;
        }
        .search-icon {
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            color: var(--text-3);
        }
        .search-input {
            flex: 1;
            height: 44px;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
        }
        .search-btn {
            width: 64px; height: 36px;
            margin-right: 4px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--anim-fast);
        }
        .search-btn:hover { background: var(--primary-hover); }
        .search-btn:active { transform: scale(0.95); }

        /* 搜索联想列表 */
        .suggestions {
            margin-top: 8px;
            background: #fff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-height: 320px;
            overflow-y: auto;
            display: none;
        }
        .suggestions.show { display: block; }
        .suggestions-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            transition: all var(--anim-fast);
        }
        .suggestions-item:last-child { border-bottom: none; }
        .suggestions-item:hover { background: var(--bg-soft); }
        .suggestions-icon {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: var(--bg-soft);
            font-size: 14px;
        }
        .suggestions-item .suggestions-icon.parking { background: rgba(26,115,232,0.08); }
        .suggestions-item .suggestions-icon.charging { background: rgba(52,168,83,0.08); }
        .suggestions-text { flex: 1; }
        .suggestions-name { font-size: 14px; font-weight: 500; }
        .suggestions-addr { font-size: 12px; color: var(--text-3); margin-top: 2px; }
        .suggestions-nav-btn {
            padding: 8px 12px;
            font-size: 12px;
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
        }
        .suggestions-nav-btn:hover { background: var(--primary); color: #fff; }
        
        .quick-icons {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.95);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }
        .quick-icon {
            display: flex; flex-direction: column;
            align-items: center; gap: 4px;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--anim-fast);
        }
        .quick-icon:hover { background: rgba(0,0,0,0.04); }
        .quick-icon.active { background: var(--primary-light); color: var(--primary); }
        .quick-icon span:first-child { font-size: 20px; }
        .quick-icon span:last-child { font-size: 12px; color: var(--text-2); }
        .quick-icon.active span:last-child { color: var(--primary); }

        /* ========== LAYER 4: 左侧悬浮面板 ========== */
        .left-panel-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 299;
            opacity: 0;
            visibility: hidden;
            -webkit-transition: opacity 0.3s ease, visibility 0.3s ease;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            pointer-events: none;
            will-change: opacity;
        }
        .left-panel-overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
        
        .left-panel {
            position: fixed;
            top: 0; left: -380px;
            width: 380px;
            max-width: calc(100% - 32px);
            height: 100%;
            background: #fff;
            z-index: 300;
            box-shadow: var(--shadow-lg);
            -webkit-transition: -webkit-transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: auto;
            will-change: transform;
        }
        .left-panel.show { transform: translateX(380px); }
        
        .left-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--safe-top) 16px 12px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }
        .left-panel-title { font-size: 16px; font-weight: 600; }
        .left-panel-close {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            transition: all var(--anim-fast);
        }
        .left-panel-close:hover { background: rgba(0,0,0,0.06); }
        
        .left-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        /* ========== 模板A: 导航起终点面板 ========== */
        .nav-panel { display: none; }
        .nav-panel.active { display: block; }
        
        .nav-input-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(0,0,0,0.03);
            border-radius: var(--radius-lg);
            margin-bottom: 8px;
        }
        .nav-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--danger);
            flex-shrink: 0;
        }
        .nav-input-row.start .nav-dot { background: var(--success); }
        .nav-input-wrap { flex: 1; }
        .nav-input-label { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
        .nav-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
        }
        .nav-swap-btn {
            display: block;
            margin: 4px auto 12px;
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.06);
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: all var(--anim-fast);
        }
        .nav-swap-btn:hover { background: var(--primary-light); color: var(--primary); transform: rotate(180deg); }
        
        .nav-history { margin-top: 16px; }
        .nav-history-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-history-clear {
            font-size: 12px;
            color: var(--text-3);
            cursor: pointer;
            background: none;
            border: none;
        }
        .nav-history-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .nav-history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--anim-fast);
        }
        .nav-history-item:hover { background: rgba(0,0,0,0.04); }
        .nav-history-icon {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: var(--bg-soft);
            font-size: 14px;
        }
        .nav-history-item .nav-history-icon.parking { background: rgba(26,115,232,0.08); }
        .nav-history-item .nav-history-icon.charging { background: rgba(52,168,83,0.08); }
        .nav-history-text-wrap { flex: 1; }
        .nav-history-text { font-size: 14px; color: var(--text-1); font-weight: 500; }
        .nav-history-addr { font-size: 12px; color: var(--text-3); margin-top: 2px; }
        
        .nav-start-btn {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--anim-fast);
        }
        .nav-start-btn:hover { background: var(--primary-hover); }
        .nav-start-btn:active { transform: scale(0.98); }
        .nav-start-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* ========== 模板B: 图层选择面板 ========== */
        .layer-panel { display: none; }
        .layer-panel.active { display: block; }
        
        .layer-section { margin-bottom: 20px; }
        .layer-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 12px;
        }
        
        .layer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .layer-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px;
            background: rgba(0,0,0,0.03);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--anim-fast);
            border: 2px solid transparent;
        }
        .layer-item:hover { background: rgba(0,0,0,0.06); }
        .layer-item.active { background: var(--primary-light); border-color: var(--primary); }
        .layer-item-icon { font-size: 28px; }
        .layer-item-label { font-size: 13px; font-weight: 500; }
        
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .theme-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all var(--anim-fast);
        }
        .theme-thumb {
            width: 100%;
            aspect-ratio: 1.3;
            border-radius: var(--radius-md);
            border: 2px solid transparent;
            transition: all var(--anim-fast);
            overflow: hidden;
            position: relative;
        }
        .theme-item.active .theme-thumb { border-color: var(--primary); }
        .theme-thumb-normal { background: linear-gradient(135deg, #e8f4f8 0%, #d4e8f0 50%, #b8d4e0 100%); }
        .theme-thumb-blue { background: linear-gradient(135deg, #1e3a5f 0%, #2a5090 50%, #3b6ab0 100%); }
        .theme-thumb-dark { background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 50%, #3a3a3a 100%); }
        .theme-label { font-size: 12px; color: var(--text-2); font-weight: 500; }
        .theme-item.active .theme-label { color: var(--primary); }
        
        .layer-switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px;
            background: rgba(0,0,0,0.03);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--anim-fast);
        }
        .layer-switch-row:hover { background: rgba(0,0,0,0.06); }
        .layer-switch-label { font-size: 14px; font-weight: 500; }
        .layer-switch {
            width: 44px; height: 24px;
            background: var(--border);
            border-radius: 12px;
            position: relative;
            transition: all var(--anim-fast);
        }
        .layer-switch.active { background: var(--primary); }
        .layer-switch::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 20px; height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: all var(--anim-fast);
            box-shadow: var(--shadow-sm);
        }
        .layer-switch.active::after { left: 22px; }

        /* ========== 模板C: 驾车路线方案面板 ========== */
        .route-panel { display: none; }
        .route-panel.active { display: block; }
        
        .route-tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(0,0,0,0.03);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }
        .route-tab {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            background: transparent;
            cursor: pointer;
            transition: all var(--anim-fast);
        }
        .route-tab.active {
            background: #fff;
            box-shadow: var(--shadow-sm);
            font-weight: 600;
            color: var(--primary);
        }
        
        .route-summary {
            padding: 16px;
            background: var(--primary-light);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            text-align: center;
        }
        .route-summary-time {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }
        .route-summary-info {
            font-size: 12px;
            color: var(--text-2);
            margin-top: 4px;
        }

        .route-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .route-item {
            padding: 16px;
            background: rgba(0,0,0,0.03);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--anim-fast);
            border: 2px solid transparent;
        }
        .route-item:hover { background: rgba(0,0,0,0.06); }
        .route-item.active {
            background: var(--primary-light);
            border-color: var(--primary);
        }
        .route-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .route-time {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }
        .route-item.active .route-time { font-size: 22px; }
        .route-price { font-size: 13px; color: var(--text-3); font-weight: 500; }
        .route-info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: var(--text-2);
        }
        .route-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            justify-content: center;
        }
        .route-action-btn {
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all var(--anim-fast);
        }
        .route-action-btn:hover { background: var(--bg-soft); }
        .route-action-btn.primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .route-action-btn.primary:hover { background: var(--primary-hover); }

        /* ========== LAYER 5: 右下角工具按钮 ========== */
        .map-tools {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }
        .tool-btn {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            border: none;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            font-size: 22px;
            transition: all var(--anim-fast);
        }
        .tool-btn:hover { transform: scale(1.05); box-shadow: var(--shadow-lg); }
        .tool-btn:active { transform: scale(0.95); }
        .tool-btn.active { background: var(--primary); color: #fff; }
        
        /* ========== Toast 提示 ========== */
        .toast {
            position: fixed;
            top: calc(var(--safe-top) + 100px);
            left: 50%;
            -webkit-transform: translateX(-50%);
            transform: translateX(-50%);
            z-index: 1000;
            padding: 12px 20px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border-radius: var(--radius-lg);
            font-size: 14px;
            opacity: 0;
            visibility: hidden;
            -webkit-transition: opacity 0.15s ease, visibility 0.15s ease;
            transition: opacity 0.15s ease, visibility 0.15s ease;
            max-width: 320px;
            text-align: center;
            will-change: opacity;
        }
        .toast.show { opacity: 1; visibility: visible; }

        /* ========== Marker气泡 ========== */
        .infowindow {
            min-width: 200px;
            padding: 12px 14px;
        }
        .info-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-1);
            margin-bottom: 4px;
        }
        .info-addr {
            font-size: 12px;
            color: var(--text-3);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .info-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .info-btn {
            flex: 1;
            padding: 8px 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--anim-fast);
        }
        .info-btn:hover { background: var(--primary-hover); }
        .info-btn.secondary {
            background: rgba(0,0,0,0.06);
            color: var(--text-1);
        }
        .info-btn.secondary:hover { background: rgba(0,0,0,0.1); }

        /* ========== 响应式优化 ========== */
        @media (max-width: 420px) {
            .left-panel { width: calc(100% - 16px); left: calc(-100% - 16px); }
            .left-panel.show { transform: translateX(calc(100% + 16px)); }
        }
        
        @media (max-height: 600px) {
            .search-container { top: calc(var(--safe-top) + 50px); }
            .quick-icons { padding: 6px 10px; margin-top: 8px; }
            .quick-icon { padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <!-- ========== LAYER 1: 全屏地图 ========== -->
    <div id="map"></div>

    <!-- ========== LAYER 2: 顶部通栏 ========== -->
    <div class="top-bar">
        <div class="city-selector" id="citySelector">
            <span class="city-name" id="cityName">广州</span>
            <span class="city-arrow">▼</span>
        </div>
        <div class="top-actions">
            <button class="top-btn" id="btnTraffic" title="路况">🚥</button>
            <button class="top-btn" id="btnRanging" title="测距">📏</button>
            <button class="top-btn" id="btnLayers" title="图层">🗺️</button>

    <!-- ========== LAYER 3: 左上角搜索组件 ========== -->
    <div class="search-container">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="search" class="search-input" id="searchInput" placeholder="搜索停车场/充电站">

        <div class="quick-icons">
            <div class="quick-icon" id="quickCharge" data-type="charging">

                <span>充电桩</span>

            <div class="quick-icon" id="quickParking" data-type="parking">

                <span>停车场</span>

    <!-- ========== LAYER 4: 左侧悬浮面板 ========== -->
    <div class="left-panel-overlay" id="leftPanelOverlay"></div>
    <div class="left-panel" id="leftPanel">
        <div class="left-panel-header">
            <span class="left-panel-title" id="leftPanelTitle">导航</span>
            <button class="left-panel-close" id="leftPanelClose">✕</button>
        </div>
        <div class="left-panel-content">
            <!-- 模板A: 导航起终点面板 -->
            <div class="nav-panel active" id="navPanel">
                <div class="nav-input-row start">
                    <div class="nav-dot"></div>
                    <div class="nav-input-wrap">
                        <div class="nav-input-label">我的位置</div>
                        <input type="text" class="nav-input" id="navStartInput" placeholder="当前位置">
                    </div>
                </div>
                <button class="nav-swap-btn" id="navSwapBtn" title="交换起终点">⇅</button>
                <div class="nav-input-row">
                    <div class="nav-dot"></div>
                    <div class="nav-input-wrap">
                        <div class="nav-input-label">终点</div>
                        <input type="text" class="nav-input" id="navEndInput" placeholder="输入终点（停车场/充电站）">
                    </div>
                </div>
                <div class="nav-history">
                    <div class="nav-history-title">
                        <span>最近搜索</span>
                        <button class="nav-history-clear" id="clearHistory">清空</button>
                    </div>
                    <div class="nav-history-list" id="navHistoryList">
                        <div class="nav-history-item" style="color:var(--text-3); font-size:13px; justify-content:center;">
                            暂无历史记录
                        </div>
                    </div>
                </div>
                <button class="nav-start-btn" id="navStartBtn">路线规划</button>
            </div>
            
            <!-- 模板B: 图层选择面板 -->
            <div class="layer-panel" id="layerPanel">
                <div class="layer-section">
                    <div class="layer-section-title">地图类型</div>
                    <div class="layer-grid">
                        <div class="layer-item active" id="layerNormal" data-layer="normal">
                            <span class="layer-item-icon">🗺️</span>
                            <span class="layer-item-label">标准地图</span>
                        </div>
                        <div class="layer-item" id="layerSatellite" data-layer="satellite">
                            <span class="layer-item-icon">🛰️</span>
                            <span class="layer-item-label">卫星地图</span>
                        </div>
                    </div>
                </div>
                <div class="layer-section">
                    <div class="layer-section-title">主题风格</div>
                    <div class="theme-grid">
                        <div class="theme-item active" id="themeNormal" data-theme="normal">
                            <div class="theme-thumb theme-thumb-normal"></div>
                            <span class="theme-label">标准</span>
                        </div>
                        <div class="theme-item" id="themeBlue" data-theme="blue">
                            <div class="theme-thumb theme-thumb-blue"></div>
                            <span class="theme-label">凝黛兰</span>
                        </div>
                        <div class="theme-item" id="themeDark" data-theme="dark">
                            <div class="theme-thumb theme-thumb-dark"></div>
                            <span class="theme-label">魅夜黑</span>
                        </div>
                    </div>
                </div>
                <div class="layer-section">
                    <div class="layer-section-title">辅助功能</div>
                    <div class="layer-switch-row" id="trafficSwitch">
                        <span class="layer-switch-label">实时路况</span>
                        <div class="layer-switch" id="trafficSwitchBtn"></div>
                    </div>
                </div>
            </div>
            
            <!-- 模板C: 驾车路线方案面板 -->
            <div class="route-panel" id="routeResultPanel">
                <div class="route-tabs">
                    <button class="route-tab active" data-policy="0">推荐方案</button>
                    <button class="route-tab" data-policy="1">躲避拥堵</button>
                    <button class="route-tab" data-policy="2">避免收费</button>
                </div>
                <div class="route-list" id="routeList">
                    <div style="padding: 40px; text-align: center; color: var(--text-3); font-size: 14px;">
                        请先输入起终点后点击「路线规划」
                    </div>
                </div>
                <div class="route-actions" id="routeActions" style="display:none;">
                    <button class="route-action-btn" id="btnClearRoute">清空</button>
                    <button class="route-action-btn primary" id="btnReroute">重新规划</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== LAYER 5: 右下角工具按钮 ========== -->
    <div class="map-tools">
        <button class="tool-btn" id="btnLocate" title="回到我的位置">📍</button>
        <button class="tool-btn" id="btnZoomIn" title="放大">+</button>
        <button class="tool-btn" id="btnZoomOut" title="缩小">−</button>
        <button class="tool-btn" id="btnNavigation" title="导航">🧭</button>
    </div>

    <!-- ========== Toast 提示 ========== -->
    <div class="toast" id="toast"></div>

    <script>
        /* ========================================
           全局状态
           ======================================== */
        const S = {
            map: null,
            trafficLayer: null,
            satelliteLayer: null,
            roadnetLayer: null,
            rangingTool: null,
            driving: null,
            currentPanel: 'nav',
            currentMapType: 'normal',      // normal | satellite
            currentTheme: 'normal',        // normal | blue | dark
            trafficOn: false,
            markers: [],                    // 当前搜索结果 Marker
            cluster: null,                  // 点聚合
            infoWindow: null,               // Marker气泡
            userLocation: [113.264385, 23.12911],  // 默认广州
            hasLocation: false,
            history: [],                    // 历史记录 [{name, addr, type, lng, lat}]
            currentSearchType: null,        // parking | charging | null
            searchTimer: null,
            suggestionsActive: false,
            // 搜索结果缓存（5分钟有效）
            _searchCache: null,
            _searchCacheTime: 0,
            _searchCacheValidMs: 5 * 60 * 1000,
            // 请求超时定时器
            _searchTimeoutTimer: null
        };

        /* ========================================
           工具函数
           ======================================== */
        function $(id) { return document.getElementById(id); }

        // 200ms操作防抖
        function debounce(fn, delay) {
            let timer = null;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }
        const _debouncedTraffic = debounce(toggleTraffic, 200);
        const _debouncedSwitchMap = debounce(switchMapType, 200);
        
        function toast(msg, duration) {
            const el = $('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(S._toastTimer);
            S._toastTimer = setTimeout(() => el.classList.remove('show'), duration || 2000);
        }

        function showPanel(panelType) {
            S.currentPanel = panelType;
            $('leftPanelOverlay').classList.add('show');
            $('leftPanel').classList.add('show');
            
            // 隐藏所有面板
            ['navPanel', 'layerPanel', 'routeResultPanel'].forEach(id => {
                $(id).classList.remove('active');
            });
            
            const titles = { nav: '导航', layer: '图层', route: '路线方案' };
            $('leftPanelTitle').textContent = titles[panelType];
            
            if (panelType === 'nav') $('navPanel').classList.add('active');
            else if (panelType === 'layer') $('layerPanel').classList.add('active');
            else if (panelType === 'route') $('routeResultPanel').classList.add('active');
        }

        function hidePanel() {
            $('leftPanelOverlay').classList.remove('show');
            $('leftPanel').classList.remove('show');
            // 关闭导航/路线面板时清除地图路线
            if (S.currentPanel === 'nav' || S.currentPanel === 'route') {
                if (S.driving) S.driving.clear();
                S._startPoint = null;
                S._endPoint = null;
            }
            // 清理搜索超时定时器
            clearTimeout(S._searchTimeoutTimer);
            S._searchTimeoutTimer = null;
        }

        /* ========================================
           地图初始化
           ======================================== */
        function initMap() {
            S.map = new AMap.Map('map', {
                center: S.userLocation,
                zoom: 13,
                resizeEnable: true,
                showIndoorMap: false,
                viewMode: '2D',
                mapStyle: 'amap://styles/normal'
            });

            // 路况图层（默认关闭）
            S.trafficLayer = new AMap.TileLayer.Traffic({
                autoRefresh: true,
                interval: 180
            });

            // 卫星图层（默认关闭）
            S.satelliteLayer = new AMap.TileLayer.Satellite();
            S.roadnetLayer = new AMap.TileLayer.RoadNet();

            // 驾车路线规划
            S.driving = new AMap.Driving({
                map: S.map,
                hideMarkers: false,
                autoFitView: true,
                policy: 0
            });

            // 测距工具
            S.rangingTool = new AMap.RangingTool(S.map);
            S.rangingTool.on('end', function(e) {
                toast('总距离: ' + e.distance.toFixed(0) + ' 米');
            });

            // 信息窗口
            S.infoWindow = new AMap.InfoWindow({
                offset: new AMap.Pixel(0, -20),
                closeWhenClickMap: true
            });

            // 定位功能
            const geolocation = new AMap.Geolocation({
                enableHighAccuracy: true,
                timeout: 10000,
                buttonPosition: 'RB',
                showButton: false
            });
            S.map.addControl(geolocation);

            geolocation.getCurrentPosition(function(status, result) {
                if (status === 'complete') {
                    S.userLocation = [result.position.lng, result.position.lat];
                    S.hasLocation = true;
                    $('navStartInput').value = '我的位置';
                    $('cityName').textContent = result.addressComponent.city || '广州';
                    toast('定位成功');
                } else {
                    // 定位失败，保持默认位置（广州），仍可手动搜索
                    S.hasLocation = false;
                    $('navStartInput').value = '定位失败';
                    toast('定位失败，请手动输入起点');
                }
            });

            // 加载历史记录
            loadHistory();
            
            toast('地图加载完成');
        }

        /* ========================================
           任务1: POI检索（停车场+充电站）
           ======================================== */
        function clearMarkers() {
            S.markers.forEach(m => m.setMap(null));
            S.markers = [];
            if (S.cluster) {
                S.cluster.setMap(null);
                S.cluster = null;
            }
        }

        function createMarker(poi, type) {
            const icon = type === 'parking' 
                ? 'https://webapi.amap.com/theme/v1.3/markers/n/map_bs.png'
                : 'https://webapi.amap.com/theme/v1.3/markers/n/map_r.png';
            
            const marker = new AMap.Marker({
                position: [poi.location.lng, poi.location.lat],
                title: poi.name,
                content: type === 'parking' 
                    ? '<div style="background:#1a73e8;color:#fff;padding:4px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.2);">🅿️ 停车</div>'
                    : '<div style="background:#34a853;color:#fff;padding:4px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.2);">⚡ 充电</div>',
                offset: new AMap.Pixel(-30, -20)
            });

            marker.on('click', function() {
                const content = `
                    <div class="infowindow">
                        <div class="info-name">${poi.name}</div>
                        <div class="info-addr">${poi.address || '地址未知'}</div>
                        <div class="info-actions">
                            <button class="info-btn" onclick="navigateToPoi('${poi.name.replace(/'/g, "\\'")}','${(poi.address||'').replace(/'/g, "\\'")}','${poi.location.lng}','${poi.location.lat}')">去导航</button>
                        </div>
                    </div>
                `;
                S.infoWindow.setContent(content);
                S.infoWindow.open(S.map, [poi.location.lng, poi.location.lat]);
            });

            return marker;
        }

        function renderResults(pois, type) {
            clearMarkers();
            
            if (!pois || pois.length === 0) {
                toast('未找到附近的' + (type === 'parking' ? '停车场' : '充电站'));
                return;
            }

            const newMarkers = pois.map(poi => createMarker(poi, type));
            S.markers = newMarkers;

            // 点聚合
            if (newMarkers.length > 5) {
                S.cluster = new AMap.MarkerCluster(S.map, newMarkers.map(m => ({
                    lnglat: [m.getPosition().lng, m.getPosition().lat],
                    marker: m
                })), {
                    gridSize: 60,
                    renderClusterMarker: function(context) {
                        const count = context.count;
                        return new AMap.Marker({
                            position: context.lnglat,
                            content: '<div style="background:' + (type === 'parking' ? '#1a73e8' : '#34a853') + ';color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.2);border:2px solid #fff;">' + count + '</div>',
                            offset: new AMap.Pixel(-20, -20)
                        });
                    }
                });
            }

            // 自动适配视野
            const bounds = new AMap.Bounds(
                [Math.min(...pois.map(p => p.location.lng)), Math.min(...pois.map(p => p.location.lat))],
                [Math.max(...pois.map(p => p.location.lng)), Math.max(...pois.map(p => p.location.lat))]
            );
            S.map.setBounds(bounds);
            S.map.setZoom(S.map.getZoom() - 1);

            toast('找到 ' + pois.length + ' 个' + (type === 'parking' ? '停车场' : '充电站'));
        }

        function searchNearby(type) {
            if (!S.map) { toast('地图未加载完成'); return; }
            
            S.currentSearchType = type;
            
            // 更新快捷图标状态
            document.querySelectorAll('.quick-icon').forEach(el => el.classList.remove('active'));
            if (type === 'parking') $('quickParking').classList.add('active');
            else $('quickCharge').classList.add('active');

            // 检查缓存（5分钟内有效）
            const now = Date.now();
            if (S._searchCache && 
                S._searchCache.type === type && 
                (now - S._searchCacheTime) < S._searchCacheValidMs) {
                renderResults(S._searchCache.pois, type);
                toast('使用缓存数据');
                return;
            }

            const keywords = type === 'parking' ? '停车场' : '充电站|充电桩';
            const ps = new AMap.PlaceSearch({
                pageSize: 30,
                extensions: 'all'
            });

            toast('正在搜索周边' + (type === 'parking' ? '停车场' : '充电站') + '...');

            // 10秒超时处理
            clearTimeout(S._searchTimeoutTimer);
            S._searchTimeoutTimer = setTimeout(() => {
                ps.cancelSearch();
                toast('搜索超时，请检查网络后重试');
            }, 10000);

            ps.searchNearBy(keywords, new AMap.LngLat(S.userLocation[0], S.userLocation[1]), 5000, function(status, result) {
                clearTimeout(S._searchTimeoutTimer);
                if (status === 'complete' && result.poiList && result.poiList.pois) {
                    // 缓存结果
                    S._searchCache = { type, pois: result.poiList.pois };
                    S._searchCacheTime = now;
                    renderResults(result.poiList.pois, type);
                } else if (status === 'error' || status === 'no_data') {
                    clearMarkers();
                    toast('未找到附近的' + (type === 'parking' ? '停车场' : '充电站'));
                } else {
                    clearMarkers();
                    toast('搜索失败，请检查网络后重试');
                }
            });
        }

        function searchByKeyword(keyword) {
            if (!keyword.trim()) return;
            
            const ps = new AMap.PlaceSearch({
                pageSize: 20,
                extensions: 'all',
                city: '广州'
            });

            ps.search(keyword, function(status, result) {
                if (status === 'complete' && result.poiList && result.poiList.pois) {
                    // 只保留停车场和充电站
                    const filtered = result.poiList.pois.filter(poi => {
                        const name = (poi.name || '').toLowerCase();
                        const type = (poi.type || '').toLowerCase();
                        return name.includes('停车场') || name.includes('停车') || 
                               name.includes('充电') || name.includes('充电站') || name.includes('充电桩') ||
                               type.includes('停车场') || type.includes('充电');
                    });
                    
                    if (filtered.length === 0) {
                        filtered.push(...result.poiList.pois.slice(0, 10));
                    }
                    
                    renderResults(filtered, keyword.includes('充电') ? 'charging' : 'parking');
                }
            });
        }

        function showSuggestions(keyword) {
            if (!keyword.trim()) {
                $('suggestions').classList.remove('show');
                return;
            }

            const ps = new AMap.PlaceSearch({
                pageSize: 8,
                extensions: 'base'
            });

            ps.search(keyword + ' 停车场 充电站', function(status, result) {
                if (status === 'complete' && result.poiList && result.poiList.pois) {
                    const pois = result.poiList.pois;
                    if (pois.length === 0) {
                        $('suggestions').classList.remove('show');
                        return;
                    }
                    
                    const html = pois.slice(0, 6).map(poi => {
                        const isCharging = (poi.name || '').includes('充电') || (poi.type || '').includes('充电');
                        const type = isCharging ? 'charging' : 'parking';
                        return `
                            <div class="suggestions-item" data-lng="${poi.location.lng}" data-lat="${poi.location.lat}" data-name="${poi.name.replace(/'/g, "\\'")}" data-addr="${(poi.address||'').replace(/'/g, "\\'")}" data-type="${type}">
                                <span class="suggestions-icon ${type}">${isCharging ? '⚡' : '🅿️'}</span>
                                <div class="suggestions-text">
                                    <div class="suggestions-name">${poi.name}</div>
                                    <div class="suggestions-addr">${poi.address || ''}</div>
                                </div>
                                <button class="suggestions-nav-btn" onclick="navigateToPoi('${poi.name.replace(/'/g, "\\'")}','${(poi.address||'').replace(/'/g, "\\'")}','${poi.location.lng}','${poi.location.lat}')">导航</button>
                            </div>
                        `;
                    }).join('');
                    
                    $('suggestions').innerHTML = html;
                    $('suggestions').classList.add('show');
                    
                    // 绑定点击事件
                    document.querySelectorAll('.suggestions-item').forEach(item => {
                        item.addEventListener('click', function(e) {
                            if (e.target.classList.contains('suggestions-nav-btn')) return;
                            const lng = parseFloat(this.dataset.lng);
                            const lat = parseFloat(this.dataset.lat);
                            S.map.setCenter([lng, lat]);
                            S.map.setZoom(16);
                            
                            // 创建临时Marker
                            const tempMarker = createMarker({
                                name: this.dataset.name,
                                address: this.dataset.addr,
                                location: { lng, lat }
                            }, this.dataset.type);
                            clearMarkers();
                            S.markers = [tempMarker];
                            
                            // 点击气泡
                            tempMarker.emit('click');
                            $('suggestions').classList.remove('show');
                        });
                    });
                }
            });
        }

        /* ========================================
           任务2: 地图工具（路况/测距/图层）
           ======================================== */
        function toggleTraffic() {
            S.trafficOn = !S.trafficOn;
            const btn = $('btnTraffic');
            const switchBtn = $('trafficSwitchBtn');
            
            if (S.trafficOn) {
                S.trafficLayer.setMap(S.map);
                btn.classList.add('active');
                switchBtn.classList.add('active');
                toast('已开启实时路况');
            } else {
                S.trafficLayer.setMap(null);
                btn.classList.remove('active');
                switchBtn.classList.remove('active');
                toast('已关闭实时路况');
            }
        }

        function toggleRanging() {
            const btn = $('btnRanging');
            if (btn.classList.contains('active')) {
                S.rangingTool.turnOff();
                btn.classList.remove('active');
                S.map.setStatus({ dragEnable: true, zoomEnable: true, pitchEnable: true }); // 恢复地图手势
                toast('已退出测距');
            } else {
                S.rangingTool.turnOn();
                btn.classList.add('active');
                S.map.setStatus({ dragEnable: false, zoomEnable: false, pitchEnable: false }); // 测距时屏蔽地图手势
                toast('点击地图开始测距');
            }
        }

        function switchMapType(type) {
            S.currentMapType = type;
            
            if (type === 'normal') {
                S.satelliteLayer.setMap(null);
                S.roadnetLayer.setMap(null);
            } else if (type === 'satellite') {
                S.satelliteLayer.setMap(S.map);
                S.roadnetLayer.setMap(S.map);
            }
            
            document.querySelectorAll('.layer-item').forEach(el => el.classList.remove('active'));
            $('layer' + type.charAt(0).toUpperCase() + type.slice(1)).classList.add('active');
        }

        function switchTheme(theme) {
            S.currentTheme = theme;
            const styles = {
                normal: 'amap://styles/normal',
                blue: 'amap://styles/blue',
                dark: 'amap://styles/dark'
            };
            S.map.setMapStyle(styles[theme]);
            
            document.querySelectorAll('.theme-item').forEach(el => el.classList.remove('active'));
            $('theme' + theme.charAt(0).toUpperCase() + theme.slice(1)).classList.add('active');
        }

        /* ========================================
           任务3: 驾车导航
           ======================================== */
        function loadHistory() {
            try {
                const data = localStorage.getItem('gd_nav_history');
                if (data) {
                    S.history = JSON.parse(data);
                }
            } catch(e) {}
            renderHistory();
        }

        function renderHistory() {
            if (!S.history || S.history.length === 0) {
                $('navHistoryList').innerHTML = '<div class="nav-history-item" style="color:var(--text-3); font-size:13px; justify-content:center;">暂无历史记录</div>';
                return;
            }
            
            const html = S.history.map(h => `
                <div class="nav-history-item" data-lng="${h.lng}" data-lat="${h.lat}" data-name="${h.name.replace(/'/g, "\\'")}">
                    <span class="nav-history-icon ${h.type}">${h.type === 'charging' ? '⚡' : '🅿️'}</span>
                    <div class="nav-history-text-wrap">
                        <div class="nav-history-text">${h.name}</div>
                        <div class="nav-history-addr">${h.addr || ''}</div>
                    </div>
                </div>
            `).join('');
            
            $('navHistoryList').innerHTML = html;
            
            // 绑定点击事件
            document.querySelectorAll('.nav-history-item').forEach(item => {
                if (!item.dataset.lng) return;
                item.addEventListener('click', function() {
                    const lng = parseFloat(this.dataset.lng);
                    const lat = parseFloat(this.dataset.lat);
                    $('navEndInput').value = this.dataset.name;
                    S._endPoint = { lng, lat, name: this.dataset.name };
                    // 地图居中并高亮
                    S.map.setCenter([lng, lat]);
                    S.map.setZoom(16);
                    clearMarkers();
                    const tempMarker = createMarker({
                        name: this.dataset.name,
                        address: this.dataset.addr || '',
                        location: { lng, lat }
                    }, this.dataset.type || 'parking');
                    S.markers = [tempMarker];
                    tempMarker.setMap(S.map);
                });
            });
        }

        function navigateToPoi(name, addr, lng, lat) {
            S.infoWindow.close();
            $('navEndInput').value = name;
            S._endPoint = { lng: parseFloat(lng), lat: parseFloat(lat), name };
            
            if (!S._startPoint && S.hasLocation) {
                S._startPoint = { lng: S.userLocation[0], lat: S.userLocation[1], name: '我的位置' };
            }
            
            // 直接规划路线
            showPanel('route');
            planRoute();
        }

        function planRoute(policy) {
            if (!S._startPoint) {
                if (S.hasLocation) {
                    S._startPoint = { lng: S.userLocation[0], lat: S.userLocation[1], name: '我的位置' };
                } else {
                    toast('请先获取您的位置');
                    return;
                }
            }
            
            if (!S._endPoint) {
                toast('请输入终点');
                showPanel('nav');
                return;
            }
            
            const routePolicy = policy !== undefined ? parseInt(policy) : 0;
            
            // 复用现有Driving实例，避免重复创建导致闪烁
            if (!S.driving) {
                S.driving = new AMap.Driving({
                    map: S.map,
                    hideMarkers: false,
                    autoFitView: true,
                    policy: routePolicy
                });
            } else {
                S.driving.setPolicy(routePolicy);
            }

            toast('正在规划路线...');

            S.driving.search(
                new AMap.LngLat(S._startPoint.lng, S._startPoint.lat),
                new AMap.LngLat(S._endPoint.lng, S._endPoint.lat),
                function(status, result) {
                    if (status === 'complete' && result.routes && result.routes.length > 0) {
                        renderRoutes(result.routes);
                    } else if (status === 'complete' && (!result.routes || result.routes.length === 0)) {
                        // 驾车路线规划成功但没有可用路线
                        $('routeList').innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-3); font-size: 14px;">暂无通行路线<br><span style="font-size:12px;margin-top:8px;display:inline-block;">可能起点终点距离过近或无法通行</span></div>';
                        $('routeActions').style.display = 'none';
                        toast('暂无通行路线');
                    } else {
                        // 系统错误
                        $('routeList').innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-3); font-size: 14px;">路线规划失败<br><span style="font-size:12px;margin-top:8px;display:inline-block;">请检查网络后重试</span></div>';
                        toast('路线规划失败');
                    }
                }
            );
        }

        function renderRoutes(routes) {
            // 更新tab激活状态
            document.querySelectorAll('.route-tab').forEach(t => t.classList.remove('active'));
            
            const html = routes.map((route, idx) => {
                const km = (route.distance / 1000).toFixed(1);
                const minutes = Math.round(route.time / 60);
                const hours = Math.floor(minutes / 60);
                const mins = minutes % 60;
                const timeStr = hours > 0 ? hours + '小时' + mins + '分' : mins + '分钟';
                const tolls = route.tolls || 0;
                
                return `
                    <div class="route-item ${idx === 0 ? 'active' : ''}" data-index="${idx}">
                        <div class="route-header">
                            <span class="route-time">${timeStr}</span>
                            <span class="route-price">${tolls > 0 ? '¥' + tolls + ' 过路费' : '无收费'}</span>
                        </div>
                        <div class="route-info">
                            <span>约 ${km} 公里</span>
                            <span>${route.trafficLights || 0} 个红绿灯</span>
                        </div>
                    </div>
                `;
            }).join('');
            
            $('routeList').innerHTML = html;
            $('routeActions').style.display = 'flex';
            
            // 绑定路线点击
            document.querySelectorAll('.route-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.route-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                });
            });
            
            toast('找到 ' + routes.length + ' 条路线');
        }

        function clearRoute() {
            S.driving.clear();
            $('navStartInput').value = '我的位置';
            $('navEndInput').value = '';
            S._startPoint = null;
            S._endPoint = null;
            $('routeList').innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-3); font-size: 14px;">请先输入起终点后点击「路线规划」</div>';
            $('routeActions').style.display = 'none';
            toast('已清空路线');
        }

        /* ========================================
           事件绑定
           ======================================== */
        document.addEventListener('DOMContentLoaded', function() {
            initMap();

            // 页面卸载时清理定时器，防止内存泄漏
            window.addEventListener('beforeunload', function() {
                clearTimeout(S.searchTimer);
                clearTimeout(S._searchTimeoutTimer);
                clearTimeout(S._toastTimer);
            });

            // 顶部按钮（防抖200ms）
            $('btnTraffic').addEventListener('click', _debouncedTraffic);
            $('btnRanging').addEventListener('click', toggleRanging);
            $('btnLayers').addEventListener('click', () => showPanel('layer'));
            
            // 搜索框
            $('searchBtn').addEventListener('click', () => {
                const kw = $('searchInput').value.trim();
                if (kw) {
                    $('suggestions').classList.remove('show');
                    searchByKeyword(kw);
                }
            });
            $('searchInput').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') {
                    $('suggestions').classList.remove('show');
                    searchByKeyword(this.value);
                } else {
                    clearTimeout(S.searchTimer);
                    S.searchTimer = setTimeout(() => showSuggestions(this.value), 300);
                }
            });
            $('searchInput').addEventListener('focus', function() {
                if (this.value.trim()) showSuggestions(this.value);
            });

            // 点击地图外关闭联想
            S.map && S.map.on('click', () => $('suggestions').classList.remove('show'));

            // 快捷图标
            $('quickCharge').addEventListener('click', () => searchNearby('charging'));
            $('quickParking').addEventListener('click', () => searchNearby('parking'));

            // 左侧面板
            $('leftPanelClose').addEventListener('click', hidePanel);
            $('leftPanelOverlay').addEventListener('click', hidePanel);
            $('btnNavigation').addEventListener('click', () => showPanel('nav'));

            // 导航面板
            $('navSwapBtn').addEventListener('click', () => {
                const temp = S._startPoint;
                S._startPoint = S._endPoint;
                S._endPoint = temp;
                
                const startVal = $('navStartInput').value;
                const endVal = $('navEndInput').value;
                $('navStartInput').value = endVal || '我的位置';
                $('navEndInput').value = startVal;
            });
            
            $('navStartBtn').addEventListener('click', function() {
                const endVal = $('navEndInput').value.trim();
                if (!endVal) {
                    toast('请输入终点');
                    return;
                }
                
                if (!S._endPoint || S._endPoint.name !== endVal) {
                    // 搜索终点坐标
                    const geocoder = new AMap.Geocoder({ city: '全国' });
                    geocoder.getLocation(endVal, function(status, result) {
                        if (status === 'complete' && result.geocodes.length > 0) {
                            const loc = result.geocodes[0].location;
                            S._endPoint = { lng: loc.lng, lat: loc.lat, name: endVal };
                            showPanel('route');
                            planRoute();
                        } else {
                            toast('未找到终点坐标');
                        }
                    });
                } else {
                    showPanel('route');
                    planRoute();
                }
            });

            $('clearHistory').addEventListener('click', function() {
                S.history = [];
                try { localStorage.removeItem('gd_nav_history'); } catch(e) {}
                renderHistory();
                toast('已清空历史记录');
            });

            // 起终点输入框
            $('navStartInput').addEventListener('blur', function() {
                if (this.value.trim() && this.value !== '我的位置') {
                    const geocoder = new AMap.Geocoder({ city: '全国' });
                    geocoder.getLocation(this.value, function(status, result) {
                        if (status === 'complete' && result.geocodes.length > 0) {
                            const loc = result.geocodes[0].location;
                            S._startPoint = { lng: loc.lng, lat: loc.lat, name: this.value };
                        }
                    }.bind(this));
                }
            });
            
            $('navEndInput').addEventListener('blur', function() {
                if (this.value.trim()) {
                    const geocoder = new AMap.Geocoder({ city: '全国' });
                    geocoder.getLocation(this.value, function(status, result) {
                        if (status === 'complete' && result.geocodes.length > 0) {
                            const loc = result.geocodes[0].location;
                            S._endPoint = { lng: loc.lng, lat: loc.lat, name: this.value };
                        }
                    }.bind(this));
                }
            });

            // 图层面板（防抖200ms）
            $('layerNormal').addEventListener('click', () => { _debouncedSwitchMap('normal'); });
            $('layerSatellite').addEventListener('click', () => { _debouncedSwitchMap('satellite'); });
            $('themeNormal').addEventListener('click', () => switchTheme('normal'));
            $('themeBlue').addEventListener('click', () => switchTheme('blue'));
            $('themeDark').addEventListener('click', () => switchTheme('dark'));
            $('trafficSwitch').addEventListener('click', _debouncedTraffic);

            // 路线tab
            document.querySelectorAll('.route-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    const policy = this.dataset.policy;
                    document.querySelectorAll('.route-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    planRoute(policy);
                });
            });

            $('btnClearRoute').addEventListener('click', clearRoute);
            $('btnReroute').addEventListener('click', () => planRoute());

            // 地图工具按钮
            $('btnLocate').addEventListener('click', () => {
                if (S.hasLocation) {
                    S.map.setCenter(S.userLocation);
                    S.map.setZoom(14);
                    toast('已定位到我的位置');
                } else {
                    toast('定位中...');
                }
            });
            $('btnZoomIn').addEventListener('click', () => S.map.zoomIn());
            $('btnZoomOut').addEventListener('click', () => S.map.zoomOut());
        });
    </script>
</body>
</html>
