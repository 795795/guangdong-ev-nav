/* =========================================================================
 * 纯前端直接调用高德 REST API（无需后端代理，可在 GitHub Pages 直连）
 * 优先走 fetch（CORS），失败自动回退 JSONP，确保浏览器端稳定可用
 * ========================================================================= */
    const AMAP_KEY = '8429788d2971b1eb0b278b878180ce92';   // Web服务Key（用于 REST API / amapFetch）

    // ---------- JSONP 实现（GitHub Pages 纯前端兜底方案） ----------
    function _jsonp(url, params) {
        return new Promise(function (resolve, reject) {
            var cbName = '_amap_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
            var fullParams = Object.assign({}, params, { callback: cbName });
            var qs = Object.keys(fullParams)
                .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(fullParams[k]); })
                .join('&');
            var script = document.createElement('script');
            script.src = url + '?' + qs;
            script.async = true;
            var timeoutId = setTimeout(function () {
                cleanup();
                reject(new Error('请求超时'));
            }, 10000);
            function cleanup() {
                clearTimeout(timeoutId);
                delete window[cbName];
                if (script.parentNode) script.parentNode.removeChild(script);
            }
            window[cbName] = function (data) {
                cleanup();
                resolve(data);
            };
            script.onerror = function () {
                cleanup();
                reject(new Error('网络请求失败'));
            };
            document.head.appendChild(script);
        });
    }

    // P1-缺陷2: 带重试机制的 API 请求
    function amapFetchWithRetry(alias, params, maxRetries) {
        maxRetries = maxRetries || 2;
        var attempt = 0;
        function tryRequest() {
            attempt++;
            return amapFetch(alias, params).catch(function(err) {
                console.warn('[P1-缺陷2] 请求失败，第 ' + attempt + ' 次尝试: ' + err.message);
                if (attempt < maxRetries) {
                    // 指数退避: 300ms, 600ms
                    var delay = 300 * Math.pow(2, attempt - 1);
                    return new Promise(function(resolve) {
                        setTimeout(function() { resolve(tryRequest()); }, delay);
                    });
                }
                throw err;
            });
        }
        return tryRequest();
    }
    
    function amapFetch(alias, params) {
        var url = '';
        var baseParams = Object.assign({ key: AMAP_KEY }, params);

        switch (alias) {
            case 'suggest':
                url = 'https://restapi.amap.com/v3/assistant/inputtips';
                break;
            case 'around':
            case 'place/around':
                url = 'https://restapi.amap.com/v3/place/around';
                break;
            case 'route':
            case 'driving':
                url = 'https://restapi.amap.com/v3/direction/driving';
                break;
            case 'regeo':
                url = 'https://restapi.amap.com/v3/geocode/regeo';
                break;
            default:
                url = 'https://restapi.amap.com/v3/' + alias;
        }

        // 1) 先走 fetch / CORS
        var qs = Object.keys(baseParams)
            .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(baseParams[k]); })
            .join('&');

        var finalCheck = function (j) {
            if (String(j.status) !== '1') throw new Error(j.info || j.msg || '高德接口异常');
            return j;
        };

        if (window.fetch) {
            return fetch(url + '?' + qs, { method: 'GET', mode: 'cors' })
                .then(function (r) { return r.json(); })
                .then(finalCheck)
                .catch(function () {
                    // 2) 回退：JSONP（GitHub Pages 上最稳定的纯前端调用方式）
                    return _jsonp(url, baseParams).then(finalCheck);
                });
        }
        // 无 fetch 时直接走 JSONP
        return _jsonp(url, baseParams).then(finalCheck);
    }

    function doLocate(showHint) {
        if (!S.geo) { setUserLocation(113.264, 23.129, '广州默认位置'); if (showHint) toast('定位服务不可用，使用默认位置', 'warning'); return; }
        if (showHint) showLoading('正在定位...', '获取当前位置', true);
        console.log('开始定位...');
        try {
            S.geo.getCurrentPosition(function (status, result) {
                hideLoading();
                console.log('定位结果:', status, result);
                if (status === 'complete') {
                    // AMap Geolocation 返回的已经是 GCJ02 坐标，无需转换
                    let lng = result.position.lng, lat = result.position.lat;
                    setUserLocation(lng, lat, '您的位置');
                    if (showHint) toast('定位成功', 'success');
                    refreshCurrent();
                } else {
                    // 任务二-1: 定位失败友好提示
                    const errType = result && result.error && result.error.info;
                    let msg = '定位失败，请刷新重试';
                    if (errType === 'PERMISSION_DENIED' || errType === 'Geolocation permission denied') {
                        msg = '定位权限被拒绝，请在系统设置或浏览器中开启定位权限';
                    } else if (errType === 'TIME_OUT' || errType === 'Geolocation time out') {
                        msg = '定位超时，请检查网络后重试';
                    } else if (errType === 'POSITION_UNAVAILABLE') {
                        msg = '无法获取位置信息，请检查GPS是否开启';
                    }
                    setUserLocation(113.264, 23.129, '广州默认位置');
                    toast(msg, 'error', 4000);  // 任务二-1: 更长的提示时间
                    refreshCurrent();
                }
            });
        } catch (e) { 
            hideLoading(); 
            toast('定位服务异常，请在浏览器设置中开启定位权限', 'error', 4000);
            setUserLocation(113.264, 23.129, '广州默认位置'); 
            refreshCurrent(); 
        }

    // 解析POI数据
    function parsePoi(poi) {
        const result = {
            id: poi.id || 'P' + Math.random().toString(36).substr(2, 9),
            name: poi.name || '未知名称',
            address: poi.address || poi.location || '暂无地址',
            lng: poi.location && poi.location.lng || 0,
            lat: poi.location && poi.location.lat || 0,
            distance: poi.distance || 0,
            type: '',
            _fav: false
        };
        
        const typeName = (poi.type || poi.business_type || poi.name || '') + '|' + (poi.name || '');
        // 停车场类型识别
        if (typeName.includes('停车') || typeName.includes('停车场') || typeName.includes('P') || typeName.includes('p') ) {
            result.type = '停车';
            result.totalSpots = 0;
            result.availableSpots = 0;
            if (poi.biz_ext && poi.biz_ext.cost) {
                result.pricePerHour = parseFloat(poi.biz_ext.cost.replace(/[^0-9.]/g, ''));
            }
            if (poi.entrance) {
                result.entrance = poi.entrance;
            }
        } else if (typeName.includes('充电') || typeName.includes('充电站') || typeName.includes('充电桩') || typeName.includes('换电')) {
            result.type = '充电';
            result.fastChargePiles = 0;
            result.slowChargePiles = 0;
            result.availablePiles = 0;
            if (poi.extension && poi.extension.district) {
                const desc = poi.extension.district || '';
                const fastMatch = desc.match(/快充[\u4e00-\u9fa5]*(\d+)/);
                const slowMatch = desc.match(/慢充[\u4e00-\u9fa5]*(\d+)/);
                if (fastMatch) result.fastChargePiles = parseInt(fastMatch[1], 10);
                if (slowMatch) result.slowChargePiles = parseInt(slowMatch[1], 10);
            }
            if (poi.biz_ext && poi.biz_ext.cost) {
                result.pricePerKwh = parseFloat(poi.biz_ext.cost.replace(/[^0-9.]/g, ''));
            }
            if (poi.extension && poi.extension.operator) {
                result.operator = poi.extension.operator;
            }
            if (poi.extension && poi.extension.type) {
                result.stationType = poi.extension.type.includes('地下') ? '地下' : '地面';
            }
        }
        
        return result;
    }
    
    // 并发搜索停车场和充电桩
    function searchAroundLocation(center, callback) {
        if (!S.ps) {
            try {
                S.ps = new AMap.PlaceSearch({
                    extensions: 'all',
                    pageSize: 20,
                    pageIndex: 1,
                    autoFitView: false
                });
            } catch (e) {
                console.error('PlaceSearch初始化失败:', e);
                callback && callback([]);
                return;
            }
        }
        
        const centerPoint = [center.lng, center.lat];
        S.searchCenter = center;
        S.searchPageIndex = 1;
        
        let completed = 0;
        const allResults = [];
        
        S.ps.searchNearBy({
            keywords: '停车场',
            location: centerPoint,
            radius: 5000
        }, function(status, result) {
            completed++;
            if (status === 'complete' && result.poiList && result.poiList.pois) {
                result.poiList.pois.forEach(function(poi) {
                    const parsed = parsePoi(poi);
                    if (parsed.type === '停车') {
                        allResults.push(parsed);
                    }
                });
            }
            checkComplete();
        });
        
        S.ps.searchNearBy({
            keywords: '电动汽车充电站|充电桩',
            location: centerPoint,
            radius: 5000
        }, function(status, result) {
            completed++;
            if (status === 'complete' && result.poiList && result.poiList.pois) {
                result.poiList.pois.forEach(function(poi) {
                    const parsed = parsePoi(poi);
                    if (parsed.type === '充电') {
                        allResults.push(parsed);
                    }
                });
            }
            checkComplete();
        });
        
        function checkComplete() {
            if (completed >= 2) {
                allResults.sort(function(a, b) {
                    return a.distance - b.distance;
                });
                callback && callback(allResults);
            }
        }
    }
    
    // 加载下一页数据（带300ms防抖）
    function loadNextPage(callback) {
        if (!S.ps || !S.searchCenter || S.searchLoading) {
            callback && callback([]);
            return;
        }
        
        S.searchLoading = true;
        const currentPage = S.searchPageIndex + 1;
        
        const centerPoint = [S.searchCenter.lng, S.searchCenter.lat];
        let completed = 0;
        const newResults = [];
        
        S.ps.searchNearBy({
            keywords: '停车场',
            location: centerPoint,
            radius: 5000,
            pageIndex: currentPage
        }, function(status, result) {
            completed++;
            if (status === 'complete' && result.poiList && result.poiList.pois) {
                result.poiList.pois.forEach(function(poi) {
                    const parsed = parsePoi(poi);
                    if (parsed.type === '停车') {
                        newResults.push(parsed);
                    }
                });
            }
            checkComplete();
        });
        
        S.ps.searchNearBy({
            keywords: '电动汽车充电站|充电桩',
            location: centerPoint,
            radius: 5000,
            pageIndex: currentPage
        }, function(status, result) {
            completed++;
            if (status === 'complete' && result.poiList && result.poiList.pois) {
                result.poiList.pois.forEach(function(poi) {
                    const parsed = parsePoi(poi);
                    if (parsed.type === '充电') {
                        newResults.push(parsed);
                    }
                });
            }
            checkComplete();
        });
        
        function checkComplete() {
            if (completed >= 2) {
                S.searchLoading = false;
                S.searchPageIndex = currentPage;
                callback && callback(newResults);
            }
        }
    }

    function refreshCurrent() {

        let list = S.pois.slice();
        // 任务二-2: 多重筛选取交集
        if (S.extraFilters && S.extraFilters.length > 0) {
            S.extraFilters.forEach(function(f) {
                if (f === 'available') list = list.filter(function (p) { return (p.availablePiles || p.availableSpots || 0) > 0; });
                if (f === 'fastCharge') list = list.filter(function (p) { return (p.fastChargePiles || 0) > 0; });
            });
        }
        if (S.kw) { const k = S.kw.toLowerCase(); list = list.filter(function (p) { return (p.name + ' ' + p.address).toLowerCase().indexOf(k) >= 0; }); }
        if (S.sort === 'distance') list.sort(function (a, b) { return a.distance - b.distance; });
        else if (S.sort === 'price') list.sort(function (a, b) {
            const pa = a.pricePerKwh || a.pricePerHour || 0;
            const pb = b.pricePerKwh || b.pricePerHour || 0;
            return pa - pb;
        });
        S.filtered = list;

        if (!poiList) return;
        poiList.innerHTML = '';
        if (list.length === 0) {
            const empty = document.createElement('div'); empty.className = 'empty-state';
            const icon = S.mode === 'charge' ? '⚡' : S.mode === 'parking' ? '🅿️' : '📍';
            const modeText = S.mode === 'charge' ? '充电站' : S.mode === 'parking' ? '停车场' : '地点';
            empty.innerHTML = '<div class="empty-icon">' + icon + '</div>' +
                '<div class="empty-title" style="font-size:15px;font-weight:700;color:var(--text-1);margin-bottom:6px;">附近暂无' + modeText + '</div>' +
                '<div class="empty-hint" style="font-size:12px;color:var(--text-3);line-height:1.6;">点击 ⚡充电/🅿️停车按钮<br>或搜索具体名称</div>';
            poiList.appendChild(empty);
            if ($('loadMoreIndicator')) $('loadMoreIndicator').style.display = 'none';
            if ($('noMoreIndicator')) $('noMoreIndicator').style.display = 'none';
            return;
        }
        const end = Math.min(S.pageSize, list.length);
        if ($('loadMoreIndicator')) $('loadMoreIndicator').style.display = list.length > S.pageSize ? 'flex' : 'none';
        if ($('noMoreIndicator')) $('noMoreIndicator').style.display = list.length <= S.pageSize ? 'flex' : 'none';
        // 优化：分批渲染，每批4个，间隔50ms，避免卡顿
        renderCardsInBatches(list, 0, end, 4, 50);
        S.displayed = end;
    }
    function renderCardsInBatches(list, start, end, batchSize, delay) {
        const container = $('poiList');
        const batchEnd = Math.min(start + batchSize, end);
        for (let i = start; i < batchEnd; i++) {
            const card = renderPoiCard(list[i], i);
            card.style.opacity = '0';
            card.style.transform = 'translateY(10px)';
            container.appendChild(card);
            // 延迟动画，错开时间
            setTimeout(function (idx) {
                const el = container.children[idx];
                if (el) {
                    el.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }
            }, (i - start) * 30, i);
        }
        if (batchEnd < end) {
            setTimeout(function () {
                renderCardsInBatches(list, batchEnd, end, batchSize, delay);
            }, delay);
        }
    }

    // ---------- 渲染POI卡片 ----------
    function renderPoiCard(poi, idx) {
        const card = document.createElement('div');
        card.className = 'poi-card';
        card.dataset.idx = idx;

function renderMapMarkers() {
        // 任务三-1: Marker Clustering点聚合
        // 清理旧的聚合器和标记
        if (S.markerCluster) try { S.markerCluster.setMap(null); S.markerCluster = null; } catch (e) {}
        if (S.markers && S.markers.length) try { S.map.remove(S.markers); } catch (e) {}
        S.markers = [];
        const list = S.filtered;
        
        // 根据数据量决定渲染策略
        if (list.length === 0) return;
        
        // 创建标记（不直接添加到地图，由Clusterer管理）
        for (let i = 0; i < list.length; i++) (function (idx) {
            const p = list[idx];
            try {
                const iconType = p.type === '充电' ? 'charge' : 'parking';
                const m = new AMap.Marker({ 
                    position: [p.lng, p.lat], 
                    offset: new AMap.Pixel(-12, -32), 
                    zIndex: 50,
                    extData: { idx: idx, type: iconType },
                    content: '<div class="poi-marker ' + iconType + '">' + 
                             (p.type === '充电' ? '⚡' : '🅿️') + '</div>'
                });
                m.on('click', function () {
                // Cluster点击时获取实际索引
                const actualIdx = m.getExtData().idx;
                selectPoi(actualIdx);
                // 显示信息窗
                const poi = S.filtered[actualIdx];
                if (poi) showMarkerInfoWindow(poi);
                // 添加呼吸灯效果
                showMarkerPulse(m);
            }); 
                S.markers.push(m);
            } catch (e) {}
        })(i);
        
        // 任务三-1: 使用MarkerClusterer进行点聚合
        if (typeof AMap.MarkerClusterer !== 'undefined' && S.markers.length > 0) {
            try {
                S.markerCluster = new AMap.MarkerClusterer(S.map, S.markers, {
                    gridSize: 60,           // 聚合网格大小
                    maxZoom: 16,            // 最大缩放级别，超过则不聚合
                    minClusterSize: 3,      // 最少聚合点数
                    averageCenter: true,    // 聚合点居中
                    styles: [
                        { url: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><circle cx="20" cy="20" r="18" fill="#1677ff" opacity="0.9"/><text x="20" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">c</text></svg>'), size: new AMap.Size(40, 40), offset: new AMap.Pixel(-20, -20), textColor: '#fff' },
                        { url: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"><circle cx="25" cy="25" r="22" fill="#1677ff" opacity="0.9"/><text x="25" y="30" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">c</text></svg>'), size: new AMap.Size(50, 50), offset: new AMap.Pixel(-25, -25), textColor: '#fff' },
                        { url: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><circle cx="30" cy="30" r="28" fill="#0958d9" opacity="0.9"/><text x="30" y="36" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">c</text></svg>'), size: new AMap.Size(60, 60), offset: new AMap.Pixel(-30, -30), textColor: '#fff' }
                    ]
                });
                // P1-缺陷4: 集群点击事件 - 点击集群时放大视图
                S.markerCluster.on('click', function (cluster) {
                    try {
                        var markers = cluster.markers;
                        if (markers && markers.length > 0) {
                            var lngs = markers.map(function(m) { return m.getPosition().lng; });
                            var lats = markers.map(function(m) { return m.getPosition().lat; });
                            var centerLng = (Math.min.apply(null, lngs) + Math.max.apply(null, lngs)) / 2;
                            var centerLat = (Math.min.apply(null, lats) + Math.max.apply(null, lats)) / 2;
                            var currentZoom = S.map.getZoom();
                            S.map.setZoomAndCenter(currentZoom + 2, [centerLng, centerLat]);
                        }
                    } catch (e) {}
                });
            } catch (e) {
                // 降级：不使用聚合，直接添加标记
                S.markers.forEach(function(m) { m.setMap(S.map); });
            }
        } else {
            // 标记直接添加到地图
            S.markers.forEach(function(m) { m.setMap(S.map); });
        }
        
        // 视野适应
        if (S.markers.length) {
            try {
                const all = S.markers.slice();
                if (S.userMarker) all.push(S.userMarker);
                S.map.setFitView(all, false, [60, 60, 120, 60]);
            } catch (e) {}
        }
    }

    function selectPoi(idx) {
        const list = S.filtered; if (idx < 0 || idx >= list.length) return;
        S.selected = idx;
        const cards = document.querySelectorAll('.poi-card');
        cards.forEach(function (c) { c.classList.remove('selected'); });
        if (cards[idx]) cards[idx].classList.add('selected');
        const poi = list[idx];
        // Marker 脉冲效果（地图联动时也触发）
        try {
            if (S.markers[idx]) showMarkerPulse(S.markers[idx]);
        } catch (e) {}
        // 任务三-1: 使用panTo平滑移至中心
        if (S.map) {
            try { S.map.panTo([poi.lng, poi.lat]); } catch (e) {}
            try { const z = S.map.getZoom(); if (z < 15) S.map.setZoom(15); } catch (e) {}
        }
        // Marker 点击 → 高亮列表对应项并滚动
        if (cards[idx]) {
            cards[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

    // ---------- 路线规划 ----------
    function planRoute(sLng, sLat, eLng, eLat) {
        // 任务二-3: 起点终点相同校验
        if (Math.abs(sLng - eLng) < 0.0001 && Math.abs(sLat - eLat) < 0.0001) {
            toast('起点和终点不能相同，请重新选择', 'error');
            return;
        }
        if (!S.driving) { toast('路线服务不可用', 'error'); return; }
        showLoading('规划路线...', '请稍候', false);
        try {
            S.driving.search([sLng, sLat], [eLng, eLat], function (status, result) {
                hideLoading();
                if (status !== 'complete' || !result.routes || !result.routes.length) { 
                    toast('未找到合理路线，请重新规划', 'error');  // 任务二-3: 更友好的提示
                    return; 
                }
                // 任务二-3: 路线距离为0拦截
                const firstRoute = result.routes[0];
                if (!firstRoute || !firstRoute.distance || firstRoute.distance <= 0) {
                    toast('未找到合理路线，请重新规划', 'error');
                    return;
                }
                try { S.polylines.forEach(function (pl) { try { pl.setMap(null); } catch (e) {} }); } catch (e) {}
                S.polylines = [];
                result.routes.forEach(function (route, idx) {
                    try {
                        const pl = new AMap.Polyline({ path: route.path, strokeColor: idx === 0 ? '#1677ff' : (idx === 1 ? '#52c41a' : '#faad14'), strokeWeight: 6, strokeOpacity: 0.9, strokeStyle: 'solid' });
                        pl.setMap(S.map); S.polylines.push(pl);
                    } catch (e) {}
                });
                try { S.map.setFitView(S.polylines, false, [60, 60, 120, 60]); } catch (e) {}
                showRoutePanel(); displayRouteList(result.routes);
            });
        } catch (e) { hideLoading(); toast('路线规划出错', 'error'); }
    }
    function displayRouteList(routes) {
        $('routeList').innerHTML = '';
        routes.forEach(function (route, idx) {
            const card = document.createElement('div');
            card.className = 'route-card' + (idx === 0 ? ' active' : '');
            card.innerHTML =
                '<div class="route-card-head">' +
                    '<div class="route-card-name">路线 ' + (idx + 1) + (idx === 0 ? ' · 最快' : '') + '</div>' +
                    '<div class="route-card-time">' + Math.round(route.time / 60) + ' 分钟</div>' +
                '</div>' +
                '<div class="route-card-info"><div>' + (route.distance / 1000).toFixed(1) + ' km</div>' +
                (route.tolls ? '<div>过路费 ¥' + route.tolls + '</div>' : '') + '</div>';
            card.onclick = function () {
                document.querySelectorAll('.route-card').forEach(function (c) { c.classList.remove('active'); });
                card.classList.add('active');
                try { if (S.polylines[idx]) S.map.setFitView([S.polylines[idx]], false, [60, 60, 120, 60]); } catch (e) {}
            };
            $('routeList').appendChild(card);
        });
    }
    function showRoutePanel() { $('routePanel').classList.add('show'); $('routePanel').style.display = 'flex'; setPanelState('mini'); }
    function hideRoutePanel() { $('routePanel').classList.remove('show'); setTimeout(function () { $('routePanel').style.display = 'none'; }, 300); }
    function startNavigation(poi) {
        if (!S.user) { toast('请先定位', 'warning'); return; }
        closePoiDetail();
        $('naviOverlay').style.display = 'flex'; $('naviTop').style.display = 'block';
        const tl = poi.type === '充电' ? '充电站' : '停车场';
        $('naviInstruction').textContent = '前往' + tl + '：' + poi.name;
        $('naviDistNext').textContent = fmtDist(poi.distance || 0) + ' · 预计 ' + Math.max(1, Math.round((poi.distance || 0) / 800)) + ' 分钟';
        $('naviTotalDist').textContent = fmtDist(poi.distance || 0);

    // ---------- 地图移动后刷新 ----------
    // 任务三-2: 获取地图视野边界
    function getMapBounds() {
        try {
            const bounds = S.map.getBounds();
            if (bounds) {
                const sw = bounds.getSouthWest();
                const ne = bounds.getNorthEast();
                return { 
                    minLng: sw.lng, maxLng: ne.lng,
                    minLat: sw.lat, maxLat: ne.lat
                };
            }
        } catch (e) {}
        return null;
    }
    
    // 任务三-2: 判断点是否在视野内
    function isInBounds(lng, lat) {
        const b = getMapBounds();
        if (!b) return true;
        return lng >= b.minLng && lng <= b.maxLng && lat >= b.minLat && lat <= b.maxLat;
    }
    
    function onMapMoveEnd() {
        if (!S.map || S.loading) return;
        try {
            const c = S.map.getCenter();
            if (c && S.user) {
                const d = hav(S.user.lng, S.user.lat, c.lng, c.lat);
                if (d > 3000) {
                    S.user = { lng: c.lng, lat: c.lat, label: '地图中心' };
                    refreshCurrent();
                    toast('已更新为地图中心附近', 'success');
                }
            } else if (c) { S.user = { lng: c.lng, lat: c.lat, label: '地图中心' }; refreshCurrent(); }
            
            // 任务三-2: 懒加载 - 只渲染视野内的标记
            const zoom = S.map.getZoom();
            if (zoom >= 12) {
                // 高缩放级别：精细过滤
                const bounds = getMapBounds();
                if (bounds) {
                    const visibleList = S.filtered.filter(function(p) {
                        return p.lng >= bounds.minLng && p.lng <= bounds.maxLng &&
                               p.lat >= bounds.minLat && p.lat <= bounds.maxLat;
                    });
                    // 只更新标记，不重新渲染整个列表
                    renderVisibleMarkers(visibleList);
                }
            }
        } catch (e) {}
    }
    
    // 任务三-2: 只渲染视野内的标记
    function renderVisibleMarkers(visibleList) {
        // 只在缩放级别>=14时精细控制标记显示
        const zoom = S.map.getZoom();
        if (zoom < 14) return; // 低缩放下依赖聚合
        
        // 临时：延迟渲染以提高性能
        if (S.renderTimer) clearTimeout(S.renderTimer);
        S.renderTimer = setTimeout(function() {
            // 更新聚合器或直接更新标记
            if (S.markerCluster) {
                // 重新设置标记（只显示视野内的）
                S.markerCluster.setMarkers(visibleList.map(function(p, i) {
                    return S.markers.find(function(m) {
                        const ed = m.getExtData();
                        return ed && ed.idx === S.filtered.indexOf(p);
                    });
                }).filter(Boolean));
            }
        }, 100);
    }

    // ---------- 面板拖拽 ----------
    function initPanelDrag() {
        const handle = $('drawerHandle'), drawer = $('bottomDrawer');
        if (!handle || !drawer) return;
        let startY = 0, startH = 0, dragging = false, lastH = 0;
        // 阻止抽屉区域的触摸事件冒泡到地图
        ['touchstart', 'touchmove', 'touchend', 'mousedown', 'mousemove', 'mouseup', 'wheel'].forEach(function (evtName) {
            drawer.addEventListener(evtName, function (e) { e.stopPropagation(); }, { passive: false });
        });
        function getH() {
            const vh = window.innerHeight || 480;
            return { mini: 80, half: Math.max(200, Math.min(vh * 0.45, 450)), full: Math.max(300, Math.min(vh * 0.8, 650)) };
        }
        function onStart(e) {
            dragging = true;
            const pt = e.touches ? e.touches[0] : e;
            startY = pt.clientY; startH = drawer.offsetHeight;
            drawer.classList.add('is-dragging');
            if (e.cancelable) e.preventDefault();
        }
        function onMove(e) {
            if (!dragging) return;
            const pt = e.touches ? e.touches[0] : e;
            const delta = startY - pt.clientY;
            const h = getH();
            let nh = startH + delta;
            nh = Math.max(h.mini, Math.min(h.full, nh));
            drawer.style.height = nh + 'px';
            const content = $('drawerContent');
            if (content) {
                content.style.display = (nh > h.mini + 30) ? 'block' : 'none';
            }
            if (e.cancelable) e.preventDefault();
        }
        function onEnd() {
            if (!dragging) return;
            dragging = false;
            drawer.classList.remove('is-dragging');
            const h = getH(), cur = drawer.offsetHeight;
            const t1 = (h.mini + h.half) / 2, t2 = (h.half + h.full) / 2;
            let target = (cur < t1) ? 'mini' : (cur < t2) ? 'half' : 'full';
            setPanelState(target);
        }
        // 阻止抽屉内的 touchmove 冒泡到地图
        drawer.addEventListener('touchmove', function(e) {
            e.stopPropagation();
        }, { passive: true });

        handle.addEventListener('touchstart', onStart, { passive: false });
        handle.addEventListener('touchmove', onMove, { passive: false });
        handle.addEventListener('touchend', onEnd);
        handle.addEventListener('touchcancel', onEnd);

        // 鼠标点击切换
        let clickMoved = false;
        handle.addEventListener('mousedown', function (e) { clickMoved = false; onStart(e); });
        document.addEventListener('mousemove', function (e) { if (dragging) { clickMoved = true; onMove(e); } });
        document.addEventListener('mouseup', function (e) { if (dragging) onEnd(); });
        handle.addEventListener('click', function (e) { if (!clickMoved) togglePanel(); });

        // 软键盘监听
        lastH = window.innerHeight;
        window.addEventListener('resize', function () {
            const nh = window.innerHeight;
            if (Math.abs(nh - lastH) > 80) {
                if (nh < lastH) { $('bottomNav').style.transform = 'translateY(100%)'; $('bottomNav').style.opacity = '0'; }
                else { $('bottomNav').style.transform = ''; $('bottomNav').style.opacity = '1'; }
            }
            lastH = nh;
        });
        window.addEventListener('orientationchange', function () {
            setTimeout(function () { try { S.map.invalidateSize && S.map.invalidateSize(); } catch (e) {} }, 300);
        });
    }

        if (window.AMap && typeof AMap.PlaceSearch !== 'undefined') {
            showLoading('搜索中...', '正在查找附近设施', false);
            try {
                if (!S.ps) S.ps = new AMap.PlaceSearch({ extensions: 'all', pageSize: 20, pageIndex: 1, autoFitView: false });
                S.ps.searchNearBy({
                    keywords: type === 'charge' ? '电动汽车充电站|充电桩' : '停车场',
                    location: [center.lng, center.lat],
                    radius: S.searchRadius * 1000,
                    pageIndex: 1
                }, function (status, result) {
                    hideLoading();
                    if (status === 'complete' && result.poiList && result.poiList.pois && result.poiList.pois.length > 0) {
                        S.pois = result.poiList.pois.map(function (poi) {
                            var p = parsePoi(poi);
                            if (!p.type) p.type = type === 'charge' ? '充电' : '停车';
                            return p;
                        });
                        S.pois.sort(function (a, b) { return a.distance - b.distance; });
                        refreshCurrent();
                        setPanelState('half');
                        toast('找到 ' + S.pois.length + ' 个结果', 'success');
                    } else {
                        useMockNearbyData(type, center);
                    }
                });
            } catch (e) { hideLoading(); useMockNearbyData(type, center); }
        } else {
            useMockNearbyData(type, center);
        }
    }
    function useMockNearbyData(type, center) {
        S.pois = type === 'charge' ? generateMockChargeData(center.lng, center.lat) : generateMockParkingData(center.lng, center.lat);
        S.pois.forEach(function (p) { p.distance = Math.round(hav(center.lng, center.lat, p.lng, p.lat)); });
        S.pois.sort(function (a, b) { return a.distance - b.distance; });
        refreshCurrent();
        setPanelState('half');
        toast('显示示例数据（' + S.pois.length + '）', 'warning');
    }

    // ---------- 事件绑定 ----------
    function initEvents() {
        // 初始化信息窗样式
        initInfoWindowStyle();

        const si = $('searchInput');
        const cb = $('clearSearchBtn');
        const sb = $('searchBtn');
        if (si) {
            si.addEventListener('input', function () {
                // 清除按钮智能显示
                if (cb) cb.style.display = this.value.trim() ? 'flex' : 'none';
                debouncedSearch.call(this);
            });
            si.addEventListener('focus', function () {
                const s = $('suggestions');
                if (s && s.innerHTML && s.innerHTML.trim()) s.style.display = 'block';
            });
            si.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); onSearchSubmit(); }
            });
        }
        if (sb) sb.addEventListener('click', onSearchSubmit);
        if (cb) cb.addEventListener('click', function (e) {
            e.preventDefault();
            if (si) si.value = '';
            this.style.display = 'none';
            S.kw = ''; hideSuggestions(); refreshCurrent();
        });
        const bl = $('btnLocate'); if (bl) bl.addEventListener('click', function () { doLocate(true); });
        const bi = $('btnZoomIn'); if (bi) bi.addEventListener('click', function () { try { S.map.zoomIn(); } catch (e) {} });
        const bo = $('btnZoomOut'); if (bo) bo.addEventListener('click', function () { try { S.map.zoomOut(); } catch (e) {} });
        const bf = $('btnRefresh');
        if (bf) bf.addEventListener('click', function () {
            if (S.kw) { S.kw = ''; if (si) si.value = ''; }
            refreshCurrent(); toast('数据已刷新', 'success');
        });
        // 任务二-1: 实时路况切换
        const bt = $('btnTraffic');
        if (bt) bt.addEventListener('click', function () {
            S.trafficOn = !S.trafficOn;
            if (S.trafficOn) {
                S.trafficLayer.show();
                bt.classList.add('active');
                toast('已开启实时路况', 'success');
            } else {
                S.trafficLayer.hide();
                bt.classList.remove('active');
                toast('已关闭实时路况', 'success');
            }
        });

        // 分层搜索按钮 - 充电桩（统一附近搜索，阶段2）
        const bsc = $('btnSearchCharge');
        if (bsc) bsc.addEventListener('click', function () {
            searchNearby('charge');
        });

        // 分层搜索按钮 - 停车场（统一附近搜索，阶段2）
        const bsp = $('btnSearchParking');
        if (bsp) bsp.addEventListener('click', function () {
            searchNearby('parking');
        });

        // 阶段2: 半径滑块初始化
        initNearBySearch();

        // 筛选按钮
        document.querySelectorAll('.filter-tag[data-filter]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.filter-tag[data-filter]').forEach(function (b) { b.style.background = ''; b.style.color = ''; b.style.fontWeight = ''; });
                btn.style.background = '#1677ff'; btn.style.color = '#fff'; btn.style.fontWeight = '700';
                const f = btn.dataset.filter;
                if (f === 'all') loadAllData();
                else if (f === 'nearby' || f === 'fastCharge') loadChargeData();
                else if (f === 'parking') loadParkingData();
            });
        });
        // 排序按钮
        document.querySelectorAll('.filter-tag.sort-tag').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.filter-tag.sort-tag').forEach(function (b) { b.classList.remove('active'); b.style.background = ''; b.style.color = ''; b.style.fontWeight = ''; });
                btn.classList.add('active');
                btn.style.background = '#52c41a'; btn.style.color = '#fff'; btn.style.fontWeight = '700';
                S.sort = btn.dataset.sort || 'distance';
                refreshCurrent();
                const label = S.sort === 'distance' ? '距离' : '价格';
                toast('按' + label + '排序', 'success');
            });
        });
        // 快捷筛选（面板内）
        document.querySelectorAll('.quick-filter-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                // 任务二-2: 多重筛选逻辑 - 取交集
                const f = btn.dataset.extraFilter;
                if (!S.extraFilters) S.extraFilters = [];
                const idx = S.extraFilters.indexOf(f);
                if (idx >= 0) {
                    // 已选中，取消该项
                    S.extraFilters.splice(idx, 1);
                    btn.classList.remove('active');
                    btn.style.background = ''; btn.style.color = ''; btn.style.borderColor = '';
                    toast('已取消: ' + (f === 'available' ? '空闲优先' : '仅快充'), 'success');
                } else {
                    // 未选中，添加（取交集）
                    S.extraFilters.push(f);
                    btn.classList.add('active');
                    btn.style.background = 'var(--primary-light)'; btn.style.color = 'var(--primary)'; btn.style.borderColor = 'var(--primary)';
                    const filterNames = S.extraFilters.map(function(x) { return x === 'available' ? '空闲' : '快充'; }).join('+');
                    toast('筛选: ' + filterNames, 'success');
                }
                refreshCurrent();
            });
        });
        // 排序下拉
        const ss = $('sortSelect'); if (ss) ss.addEventListener('change', function () { S.sort = this.value; refreshCurrent(); });
        const fs = $('filterSelect'); if (fs) fs.addEventListener('change', function () { 
            // 任务二-2: 全部类型时重置所有筛选条件
            if (this.value === 'all') {
                S.extraFilters = [];
                document.querySelectorAll('.quick-filter-btn').forEach(function (b) { 
                    b.classList.remove('active'); 
                    b.style.background = ''; b.style.color = ''; b.style.borderColor = ''; 
                });
            } else {
                // 其他类型单选（互斥）
                S.extraFilters = [this.value];
                document.querySelectorAll('.quick-filter-btn').forEach(function (b) { 
                    if (b.dataset.extraFilter === this.value) {
                        b.classList.add('active');
                        b.style.background = 'var(--primary-light)'; b.style.color = 'var(--primary)'; b.style.borderColor = 'var(--primary)';
                    } else {
                        b.classList.remove('active');
                        b.style.background = ''; b.style.color = ''; b.style.borderColor = ''; 
                    }
                }.bind(this));
            }
            refreshCurrent(); 
        });
        // 模式按钮
        document.querySelectorAll('.drawer-mode-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.drawer-mode-btn').forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                const m = btn.dataset.mode;
                if (m === 'charge') loadChargeData();
                else if (m === 'parking') loadParkingData();
            });
        });
        // POI列表点击
        const pl = $('poiList');
        if (pl) pl.addEventListener('click', function (e) {
            const t = e.target;
            const actionBtn = t.closest && t.closest('[data-action]');
            const card = t.closest && t.closest('.poi-card');
            const fav = t.closest && t.closest('.fav-icon');
            if (fav && card) {
                const idx = parseInt(card.dataset.idx, 10);
                const poi = S.filtered[idx];
                if (poi) { poi._fav = !poi._fav; updateFavorite(poi); renderPanel(); }
                e.preventDefault(); e.stopPropagation(); return;
            }
            if (actionBtn && card) {
                const idx = parseInt(actionBtn.dataset.idx, 10);
                const act = actionBtn.dataset.action;
                if (act === 'detail') showPoiDetail(idx);
                else if (act === 'nav') startNavigation(S.filtered[idx]);
                e.preventDefault(); e.stopPropagation(); return;
            }
            if (card) {
                const idx = parseInt(card.dataset.idx, 10);
                selectPoi(idx);
            }
        });
        // 面板内容滚动加载更多
        const pc = $('panelContent');
        if (pc) {
            pc.addEventListener('touchmove', function (e) { e.stopPropagation(); }, { passive: true });
            pc.addEventListener('scroll', throttle(function () {
                if (S.displayed >= S.filtered.length) return;
                const ms = pc.scrollHeight - pc.clientHeight;
                if (ms - pc.scrollTop < 120) {
                    const end = Math.min(S.displayed + 6, S.filtered.length);
                    const container = $('poiList');
                    for (let i = S.displayed; i < end; i++) container.appendChild(renderPoiCard(S.filtered[i], i));
                    S.displayed = end;
                    if (S.displayed >= S.filtered.length) { 
                        $('loadMoreIndicator').style.display = 'none'; 
                        $('noMoreIndicator').style.display = 'flex'; 
                        // 任务: 触底时请求下一页数据（带300ms防抖）
                        debounceLoadMore();
                    }
                }
            }, 250));
        }
        // 关闭按钮
        const dcb = $('detailCloseBtn'); if (dcb) dcb.addEventListener('click', closePoiDetail);
        const dbc = $('detailBackBtn'); if (dbc) dbc.addEventListener('click', backToList);
        const doEl = $('detailOverlay'); if (doEl) doEl.addEventListener('click', function (e) { if (e.target === doEl) closePoiDetail(); });
        const rcb = $('routeCloseBtn'); if (rcb) rcb.addEventListener('click', hideRoutePanel);
        // 路线输入框
        const rStart = $('routeStartInput'), rEnd = $('routeEndInput');
        const rPlan = $('routePlanBtn'), rSwap = $('routeSwapBtn');
        if (rSwap) rSwap.addEventListener('click', function () {
            if (!rStart || !rEnd) return; const t = rStart.value; rStart.value = rEnd.value; rEnd.value = t;
        });
        if (rPlan) rPlan.addEventListener('click', function () {
            if (!S.user) { toast('请先定位', 'warning'); return; }
            if (!rEnd || !rEnd.value.trim()) { toast('请输入终点', 'warning'); return; }
            if (S.geocoder) S.geocoder.getLocation(rEnd.value.trim(), function (status, result) {
                if (status === 'complete' && result.geocodes && result.geocodes.length) {
                    const loc = result.geocodes[0].location;
                    planRoute(S.user.lng, S.user.lat, loc.lng, loc.lat);
                    if (rStart) rStart.value = result.geocodes[0].formattedAddress || '当前位置';
                } else toast('未找到该地址', 'error');
            });
            else toast('路线服务不可用', 'error');
        });
        // 导航覆盖层
        const neb = $('naviExitBtn'); if (neb) neb.addEventListener('click', exitNavi);
        const nvb = $('naviVoiceBtn'); if (nvb) nvb.addEventListener('click', function () { this.classList.toggle('active'); });
        const nfb = $('naviFullBtn'); if (nfb) nfb.addEventListener('click', function () { toast('已显示完整路线', 'success'); });
        // 底部导航
        document.querySelectorAll('.nav-item').forEach(function (item) {
            item.addEventListener('click', function () {
                document.querySelectorAll('.nav-item').forEach(function (n) { n.classList.remove('active'); });
                item.classList.add('active');
                const nav = item.dataset.nav;
                if (nav === 'map') { closeSidePanel(); hideRoutePanel(); exitNavi(); setPanelState('half'); }
                else if (nav === 'favorites') showFavoritesPanel();
                else if (nav === 'route') { showRoutePanel(); setPanelState('mini'); }
                else if (nav === 'settings') showSettingsPanel();
            });
        });
        // 侧边栏关闭
        const scb = $('sideCloseBtn'); if (scb) scb.addEventListener('click', closeSidePanel);
        const soEl = $('sideOverlay'); if (soEl) soEl.addEventListener('click', closeSidePanel);
        // Loading关闭
        const lcb = $('loadingCloseBtn'); if (lcb) lcb.addEventListener('click', hideLoading);
        // 点击联想浮层外关闭
        document.addEventListener('click', function (e) {
            const sug = $('suggestions'); if (!sug) return;
            if (sug.style.display === 'block' && !sug.contains(e.target) && e.target.id !== 'searchInput' && e.target.closest && !e.target.closest('.search-container')) {
                sug.style.display = 'none';
            }
        });
        // 键盘
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePoiDetail(); closeSidePanel(); hideRoutePanel(); exitNavi(); } });
    }

        // 响应式校准
        window.addEventListener('resize', throttle(function () { calibratePanelHeights(); fixVhIssue(); }, 150));
        window.addEventListener('orientationchange', function () {
            setTimeout(function () { calibratePanelHeights(); fixVhIssue(); }, 300);
        });
        // 初始化校准
        setTimeout(calibratePanelHeights, 100);
        setTimeout(fixVhIssue, 150);
    
    // ---------- P2-缺陷1: 网络状态检测 ----------
    function updateNetworkStatus() {
        var isOnline = navigator.onLine;
        var banner = $('offlineBanner');
        if (banner) {
            if (isOnline) {
                banner.classList.remove('show');
            } else {
                banner.textContent = '⚠ 网络已断开';
                banner.className = 'offline-banner show';
            }
        }
    }
    window.addEventListener('online', function() { updateNetworkStatus(); toast('网络已恢复', 'success'); });
    window.addEventListener('offline', function() { updateNetworkStatus(); toast('网络已断开，请检查连接', 'warning'); });
    
    // ---------- 启动 ----------
    document.addEventListener('DOMContentLoaded', function () {
        initMap(); initPanelDrag(); initEvents(); updateNetworkStatus();
    });
    // 如果DOMContentLoaded已触发
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(function () { initMap(); initPanelDrag(); initEvents(); }, 100);
    }
})();

</script>

</body>
</html>
