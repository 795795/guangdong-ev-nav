        const items = [
            { label: '📍 设为起点', fn: function () { setUserLocation(lng, lat, '选中位置'); refreshCurrent(); closeLongPressMenu(); } },
            { label: '🔍 搜索附近', fn: function () { setUserLocation(lng, lat, '选中位置'); refreshCurrent(); closeLongPressMenu(); toast('搜索附近地点', 'success'); } }
        ];
        items.forEach(function (it) {
            const row = document.createElement('div');
            row.className = 'longpress-menu-item';
            row.textContent = it.label;
            row.onclick = it.fn;
            menu.appendChild(row);
        });
        setTimeout(function () { document.addEventListener('click', closeOnClick, { once: true }); }, 50);
    }
    function closeOnClick(e) {
        if (!e.target.closest || !e.target.closest('.longpress-menu')) closeLongPressMenu();
    }
    function closeLongPressMenu() { const m = $('longpressMenu'); if (m) m.style.display = 'none'; }
    // ---------- 地图移动后刷新 ----------
    function onMapMoveEnd() {
        if (!S.map || S.loading) return;
        try {
            const c = S.map.getCenter();
            if (c && S.user) {
                const d = hav(S.user.lng, S.user.lat, c.lng, c.lat);
                if (d > 3000) {
                    S.user = { lng: c.lng, lat: c.lat, label: '地图中心' };
                    refreshCurrent();
                    toast('已更新为地图中心附近', 'success');
                }
            } else if (c) { S.user = { lng: c.lng, lat: c.lat, label: '地图中心' }; refreshCurrent(); }
        } catch (e) {}
    }
    // ------------------------------------------------------------------


    // ---------- 收藏 ----------
    function updateFavorite(poi) {
        try {
            const favs = JSON.parse(localStorage.getItem('gdNavFavs') || '[]');
            let idx = -1;
            for (let i = 0; i < favs.length; i++) if (favs[i].id === poi.id) { idx = i; break; }
            if (poi._fav) { if (idx < 0) favs.push({ id: poi.id, name: poi.name, type: poi.type, lng: poi.lng, lat: poi.lat, address: poi.address }); }
            else { if (idx >= 0) favs.splice(idx, 1); }
            localStorage.setItem('gdNavFavs', JSON.stringify(favs));
            toast(poi._fav ? '已添加收藏' : '已取消收藏', 'success');
        } catch (e) { toast('收藏失败', 'error'); }
    }
    function showFavoritesPanel() {
        try {
            const favs = JSON.parse(localStorage.getItem('gdNavFavs') || '[]');
            $('sideTitle').textContent = '我的收藏 (' + favs.length + ')';
            $('sideContent').innerHTML = '';
            if (!favs.length) {
                const div = document.createElement('div'); div.className = 'empty-state';
                div.innerHTML = '<div class="empty-icon">⭐</div><div class="empty-text">暂无收藏</div><div class="empty-hint">点击POI卡片上的星星可添加</div>';
                $('sideContent').appendChild(div);
            } else {
                favs.forEach(function (fav) {
                    const div = document.createElement('div'); div.className = 'poi-card';
                    div.innerHTML = '<div class="poi-main"><div class="poi-name-wrap"><span class="fav-icon favorited">★</span><span class="poi-name">' + fav.name + '</span></div><div class="poi-dist" style="font-size:13px">' + fav.type + '</div></div>';
                    div.onclick = function () { setUserLocation(fav.lng, fav.lat, fav.name); closeSidePanel(); refreshCurrent(); toast('已定位到"' + fav.name + '"', 'success'); };
                    $('sideContent').appendChild(div);
                });
            }
            openSidePanel();
        } catch (e) { toast('读取收藏失败', 'error'); }
    }
    function showSettingsPanel() {
        const modeText = S.mode === 'charge' ? '充电' : S.mode === 'parking' ? '停车' : S.mode === 'gas' ? '加油' : '综合';
        $('sideTitle').textContent = '设置';
        $('sideContent').innerHTML =
            '<div class="pref-section-title">显示设置</div>' +
            '<div class="pref-row"><div><div class="pref-row-title">默认视图</div><div class="pref-row-sub">充电站/停车场/加油站</div></div><span class="pref-value">' + modeText + '</span></div>' +
            '<div class="pref-row"><div><div class="pref-row-title">地图缩放</div><div class="pref-row-sub">刷新时自动调整</div></div><span class="pref-value">自动</span></div>' +
            '<div class="pref-section-title">数据管理</div>' +
            '<div class="pref-row"><button type="button" class="pref-badge" id="clearFavBtn">清空收藏</button></div>';
        $('clearFavBtn').onclick = function () {
            try { localStorage.removeItem('gdNavFavs'); toast('已清空收藏', 'success'); showFavoritesPanel(); }
            catch (e) { toast('操作失败', 'error'); }
        };
        openSidePanel();
    }
    function openSidePanel() { $('sideOverlay').style.display = 'block'; setTimeout(function () { $('sidePanel').classList.add('show'); }, 20); }
    function closeSidePanel() { $('sidePanel').classList.remove('show'); setTimeout(function () { $('sideOverlay').style.display = 'none'; }, 350); }
    function sharePoi(poi) {
        const text = '【广东新能源导航】' + poi.name + ' (' + poi.address + ') - ' + fmtDist(poi.distance || 0);
        try {
            if (navigator.share) { navigator.share({ title: poi.name, text: text }).catch(function () {}); return; }
            if (navigator.clipboard) { navigator.clipboard.writeText(text).then(function () { toast('已复制分享内容', 'success'); }); return; }
            toast(text.substring(0, 25) + '...', 'success');
        } catch (e) { toast('分享失败', 'error'); }
    }
    // ---------- 面板拖拽 ----------
    function initPanelDrag() {
        const handle = $('panelDragHandle'), panel = $('bottomPanel');
        if (!handle || !panel) return;
        let startY = 0, startH = 0, dragging = false, lastH = 0;
        function getH() {
            const vh = window.innerHeight || 480;
            return { mini: 48, half: Math.max(200, Math.min(vh * 0.45, 420)), full: Math.max(260, Math.min(vh * 0.7, 600)) };
        }
        function onStart(e) {
            dragging = true;
            const pt = e.touches ? e.touches[0] : e;
            startY = pt.clientY; startH = panel.offsetHeight;
            panel.classList.add('is-dragging');
            if (e.cancelable) e.preventDefault();
        }
        function onMove(e) {
            if (!dragging) return;
            const pt = e.touches ? e.touches[0] : e;
            const delta = startY - pt.clientY;
            const h = getH();
            let nh = startH + delta;
            nh = Math.max(h.mini, Math.min(h.full, nh));
            panel.style.height = nh + 'px';
            if (nh > h.mini + 30) { $('panelContent').style.display = 'block'; $('panelModes').style.display = 'flex'; }
            else { $('panelContent').style.display = 'none'; $('panelModes').style.display = 'none'; }
            if (e.cancelable) e.preventDefault();
        }
        function onEnd() {
            if (!dragging) return;
            dragging = false;
            panel.classList.remove('is-dragging');
            const h = getH(), cur = panel.offsetHeight;
            const t1 = (h.mini + h.half) / 2, t2 = (h.half + h.full) / 2;
            let target = (cur < t1) ? 'mini' : (cur < t2) ? 'half' : 'full';
            setPanelState(target);
        }
        handle.addEventListener('touchstart', onStart, { passive: false });
        handle.addEventListener('touchmove', onMove, { passive: false });
        handle.addEventListener('touchend', onEnd);
        handle.addEventListener('touchcancel', onEnd);

        // 鼠标点击切换
        let clickMoved = false;
        handle.addEventListener('mousedown', function (e) { clickMoved = false; onStart(e); });
        document.addEventListener('mousemove', function (e) { if (dragging) { clickMoved = true; onMove(e); } });
        document.addEventListener('mouseup', function (e) { if (dragging) onEnd(); });
        handle.addEventListener('click', function (e) { if (!clickMoved) togglePanel(); });

        // 软键盘监听
        let lastH = window.innerHeight;
        window.addEventListener('resize', function () {
            const nh = window.innerHeight;
            if (Math.abs(nh - lastH) > 80) {
                if (nh < lastH) { $('bottomNav').style.transform = 'translateY(100%)'; $('bottomNav').style.opacity = '0'; }
                else { $('bottomNav').style.transform = ''; $('bottomNav').style.opacity = '1'; }
            }
            lastH = nh;
        });
        window.addEventListener('orientationchange', function () {
            setTimeout(function () { try { S.map.invalidateSize && S.map.invalidateSize(); } catch (e) {} }, 300);
        });
    }
    // ---------- 事件绑定 ----------
    function initEvents() {
        const si = $('searchInput');
        if (si) {
            si.addEventListener('input', debouncedSearch);
            si.addEventListener('focus', function () { const s = $('suggestions'); if (s && s.innerHTML && s.innerHTML.trim()) s.style.display = 'block'; });
            si.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); onSearchSubmit(); } });
        }
        const sb = $('searchBtn'); if (sb) sb.addEventListener('click', onSearchSubmit);
        const cb = $('clearSearchBtn');
        if (cb) cb.addEventListener('click', function (e) {
            e.preventDefault();
            if (si) si.value = '';
            S.kw = ''; hideSuggestions(); refreshCurrent();
        });
        const bl = $('btnLocate'); if (bl) bl.addEventListener('click', function () { doLocate(true); });
        const bi = $('btnZoomIn'); if (bi) bi.addEventListener('click', function () { try { S.map.zoomIn(); } catch (e) {} });
        const bo = $('btnZoomOut'); if (bo) bo.addEventListener('click', function () { try { S.map.zoomOut(); } catch (e) {} });
        const bf = $('btnRefresh');
        if (bf) bf.addEventListener('click', function () {
            if (S.kw) { S.kw = ''; if (si) si.value = ''; }
            refreshCurrent(); toast('数据已刷新', 'success');
        });

        // 筛选按钮
        document.querySelectorAll('.filter-tag[data-filter]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.filter-tag[data-filter]').forEach(function (b) { b.style.background = ''; b.style.color = ''; b.style.fontWeight = ''; });
                btn.style.background = '#1677ff'; btn.style.color = '#fff'; btn.style.fontWeight = '700';
                const f = btn.dataset.filter;
                if (f === 'all') loadAllData();
                else if (f === 'nearby' || f === 'fastCharge') loadChargeData();
                else if (f === 'parking') loadParkingData();
                else if (f === 'gas') loadGasData();
            });
        });
        // 排序按钮
        document.querySelectorAll('.filter-tag.sort-tag').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.filter-tag.sort-tag').forEach(function (b) { b.style.background = ''; b.style.color = ''; b.style.fontWeight = ''; });
                btn.style.background = '#52c41a'; btn.style.color = '#fff'; btn.style.fontWeight = '700';
                S.sort = btn.dataset.sort || 'distance';
                refreshCurrent();
                const label = S.sort === 'distance' ? '距离' : S.sort === 'price' ? '价格' : S.sort === 'available' ? '空闲' : '名称';
                toast('按' + label + '排序', 'success');
            });
        });
        // 快捷筛选（面板内）
        document.querySelectorAll('.quick-filter-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const f = btn.dataset.extraFilter;
                if (S.extraFilter === f) { S.extraFilter = null; btn.style.background = ''; btn.style.color = ''; btn.style.borderColor = ''; toast('取消筛选', 'success'); }
                else {
                    S.extraFilter = f;
                    document.querySelectorAll('.quick-filter-btn').forEach(function (b) { b.style.background = ''; b.style.color = ''; b.style.borderColor = ''; });
                    btn.style.background = '#e6f4ff'; btn.style.color = '#1677ff'; btn.style.borderColor = '#1677ff';
                    toast('筛选: ' + (f === 'available' ? '空闲优先' : f === 'fastCharge' ? '仅快充' : '最近'), 'success');
                }
                refreshCurrent();
            });
        });
        // 排序下拉
        const ss = $('sortSelect'); if (ss) ss.addEventListener('change', function () { S.sort = this.value; refreshCurrent(); });
        const fs = $('filterSelect'); if (fs) fs.addEventListener('change', function () { S.extraFilter = this.value === 'all' ? null : this.value; refreshCurrent(); });
        // 模式按钮
        document.querySelectorAll('.panel-mode-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.panel-mode-btn').forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                const m = btn.dataset.mode;
                if (m === 'charge') loadChargeData();
                else if (m === 'parking') loadParkingData();
                else if (m === 'gas') loadGasData();
            });
        });
        // POI列表点击
        const pl = $('poiList');
        if (pl) pl.addEventListener('click', function (e) {
            const t = e.target;
            const actionBtn = t.closest && t.closest('[data-action]');
            const card = t.closest && t.closest('.poi-card');
            const fav = t.closest && t.closest('.fav-icon');
            if (fav && card) {
                const idx = parseInt(card.dataset.idx, 10);
                const poi = S.filtered[idx];
                if (poi) { poi._fav = !poi._fav; updateFavorite(poi); renderPanel(); }
                e.preventDefault(); e.stopPropagation(); return;
            }
            if (actionBtn && card) {
                const idx = parseInt(actionBtn.dataset.idx, 10);
                const act = actionBtn.dataset.action;
                if (act === 'detail') showPoiDetail(idx);
                else if (act === 'nav') startNavigation(S.filtered[idx]);
                e.preventDefault(); e.stopPropagation(); return;
            }
            if (card) {
                const idx = parseInt(card.dataset.idx, 10);
                selectPoi(idx);
            }
        });
        // 面板内容滚动加载更多
        const pc = $('panelContent');
        if (pc) {
            pc.addEventListener('touchmove', function (e) { e.stopPropagation(); }, { passive: true });
            pc.addEventListener('scroll', throttle(function () {
                if (S.displayed >= S.filtered.length) return;
                const ms = pc.scrollHeight - pc.clientHeight;
                if (ms - pc.scrollTop < 120) {
                    const end = Math.min(S.displayed + 6, S.filtered.length);
                    const container = $('poiList');
                    for (let i = S.displayed; i < end; i++) container.appendChild(renderPoiCard(S.filtered[i], i));
                    S.displayed = end;
                    if (S.displayed >= S.filtered.length) { $('loadMoreIndicator').style.display = 'none'; $('noMoreIndicator').style.display = 'flex'; }
                }
            }, 250));
        }
        // 关闭按钮
        const dcb = $('detailCloseBtn'); if (dcb) dcb.addEventListener('click', closePoiDetail);
        const doEl = $('detailOverlay'); if (doEl) doEl.addEventListener('click', function (e) { if (e.target === doEl) closePoiDetail(); });
        const rcb = $('routeCloseBtn'); if (rcb) rcb.addEventListener('click', hideRoutePanel);
        // 路线输入框
        const rStart = $('routeStartInput'), rEnd = $('routeEndInput');
        const rPlan = $('routePlanBtn'), rSwap = $('routeSwapBtn');
        if (rSwap) rSwap.addEventListener('click', function () {
            if (!rStart || !rEnd) return; const t = rStart.value; rStart.value = rEnd.value; rEnd.value = t;
        });
        if (rPlan) rPlan.addEventListener('click', function () {
            if (!S.user) { toast('请先定位', 'warning'); return; }
            if (!rEnd || !rEnd.value.trim()) { toast('请输入终点', 'warning'); return; }
            if (S.geocoder) S.geocoder.getLocation(rEnd.value.trim(), function (status, result) {
                if (status === 'complete' && result.geocodes && result.geocodes.length) {
                    const loc = result.geocodes[0].location;
                    planRoute(S.user.lng, S.user.lat, loc.lng, loc.lat);
                    if (rStart) rStart.value = result.geocodes[0].formattedAddress || '当前位置';
                } else toast('未找到该地址', 'error');
            });
            else toast('路线服务不可用', 'error');
        });
        // 导航覆盖层
        const neb = $('naviExitBtn'); if (neb) neb.addEventListener('click', exitNavi);
        const nvb = $('naviVoiceBtn'); if (nvb) nvb.addEventListener('click', function () { this.classList.toggle('active'); });
        const nfb = $('naviFullBtn'); if (nfb) nfb.addEventListener('click', function () { toast('已显示完整路线', 'success'); });
        // 底部导航
        document.querySelectorAll('.nav-item').forEach(function (item) {
            item.addEventListener('click', function () {
                document.querySelectorAll('.nav-item').forEach(function (n) { n.classList.remove('active'); });
                item.classList.add('active');
                const nav = item.dataset.nav;
                if (nav === 'map') { closeSidePanel(); hideRoutePanel(); exitNavi(); setPanelState('half'); }
                else if (nav === 'favorites') showFavoritesPanel();
                else if (nav === 'route') { showRoutePanel(); setPanelState('mini'); }
                else if (nav === 'settings') showSettingsPanel();
            });
        });
        // 侧边栏关闭
        const scb = $('sideCloseBtn'); if (scb) scb.addEventListener('click', closeSidePanel);
        const soEl = $('sideOverlay'); if (soEl) soEl.addEventListener('click', closeSidePanel);
        // Loading关闭
        const lcb = $('loadingCloseBtn'); if (lcb) lcb.addEventListener('click', hideLoading);
        // 点击联想浮层外关闭
        document.addEventListener('click', function (e) {
            const sug = $('suggestions'); if (!sug) return;
            if (sug.style.display === 'block' && !sug.contains(e.target) && e.target.id !== 'searchInput' && e.target.closest && !e.target.closest('.search-container')) {
                sug.style.display = 'none';
            }
        });
        // 键盘
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePoiDetail(); closeSidePanel(); hideRoutePanel(); exitNavi(); } });
    }

        // 响应式校准
        window.addEventListener('resize', throttle(function () { calibratePanelHeights(); fixVhIssue(); }, 150));
        window.addEventListener('orientationchange', function () {
            setTimeout(function () { calibratePanelHeights(); fixVhIssue(); }, 300);
        });
        // 初始化校准
        setTimeout(calibratePanelHeights, 100);
        setTimeout(fixVhIssue, 150);
    
    // ---------- 启动 ----------
    document.addEventListener('DOMContentLoaded', function () {
        initMap(); initPanelDrag(); initEvents();
    });
    // 如果DOMContentLoaded已触发
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(function () { initMap(); initPanelDrag(); initEvents(); }, 100);
    }
})();

</script>

</body>
